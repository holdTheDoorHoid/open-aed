name: Firmware tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (simulation only; real-data tests skip because recordings are not in the repository)
        run: cargo test --workspace
      - name: Build device-side code for a bare-metal processor
        run: cargo build -p aed-types -p aed-core -p aed-rhythm -p aed-waveform -p aed-cpr --target thumbv8m.main-none-eabihf
