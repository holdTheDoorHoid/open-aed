# Infineon EXCELON LP 4-Mbit SPI F-RAM, 8-pin SOIC 208 mil (EIAJ). No stock KiCad symbol for the CY15B104Q family.
# Pin 7 is DNU (do not use; "leave floating or tie to VDD"), not HOLD as on older F-RAMs.
[[symbol]]
name = "CY15B104QN-50SXI"
reference = "U"
value = "CY15B104QN-50SXI"
footprint = "Package_SO:SOIC-8_5.3x5.3mm_P1.27mm"
datasheet = "https://www.infineon.com/dgdl/Infineon-CY15B104QN_CY15V104QN_Excelon(TM)_LP_4-Mbit_(512K_X_8)_Serial_(SPI)_F-RAM-DataSheet-v12_00-EN.pdf"
description = "Infineon CY15B104QN 4 Mbit (512K x 8) SPI F-RAM, 1.8-3.6 V, 50 MHz, -40..+85 C, 8-SOIC 208 mil"
mpn = "CY15B104QN-50SXI"
manufacturer = "Infineon Technologies"
pinout_source = "Infineon 002-19436 Rev. *O (2023-06-05), Figure 2 '8-pin SOIC pinout' and Table 1 'Pin definitions'"
keywords = "FRAM F-RAM SPI nonvolatile memory"
package_pins = 8
pins = """
1 ~{CS}  input     left
6 SCK    input     left
5 SI     input     left
3 ~{WP}  input     left
2 SO     tri_state right
7 DNU    no_connect right
8 VDD    power_in  top
4 VSS    power_in  bottom
"""
