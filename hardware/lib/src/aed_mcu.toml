# Custom symbols for work package WP-B (sheets 04_main_mcu and 05_supervisor_mcu).
# NOT FOR CONSTRUCTION — unreviewed design (SAFETY.md §2a).
# Source of truth for hardware/lib/aed_mcu.kicad_sym: tools/build.sh regenerates that file from here.
#
# Pin table columns:  number  name  electrical-type  side-of-body
# Every pin row was copied from the datasheet table named in `pinout_source`.
# PinoutVerified reads "NO - drafted from datasheet ..., needs human check" until a person has checked the
# table against the PDF and added  pinout_verified = "YES - <name>, <date>, checked against <doc rev>".
#
# The main controller (STM32U585ZIT6) uses KiCad's stock symbol MCU_ST_STM32U5:STM32U585ZITx; its pin numbers
# and names were cross-checked against DS13086 Rev 10 Table 27 (see capture-notes/WP-B.md). Only parts with no
# correct stock symbol are defined here.

[library]
name = "aed_mcu"

# NXP MCX A153 in LQFP64 (10 x 10 mm, 0.5 mm pitch, package drawing 98ASS23234W).
# Pin names are the datasheet "Pin Name" column; for pins whose reset function is not a plain GPIO the reset
# function is appended after a slash (RESET_B, crystal, SWD, ISP mode), so the drawn symbol shows it.
# 52 GPIO-capable pins (incl. RESET_B, crystal and SWD pins), 4 x VDD, 4 x VSS, VDD_ANA, VDD_USB, USB0_DM, USB0_DP.
# There is no separate VREFH/VREFL or VSS_ANA pin in this package (bonded internally; Table 42 says VREFH must
# be at VDD_ANA potential and VSS_ANA at VSS). There is no core-regulator capacitor pin.
[[symbol]]
name = "MCXA153VLH"
reference = "U"
value = "MCXA153VLH"
footprint = "Package_QFP:LQFP-64_10x10mm_P0.5mm"
datasheet = "https://www.nxp.com/docs/en/data-sheet/MCXAP064M096F30.pdf"
description = "NXP MCX A153 Arm Cortex-M33 96 MHz MCU, 128 KB flash, 32 KB SRAM, LQFP64; supervisor controller"
mpn = "MCXA153VLH"
manufacturer = "NXP Semiconductors"
pinout_source = "NXP MCXAP064M096F30 Rev. 5.2 (26 May 2026), section 7.1 Table 41 'Pin Assignments', column MCXA14x15x LQFP64"
keywords = "MCU NXP MCX A153 Cortex-M33 supervisor"
package_pins = 64
pins = """
49 P0_0/SWDIO        bidirectional left
50 P0_1/SWCLK        bidirectional left
