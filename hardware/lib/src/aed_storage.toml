# Custom symbols for sheet 11_hv_storage (work package WP-F storage).
# Source of truth for hardware/lib/aed_storage.kicad_sym: tools/build.sh regenerates that file from here.
#
# NOT FOR CONSTRUCTION — unreviewed design (SAFETY.md §2a).
#
# Pin table columns:  number  name  electrical-type  side-of-body
# Every pin row was copied from the datasheet named in `pinout_source` (read 27 Nov 2026).
# PinoutVerified is set to "NO - drafted from datasheet ..., needs human check" automatically; a human who has
# checked the table against the PDF changes it by adding
#   pinout_verified = "YES - <name>, <date>, checked against <doc rev>"
# All pins are 'passive' on purpose: these parts sit on nets whose drivers are other parts or other sheets, and
# 'power_in' pins would hide a net join (spec.py check) or create false ERC errors.

[library]
name = "aed_storage"

[[symbol]]
name = "IXTT2N170D2"
reference = "Q"
value = "IXTT2N170D2"
footprint = "Package_TO_SOT_SMD:TO-268-2"
datasheet = "https://static.datasheets.com/doc/13418158-ixys-ixtt2n170d2-ds.pdf (mirror of IXYS DS100418B(02/12))"
description = "IXYS/Littelfuse N-channel DEPLETION-mode MOSFET (normally on), 1700 V, RDS(on) <= 6.5 ohm at VGS = 0, VGS(off) -2.0..-4.0 V, TO-268 (D3PAK). Datasheet DS100418B(02/12). Replaces IXTT10N100D2 on sheet 11 (design rev 0.3, F-1)."
mpn = "IXTT2N170D2"
manufacturer = "Littelfuse (IXYS)"
pinout_source = "DS100418B(02/12) page 2, 'TO-268 Outline, Terminals: 1 - Gate, 2,4 - Drain, 3 - Source' (read 2026-11-27). The datasheet numbers the tab 4 and the trimmed centre lead 2; the KiCad TO-268-2 footprint numbers the tab pad 2 (no centre-lead pad), so symbol pin 2 = drain = tab"
keywords = "depletion MOSFET normally-on 1700V discharge"
package_pins = 3
pins = """
1 G  passive left
2 D  passive top
3 S  passive bottom
"""

[[symbol]]
name = "TLP187"
reference = "U"
value = "TLP187"
footprint = "Package_SO:Toshiba_SOIC-4-6_4.4x3.6mm_P1.27mm"
datasheet = "https://toshiba.semicon-storage.com/info/TLP187_datasheet_en_20260727.pdf?did=13690&prodName=TLP187"
description = "Toshiba photocoupler, infrared LED + photo-DARLINGTON, VCEO 300 V, CTR >= 1000 % at IF = 1 mA / VCE = 1 V, 3750 Vrms, SO6 (4 pins), -55..110 C. Datasheet Rev 6.0, 2026-07-27"
mpn = "TLP187(TPL,E"
manufacturer = "Toshiba Electronic Devices & Storage"
pinout_source = "TLP187 datasheet Rev 6.0 (2026-07-27) section 4 'Packaging and Pin Configuration 11-4M1S': 1 Anode, 3 Cathode, 4 Emitter, 6 Collector"
keywords = "optocoupler darlington photocoupler held sense"
package_pins = 4
pins = """
1 A  passive left
3 K  passive left
6 C  passive right
4 E  passive right
"""
