# Custom symbols for WP-D shock logic (sheets 09_interlock and 12_bridge_logic).
# Source of truth for hardware/lib/aed_logic.kicad_sym: tools/build.sh regenerates that file from here.
#
# NOT FOR CONSTRUCTION — unreviewed design.
#
# Pin table columns:  number  name  electrical-type  side-of-body
# Every pin row was copied from the datasheet table named in `pinout_source` (datasheets fetched 2026-11-27 from the
# manufacturer's own site; see hardware/aed-main/capture-notes/WP-D.md, part list).
# PinoutVerified is set to "NO - drafted from datasheet ..., needs human check" automatically; a human who has checked
# the table against the PDF changes it by adding  pinout_verified = "YES - <name>, <date>, checked against <doc rev>".
#
# Electrical types chosen for ERC, not for the datasheet's own I/O column:
#   TPS22918 VIN and VOUT are 'passive' because the six switches are chained (VOUT of one is VIN of the next) and two
#   pairs are in parallel (SW2a/SW2b on one node, SW4/SW5 on BRIDGE_5V); 'power_out' on both would be an ERC error.
#   The rail BRIDGE_5V is flagged once, on 09_interlock, which makes it (contract §4).

[library]
name = "aed_logic"

[[symbol]]
name = "TPS22918DBV"
reference = "U"
value = "TPS22918DBVR"
footprint = "Package_TO_SOT_SMD:SOT-23-6"
datasheet = "https://www.ti.com/lit/ds/symlink/tps22918.pdf"
description = "TI TPS22918 5.5 V 2 A load switch, 52 mOhm, adjustable rise time (CT), configurable quick output discharge (QOD), SOT-23-6 (DBV)"
mpn = "TPS22918DBVR"
manufacturer = "Texas Instruments"
pinout_source = "TI SLVSD76C (Feb 2016, rev. Jul 2017), section 5 'Pin Configuration and Functions', DBV package"
keywords = "load switch interlock"
pins = """
1 VIN   passive  left
3 ON    input    left
4 CT    passive  left
6 VOUT  passive  right
5 QOD   passive  right
2 GND   power_in bottom
"""

