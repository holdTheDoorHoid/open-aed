# Open AED — main project hierarchy (one KiCad project, `aed-main`).
#
# NOT FOR CONSTRUCTION — unreviewed design. Nothing here has been reviewed by a qualified high-voltage or
# medical-device engineer, and nothing has been built. See SAFETY.md §2a and docs/HARDWARE_DESIGN.md.
#
# Contract issue 2 (after the independent review and D-59..D-61): 16 sheets, 8 capture work packages.
#
# Pages in order. Sheets 01-09 are the LOW-VOLTAGE group; sheets 10-16 are the HIGH-VOLTAGE / PATIENT group.
# If layout splits the design into a low-voltage board and a high-voltage board, the split runs between the two
# groups and every net that crosses it is listed in contract.md §6 ("board-split nets").
#
# Reference blocks (contract.md §2): sheet NN uses NN01..NN99 for every prefix (R1201, C1201, U1201 ...);
# sheets 01-09 therefore use 101..999 (sheet 1 = 101..199). Overflow block for a sheet = its block + 5000
# (sheet 12 overflow = 6201..6299). Root: H1..H9, NT1..NT9 only (the HV_RTN ties are NT1101, NT1102 on sheet 11).
#
# Every sheet is a placeholder until its capture work package (contract.md §1) adds specs/<name>.toml.
# Edit only through the integrator: capture packages do not edit this file (contract.md §1).

[project]
name = "aed-main"
title = "Open AED belt-worn defibrillator, main electronics"
company = "Open AED project — CERN-OHL-S-2.0 — NOT FOR CONSTRUCTION"
notice = "NOT FOR CONSTRUCTION — unreviewed design"
revision = "A-draft"
date = "2026-11-27"
root_spec = "specs/00_root.toml"
lib_dir = "../lib"

# ------------------------------------------------------------------ low-voltage group (pages 2-10)

[[sheet]]
name = "01_power_battery"
title = "2S Li-ion pack: connector, MAX17320 protector and gauge, cell NTCs, main fuse, battery load test"
doc = "docs/HARDWARE_DESIGN.md §B1.1-B1.3"
owner = "WP-A power"
note = "Refs 101-199. Makes VBAT_PACK and VBAT_SYS. Battery-under-load path (BAT_LOAD_EN) with hardware time limit."

[[sheet]]
name = "02_power_dock"
title = "Dock contacts, input protection, BQ25887 2S charger (0-45 C), dock data transceiver"
doc = "docs/HARDWARE_DESIGN.md §B1.4-B1.5"
owner = "WP-A power"
note = "Refs 201-299. Makes VDOCK. Contacts are dead when undocked (D-46). One data contact (Q-47 option a)."

[[sheet]]
name = "03_power_rails"
title = "Rails: 5V0_SYS, independent 3V3_MAIN and 3V3_SUP regulators, 3V3_AON, power-on logic, RTC wake timer, ready latch and LED"
doc = "docs/HARDWARE_DESIGN.md §B1.6-B1.8, §B11"
owner = "WP-A power"
note = "Refs 301-399. Main and supervisor regulators are separate parts with separate fuses (single failure cannot take out both)."

[[sheet]]
name = "04_main_mcu"
title = "Main controller STM32U585ZIT6: clocks, SWD, NOR flash (event record), FRAM (durable store), link buffers"
doc = "docs/HARDWARE_DESIGN.md §B2"
owner = "WP-B controllers"
note = "Refs 401-499. Fits the pull-ups the contract assigns to the main controller's readers (open-drain readbacks)."

[[sheet]]
name = "05_supervisor_mcu"
title = "Supervisor controller NXP MCXA153VLH: own crystal, SWD, own alarm sounder and fault light, capacitor NTC (supervisor)"
doc = "docs/HARDWARE_DESIGN.md §B2, §B10"
owner = "WP-B controllers"
note = "Refs 501-599. Powered only from 3V3_SUP. D-26 alarm is driven from this sheet alone."

[[sheet]]
name = "06_ui"
title = "User interface: memory LCD, speaker and class-D amplifier, cancel button (two contacts), adult/child switch, power button"
doc = "docs/HARDWARE_DESIGN.md §B10"
owner = "WP-C ui+sense"
note = "Refs 601-699. Cancel contacts: CANCEL_M_N to main, CANCEL_S_N to supervisor, no shared conductor except GND."

[[sheet]]
name = "07_sense_main"
title = "Main capacitor-voltage chain: ADS1220 + REF3425, output-node sense inputs, capacitor NTC, LOWV_OK (60 V) comparator"
doc = "docs/HARDWARE_DESIGN.md §B9"
owner = "WP-C ui+sense"
note = "Refs 701-799. Receives the scaled divider tap VCAP_M_TAP from 11_hv_storage (the HV string is not on this sheet)."

[[sheet]]
name = "08_sense_sup"
title = "Supervisor capacitor-voltage chain: AD7171 + ADR3425, hardware over-voltage comparator"
doc = "docs/HARDWARE_DESIGN.md §B9, §B4.6"
owner = "WP-C ui+sense"
note = "Refs 801-899. Different resistor, ADC and reference families from 07_sense_main (D-28, parts study §7)."

[[sheet]]
name = "09_interlock"
title = "Hardware interlock: consent detectors (permit, test permit), hold-drive buffers, held logic, 150 ms window, test mode, charger gates, bridge-power switches SW1-SW5"
doc = "docs/HARDWARE_DESIGN.md §B8"
owner = "WP-D shock logic"
note = "Refs 901-999. Implements interlock.rs in discrete logic. Every consent input has its default resistor on this sheet."

# ------------------------------------------------------------------ high-voltage / patient group (pages 11-17)

[[sheet]]
name = "10_hv_charger"
title = "HIGH VOLTAGE: LT3751 flyback charger, eFuse VTRANS switch, made-to-order transformer, two series rectifiers + fusible resistor, child FB ceiling"
doc = "docs/HARDWARE_DESIGN.md §B4"
owner = "WP-E charger"
note = "Refs 1001-1099 (overflow 6001-6099). VTRANS_EN (session, soft start) and CHARGE_EN (CHARGE pin after VTRANS_GOOD) are separate (contract issue 2)."

[[sheet]]
name = "11_hv_storage"
title = "HIGH VOLTAGE: capacitor terminals, bleeder, both sense strings, discharge stacks A and B (4 devices each), hold pumps, opto hold sense and OVP force, HV_RTN-GND ties"
doc = "docs/HARDWARE_DESIGN.md §B5"
owner = "WP-F storage"
note = "Refs 1101-1199 (overflow 6101-6199). 'Held' exists only as an optocoupler LED lit by the gate bias (R-6)."

[[sheet]]
name = "12_bridge_logic"
title = "Shock sequencer (D-59): BRIDGE_3V3 with hold-up, order and lockouts, latched 25 ms cap, fault latches, relay coil timing, turn-off order, status outputs"
doc = "docs/HARDWARE_DESIGN.md §B13, §B14"
owner = "WP-D shock logic"
note = "Refs 1201-1299 (overflow 6201-6299). Low-voltage logic placed on the high-voltage board next to the power stage. Discrete logic only."

[[sheet]]
name = "13_hv_bridge"
title = "HIGH VOLTAGE: H-bridge (4 x 3.3 kV SiC), R_S + L_S with freewheel diode, gated push-pull high-side drive, low-side drivers, current sense and comparators, bridge test load"
doc = "docs/HARDWARE_DESIGN.md §B6"
owner = "WP-G bridge power"
note = "Refs 1301-1399 (overflow 6301-6399). Every turn-off is low side first; coil current freewheels through D1301."

[[sheet]]
name = "14_patient_interface"
title = "PATIENT: patient relay with coil supply, hold-up and aux contact; pad connector; pad identity and presence; pad-area NTC"
doc = "docs/HARDWARE_DESIGN.md §B7"
owner = "WP-H patient+front ends"
note = "Refs 1401-1499. At rest the pads connect to the front ends; the relay cannot transfer in test mode."

[[sheet]]
name = "15_frontend_main"
title = "PATIENT: main heart-signal and pad-impedance front end ADS1292R with defibrillation protection"
doc = "docs/HARDWARE_DESIGN.md §B3"
owner = "WP-H patient+front ends"
note = "Refs 1501-1599."

[[sheet]]
name = "16_frontend_sup"
title = "PATIENT: supervisor's independent pad-impedance front end MAX30009 with defibrillation protection"
doc = "docs/HARDWARE_DESIGN.md §B3.6"
owner = "WP-H patient+front ends"
note = "Refs 1601-1699. Makes 1V8_SUP locally."

# ------------------------------------------------------------------ net classes
# Spacing values are PLACEHOLDERS [UNVERIFIED]: IEC 60601-1 Table 12 above 566 V and IEC 60601-2-4 have not been
# bought. HV uses the IPC-2221 external-uncoated extrapolation at 2.5 kV (12.5 mm); PATIENT uses the 4.0 mm
# defibrillation-proof applied-part clearance (docs/HARDWARE_DESIGN.md §B12). Net-class clearance in KiCad is the
# larger of the two classes, so HV-to-HV gaps inside one string need custom rules (.kicad_dru) at layout.

[[net_class]]
name = "Default"
track_width = 0.15
clearance = 0.15
via_diameter = 0.6
via_drill = 0.3

[[net_class]]
name = "PWR"
track_width = 0.5
clearance = 0.2

[[net_class]]
name = "PWR_HI"
note = "battery and charger-primary paths: up to 21 A peak, about 9 A average for 7 s"
track_width = 3.0
clearance = 0.3

[[net_class]]
name = "RTN_PULSE"
note = "HV_RTN and the bridge's low-side source node: ground potential, 65 A pulses (review R-18)"
track_width = 3.0
clearance = 0.3

[[net_class]]
name = "HV"
note = "anything galvanically connected to the storage capacitor or the charger secondary: up to 2,200 V"
track_width = 0.5
clearance = 12.5

[[net_class]]
name = "HV_PULSE"
note = "shock-current path: 65 A normal peak, about 450 A fault, up to 2,200 V"
track_width = 3.0
clearance = 12.5

[[net_class]]
name = "HV_FLOAT"
note = "high-side gate-drive circuits that float with a bridge output (0 to 2,200 V)"
track_width = 0.3
clearance = 12.5

[[net_class]]
name = "PATIENT"
note = "applied part: pad lines at rest and front-end protection inputs (5 kV external-defibrillator test pulse)"
track_width = 0.3
clearance = 4.0

[[netclass_pattern]]
netclass = "RTN_PULSE"
pattern = "HV_RTN"
[[netclass_pattern]]
netclass = "RTN_PULSE"
pattern = "*LS_SRC*"
[[netclass_pattern]]
netclass = "HV_PULSE"
pattern = "HV_CAP_P"
[[netclass_pattern]]
netclass = "HV_PULSE"
pattern = "*HV_BUS*"
[[netclass_pattern]]
netclass = "HV_PULSE"
pattern = "HV_OUT_*"
[[netclass_pattern]]
netclass = "HV_PULSE"
pattern = "PT_PAD_*"
[[netclass_pattern]]
netclass = "HV_FLOAT"
pattern = "*HSA_*"
[[netclass_pattern]]
netclass = "HV_FLOAT"
pattern = "*HSB_*"
[[netclass_pattern]]
netclass = "HV"
pattern = "*HV_*"
[[netclass_pattern]]
netclass = "PATIENT"
pattern = "*PT_*"
[[netclass_pattern]]
netclass = "PWR_HI"
pattern = "VBAT_*"
[[netclass_pattern]]
netclass = "PWR_HI"
pattern = "*VTRANS*"
[[netclass_pattern]]
netclass = "PWR"
pattern = "VDOCK"
[[netclass_pattern]]
netclass = "PWR"
pattern = "5V0_SYS"
[[netclass_pattern]]
netclass = "PWR"
pattern = "BRIDGE_5V"
[[netclass_pattern]]
netclass = "PWR"
pattern = "3V3_*"
