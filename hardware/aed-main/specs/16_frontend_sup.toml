# 16_frontend_sup — PATIENT: the supervisor's own pad-impedance front end, MAX30009 (H-bridge drive), with
# defibrillation protection on every tap; 1V8_SUP LDO; 1.8 V -> 3.3 V translator for the SPI data-out line.
# NOT FOR CONSTRUCTION — unreviewed design. Source: docs/HARDWARE_DESIGN.md §B3.1, §B3.2, §B3.4 (cross-loading), §B3.6;
# contract.md issue 3 (§4, §5.8, §8, §10); change order capture-notes/rev3-changes.md WP-H H-5 (96 kHz carrier, no circuit
# change). Capture notes: hardware/aed-main/capture-notes/WP-H.md. References 1601-1699.

[sheet]
name = "16_frontend_sup"
title = "PATIENT: supervisor pad-impedance front end MAX30009 (H-bridge drive) with defibrillation protection; 1V8_SUP LDO"
source = "docs/HARDWARE_DESIGN.md v0.3 §B3.6; hardware/aed-main/contract.md issue 3 §4, §5.8, §8, §10; rev3-changes.md WP-H H-5; capture notes WP-H"
date = "2026-11-27"
comments = ["Carrier 96 kHz (design v0.3 §B3.6, I-18, change order H-5): 128 kHz would alias into the ADS1292R ECG channel (its modulator samples at 128 kHz). A register setting: no circuit change.",
            "Drive: H-bridge voltage mode through 20 k DPCR + 10 k per pad (ADI's own defibrillation-protected application uses H-bridge + series R); ~30 uA."]

[nets]
power = ["GND", "3V3_SUP", "1V8_SUP"]
global = [
  "PT_FE_A", "PT_FE_B",                # from 14
  "SBZ_SCLK", "SBZ_MOSI", "SBZ_CS_N",  # 05 -> 16
  "SBZ_MISO", "SBZ_INT_N",             # 16 -> 05
]

[[erc_accepted]]
type = "power_pin_not_driven"
match = "/16_frontend_sup/"
until_sheet = "03_power_rails"
reason = "3V3_SUP is made on 03_power_rails and GND on 01_power_battery (WP-A), placeholders in this worktree; no package flags another package's rail (contract §4). 1V8_SUP is made here by U1602 (power output)."

[[erc_accepted]]
type = "pin_not_driven"
match = "SBZ_SCLK|SBZ_MOSI|SBZ_CS_N|U1601 Pin (D2|E4)"
until_sheet = "05_supervisor_mcu"
reason = "SPI is driven by the supervisor on 05_supervisor_mcu (WP-B, placeholder here); this sheet's 100 k pull-up on SBZ_CS_N (contract §5.8) keeps the chip deselected meanwhile."

[[erc_accepted]]
type = "isolated_pin_label"
match = "SBZ_"
reason = "Other end on 05_supervisor_mcu (WP-B, placeholder in this worktree). Disappears at the merge."


[[erc_accepted]]
type = "pin_to_pin"
match = "U1601 Pin D4"
reason = "TRIG is an unused bidirectional pin tied to GND as the MAX30009 datasheet directs. KiCad warns because GND carries the power flag from 01_power_battery; only visible once all sheets are merged."

# ====================================================================== groups
[[group]]
id = "drive"
title = "Drive taps (EL1 -> pad A, EL4 -> pad B): 2 x 4.7 nF 3 kV C0G + DPCR2512 20 k + TVS to GND + 10 k"
note = """
H-bridge drive (BIOZ_DRV_MODE = 2): EL1 and EL4 switch between AVDD and AGND; current = AVDD / (2 x Rseries) = 1.8 / (2 x 30 k) = 30 uA (square), set by the resistors, not by the chip [CALC]. The chip does not limit current in this mode: the 2.35 nF per pad blocks DC (single-fault: one capacitor shorted still blocks). 20 k is DPCR's lowest standard value (5 kV pulse-tested); 10 k inner limits the pin current to <= 0.7 mA (MAX30009 abs max +/-50 mA, pins clamp to AGND per its Figure 12).
External 5 kV pulse: <= 5 kV / 20 k = 0.25 A edge current, tau = 20 k x 2.35 nF = 47 us, ~29 mJ into the resistor [CALC]. DRVSJ, DRVXC, DRVXR unconnected (ADI defibrillation application circuit, H-bridge mode).
Idle: MUX_EN = 0 (reset default) disconnects all EL pins (datasheet register text) — required by contract §10 ('idle drive outputs high-impedance'); the unpowered pin state is NOT stated by the datasheet [UNVERIFIED].
"""

[[group]]
id = "sense"
title = "Sense taps (EL2B = BIP from pad A, EL3B = BIN from pad B): DPCR2512 51 k + TVS to GND + 20 k"
note = """
EL2B/EL3B use the chip's internal high-pass (no external capacitor), so the patient's DC potential (set by the main front end's RLD bias, ~1.65 V) is blocked inside the chip; DC current through these pins <= ~15 nA [CALC from the 48 Mohm input impedance]. 20 k inner resistors as in ADI's defibrillation application (RSEC 20 k). Pin current under the 5 kV test <= (7 V)/20 k = 0.35 mA.
EL2A/EL3A (external-coupling variants) unconnected. No test points (R9).
"""

[[group]]
id = "afe"
title = "U1601 MAX30009 (WLP-25), 4-wire calibration resistor, VREF"
note = """
Supplies AVDD = DVDD = 1V8_SUP (1.7-2.0 V), each 0.1 uF + 10 uF (pin table). VREF 1 uF. Operating range -40 to +85 C (datasheet, four places) - the design's [UNVERIFIED] item is now answered; the device itself is the narrowest-range part on these sheets.
Calibration: R1609 100 ohm 0.05 % across the CAL port (CAL1+CAL2 to one end, CAL3+CAL4 to the other, Kelvin at the resistor) for the datasheet's per-frequency gain/phase calibration; absolute accuracy of the pad reading also depends on the 5 % DPCR drive resistors (current is set by them in H-bridge mode) -> factory calibration at the pad connector with the other chip in its specified state (F-9) [whether the CAL port calibration applies in H-bridge mode is UNVERIFIED].
Carrier: 96 kHz, adopted in design v0.3 (I-18; PLL 24.576 MHz = 750 x 32.768 kHz, KDIV 1, DAC_OSR 256; firmware configuration record FW-20). No part changes on this sheet for revision 0.3. FCLK unconnected (datasheet: allowed), TRIG to GND (datasheet: when unused).
Interface: CSB/I2C_SEL = SBZ_CS_N with the contract's 100 k pull-up (SPI mode; firmware sets DISABLE_I2C). SCLK, SDI tolerate 5.5 V, so 3.3 V inputs are fine. SDO is a 1.8 V output (abs max 2.2 V): U1603 SN74LVC1T45 (A on 1V8_SUP, B on 3V3_SUP, DIR = A->B, Ioff both ports) drives SBZ_MISO at 3.3 V levels; R1612 holds A low while SDO is tri-stated. INT open drain, pulled up on 05.
"""

[[group]]
id = "ldo"
title = "1V8_SUP: TPS7A2018 from 3V3_SUP (made here, contract §4) + 1 k bleed as the rail's sink for injected current"
note = """
TPS7A2018PDBVR: 1.6-6.0 V in, 300 mA, 7 uVrms, -40..+125 C TJ; EN tied to IN (rail follows 3V3_SUP). COUT total ~22 uF (0.47-200 uF allowed).
No TVS exists that clamps below the MAX30009's 2.2 V abs max (lowest VBR found 4.0 V), so the contract's rail shunt clamp is replaced by a guaranteed sink: R1610 1 k = 1.8 mA, larger than the worst current the inner resistors can inject into the rail (<= ~1.1 mA) [CALC; notes]. Cost 3.2 mW while the supervisor rail is on.
"""

