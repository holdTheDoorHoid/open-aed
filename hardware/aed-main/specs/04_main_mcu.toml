# 04_main_mcu — main controller STM32U585ZIT6 (U401) with clocks, debug, event-record flash, durable-store F-RAM,
# Ioff receivers for the lines that come from other supply domains, and every default resistor the contract gives
# to the main controller's sheet.
# NOT FOR CONSTRUCTION — unreviewed design (SAFETY.md §2a). Nothing here is an instruction to build or power anything.
# Sources: docs/HARDWARE_DESIGN.md §B2, §B11, §F; hardware/aed-main/contract.md (issue 2) §2, §5, §7, §8, §9;
# ST DS13086 Rev 10 (July 2024) Table 27 (pin definitions), Tables 28/29 (alternate functions), Figure 24 (power
# supply scheme), Tables 80/81 (HSE/LSE), Table 102 (NRST). Pin assignment, arithmetic and doubts:
# hardware/aed-main/capture-notes/WP-B.md.

[sheet]
name = "04_main_mcu"
title = "Main controller STM32U585ZIT6: clocks, SWD, NOR flash (event record), FRAM (durable store), link buffers"
source = "docs/HARDWARE_DESIGN.md §B2, §B11; contract.md issue 2 §5, §8"
comments = ["Every U401 pin is in analog (high-impedance, no pull) state from reset until firmware configures it (DS13086 §3.13); every safe default comes from a resistor (contract §5)",
            "Pin assignment, alternate functions, reset states and arithmetic: hardware/aed-main/capture-notes/WP-B.md"]

[nets]
power = ["GND", "3V3_MAIN"]
flag_nodes = ["VDDA_M"]
global = [
  "PWR_BTN_N", "MAIN_KEEP", "SUP_WAKE", "EN_5V0", "RTC_INT_N", "READY_D", "READY_CLK", "I2C_M_SCL", "I2C_M_SDA",
  "DOCK_DET_N", "GAUGE_ALRT_N", "BAT_LOAD_EN", "CHGR_INT_N", "CHGR_CE_N", "DOCK_TX", "DOCK_RX",
  "LINK_M2S", "LINK_S2M",
  "HOLD_M_CLK", "HOLD_RB_A_N", "HOLD_RB_B_N", "SHOCK_REQ", "BRIDGE_ARMED_N",
  "CHG_SESSION", "CHG_RUN", "CHG_DONE_N", "CHG_FAULT_N", "MODE_HW_RB_N",
  "HVM_SCLK", "HVM_MOSI", "HVM_CS_N", "HVM_MISO", "HVM_DRDY_N",
  "CMD_HA", "CMD_LA", "CMD_HB", "CMD_LB", "RELAY_CMD", "BTEST_CMD", "K_REST_N", "SEQ_ACT_M_N", "SEQ_DONE_M_N",
  "BR_FAULT_N", "I_SHOCK",
  "PAD_PRESENT_N", "PAD_ID_1W", "NTC_PADS",
  "AFE_SCLK", "AFE_MOSI", "AFE_CS_N", "AFE_START", "AFE_RESET_N", "AFE_MISO", "AFE_DRDY_N",
  "LCD_SCLK", "LCD_SI", "LCD_SCS", "LCD_BLANK", "I2S_BCLK", "I2S_LRCLK", "I2S_SD", "AMP_SD_N",
  "CANCEL_M_N", "MODE_ADULT_N", "MODE_CHILD_N",
