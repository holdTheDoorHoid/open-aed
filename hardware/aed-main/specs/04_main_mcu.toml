# ====================================================================== groups
[[group]]
id = "mcu"
title = "U401 STM32U585ZIT6 (LQFP144, LDO version without SMPS): every pin"
note = """
Pin numbers and names from KiCad's stock symbol STM32U585ZITx, cross-checked row by row against DS13086 Rev 10 Table 27 (LQFP144 column, non-SMPS). Alternate-function numbers from Tables 28/29. All 114 port pins are in analog mode after reset (DS13086 §3.13) except the debug pins PA13 (pull-up), PA14 (pull-down), PA15 (pull-up), PB4 (pull-up) and PB3 (Table 27 note 5); none of those five carries a contract signal.
Phase commands: one advanced timer, TIM1 channels 1-4 (PE9, PE11, PE13, PE14, AF1), with the sequencer fault BR_FAULT_N on TIM1's break input (PE15, AF1) so a sequencer fault also forces the timer outputs inactive. The bootloader's pins (marked "(boot)" in Table 27) carry no shock, consent or charger output.
Consent clock HOLD_M_CLK (PD12) is a plain GPIO toggled by the control loop (F-1); TIM4_CH1 is on the same pin for a one-pulse-mode variant, never a free-running timer.
"""

[[group]]
id = "supply"
title = "U401 supply decoupling (DS13086 Figure 24) and VDDA filter"
note = """
VDD: 9 pins, 100 nF each + 10 uF. VDDIO2 (port G is used, so it is tied to 3V3_MAIN): 2 x 100 nF + 4.7 uF. VDDA and VREF+ (tied together; the ADC reference is the analog supply, needed because I_SHOCK spans 0-3.2 V): 100 nF + 1 uF each, fed from 3V3_MAIN through a ferrite bead (VDDA_M). VDDUSB (USB not used): to VDD as the datasheet prefers, 100 nF. VBAT: no backup cell (the RV-3028 on 03 keeps time), tied to VDD with 100 nF. VCAP (LDO output): 4.7 uF, ESR < 20 mOhm at 3 MHz, >= 10 V (DS13086 §5.1.6).
"""

[[group]]
id = "clock"
title = "Clocks: 16 MHz HSE crystal (core, bridge timer) and 32.768 kHz LSE crystal"
note = """
HSE: ABM8 16 MHz, CL 10 pF, ESR <= 70 Ohm, C0 <= 3 pF. Load caps 10 pF C0G each: CL = 10*10/(10+10) + Cstray (~4.5 pF est.) = 9.5 pF. Crystal gm_crit = 4*ESR*(2*pi*f)^2*(C0+CL)^2 = 0.48 mA/V < Gmcritmax 1.5 mA/V (Table 80).
LSE: ABS07 32.768 kHz, CL 7 pF, ESR <= 70 kOhm. Load caps 4.7 pF C0G each: CL = 2.35 pF + Cstray (CS_PARA 3-5 pF + ~1 pF board) = 6.4-8.4 pF. gm_crit = 0.96 uA/V: needs LSEDRV = medium-high (1.7 uA/V max, Table 81). No resistor across OSC32_IN/OUT (forbidden by ST).
"""

[[group]]
id = "reset"
title = "Reset, boot strap and SWD pads"
note = """
NRST: internal 30-50 kOhm pull-up (Table 102) + 100 nF to GND. PH3-BOOT0: 10 kOhm to GND = boot from user flash (Table 6). Firmware should also program nSWBOOT0 = 0, nBOOT0 = 1 so a lifted BOOT0 resistor cannot start the bootloader (capture-notes, firmware requirement).
J401: Tag-Connect TC2030-NL pads (no fitted connector), reachable only with the enclosure open (§B2.5). Separate from the supervisor's pads J501: no debug path joins the controllers.
"""

[[group]]
id = "mem"
title = "Event record W25Q128JV (16 MB NOR) and durable store CY15B104QN (4 Mbit F-RAM) on SPI3"
note = """
Shared SPI3 (PG9 SCK, PG10 MISO, PG11 MOSI), two software chip selects with 10 kOhm pull-ups so both memories stay deselected while U401 is in reset. Flash /WP (IO2) and /HOLD (IO3) pulled up (single-SPI use; on the IQ part QE = 1 and they are spare data pins). F-RAM /WP tied to VDD ("must be tied to VDD if not used", Infineon Table 1); pin 7 is DNU, left open. 100 nF at each VCC.
"""

[[group]]
id = "rx"
title = "Ioff receivers on 3V3_MAIN (rule R7): link from the supervisor and the always-on wake lines"
note = """
SN74LVC1G17 Schmitt buffers, Ioff <= 10 uA with VCC = 0 (SCES351Y). LINK_S2M: 100 kOhm to GND (an unpowered supervisor reads as a continuous break) + 1 kOhm series + Schmitt (contract 5.3). PWR_BTN_N, RTC_INT_N and DOCK_DET_N are pulled up to 3V3_AON on sheet 03; they enter U401 only through these buffers, so a powered-down main controller loads nothing and an unpowered 3V3_MAIN is never fed from 3V3_AON through a protection diode.
"""

[[group]]
id = "pulls"
title = "Default resistors the contract assigns to sheet 04 (readers' pull-ups on 3V3_MAIN)"
note = """
Open-drain readbacks and status lines: 100 kOhm up, so open, unpowered or unsoldered reads "not held / not armed / not active / not done / no fault / not at rest / not fitted" (R11). Contacts read by the main: 10 kOhm up (CANCEL_M_N, MODE_ADULT_N, MODE_CHILD_N). I2C_M bus 4.7 kOhm. PAD_ID_1W 2.2 kOhm. DOCK_TX 100 kOhm up (UART idle).
"""

[[group]]
id = "analog"
title = "ADC inputs: I_SHOCK anti-alias filter and pad-area NTC bias"
note = """
I_SHOCK (26.7 mV/A after the 2:3 divider on 13, 0-3.2 V): 1 kOhm + 4.7 nF C0G, corner 1/(2*pi*1k*4.7n) = 33.9 kHz, below half of a >= 100 kS/s sampling rate; the 1 kOhm also limits current into the pin if the divider on 13 fails open.
NTC_PADS (10 kOhm NTC to GND on sheet 14): 10.0 kOhm 0.1 % bias to VDDA_M, ratiometric to the ADC reference (VREF+ = VDDA_M), then 1 kOhm + 100 nF at the pin.
"""

