# 15_frontend_main — PATIENT: main heart-signal (ECG, channel 2) and pad-impedance (respiration channel 1, 64 kHz)
# front end, ADS1292R, with defibrillation protection on every tap from PT_FE_A / PT_FE_B.
# NOT FOR CONSTRUCTION — unreviewed design. Source: docs/HARDWARE_DESIGN.md v0.3 §B3.1-B3.4, §B3.7; contract.md issue 3
# (§5.7, §5.8, §8, §10); change order capture-notes/rev3-changes.md WP-H H-4 (separate ECG sense resistors, D-67). Capture notes, arithmetic and failure table: hardware/aed-main/capture-notes/WP-H.md.
# References 1501-1599.

[sheet]
name = "15_frontend_main"
title = "PATIENT: main ECG + pad-impedance front end ADS1292R (64 kHz respiration carrier) with defibrillation protection"
source = "docs/HARDWARE_DESIGN.md v0.3 §B3; hardware/aed-main/contract.md issue 3 §5.8, §8, §10; rev3-changes.md WP-H H-4; capture notes WP-H"
date = "2026-11-27"
comments = ["Every tap: patient side = defibrillator-rated DPCR resistor (+ 2 x 3 kV C0G on drive taps) -> TVS to GND -> inner resistor -> chip pin.",
            "Excitation is limited by the ADS1292R itself (100 uA max): ~80 uA here, NOT the 0.34 mA the design assumed (notes).",
            "Revision 0.3 (H-4, D-67): the ECG branch has its own 51 k DPCR sense resistors R1528/R1529 and clamps D1506/D1507, so the ECG filter C1505 no longer shunts the 64 kHz impedance signal."]

[nets]
power = ["GND", "3V3_MAIN"]
global = [
  "PT_FE_A", "PT_FE_B",                 # from 14 (relay rest contacts)
  "AFE_SCLK", "AFE_MOSI", "AFE_CS_N", "AFE_START", "AFE_RESET_N",   # 04 -> 15
  "AFE_MISO", "AFE_DRDY_N",             # 15 -> 04
]
flag_nodes = ["AVDD_AFE"]   # analog supply fed from 3V3_MAIN through ferrite FB1501

[[erc_accepted]]
type = "power_pin_not_driven"
match = "/15_frontend_main/"
until_sheet = "03_power_rails"
reason = "3V3_MAIN is made on 03_power_rails and GND on 01_power_battery (WP-A), placeholders in this worktree; no package flags another package's rail (contract §4)."

[[erc_accepted]]
type = "pin_not_driven"
match = "AFE_SCLK|AFE_MOSI|AFE_CS_N|AFE_START|AFE_RESET_N|U1501 Pin (14|15|16|18|19|20)"
until_sheet = "04_main_mcu"
reason = "SPI, START and PWDN/RESET are driven by the main controller on 04_main_mcu (WP-B, placeholder here); this sheet's 100 k default resistors (contract §5.8) define CS high, START low, RESET low meanwhile."

[[erc_accepted]]
type = "isolated_pin_label"
match = "AFE_"
reason = "Other end on 04_main_mcu (WP-B, placeholder in this worktree). Disappears at the merge."


# ====================================================================== groups
[[group]]
id = "drive"
title = "Drive taps (respiration excitation RESP_MODP -> pad A, RESP_MODN -> pad B): 2 x 4.7 nF 3 kV C0G + 2 x 24 k DPCR in parallel + TVS + 2.0 k"
note = """
Excitation: the ADS1292R modulator is a square wave of amplitude VREFP (2.42 V) with a datasheet MAXIMUM of 100 uA (SBAS502C EC p.8); current = 2.42 V / loop impedance. Loop = 2 x (12 k + 2.0 k) + 2 x 1.06 k (2.35 nF at 64 kHz) + pads <= 0.25 k = 30.4 k -> ~80 uA [CALC]. The design's '1 k drive resistor, 0.34 mA' is impossible with this chip (contract issue).
Why DPCR 24 k x 2 in parallel instead of the contract's 1 k pulse resistor: an external 5 kV defibrillator pulse puts up to ~5 kV across this resistor before the 2.35 nF charges (tau = 12 k x 2.35 nF = 28 us); no 1 k part found is rated above ~1.75 kV (Vishay CRCW2512-HP Umax), while TT DPCR is tested with 100 pulses of 5 kV peak (IEC 60601-2-27). DPCR's range starts at 20 k, so two 24 k (E24) in parallel give 12 k. Each sees <= 5 kV, ~15 mJ per external pulse (1/2 C V^2 split) [CALC].
Capacitors (two in series per pad, so one shorted capacitor still blocks DC): C0G 4.7 nF 3 kV exists only in 3640 (Knowles AEC-Q200 range; Vishay/KEMET max 3.3-4 nF) [MPN derived from the ordering code: verify]. Voltage per capacitor: own shock 2,182 V -> <= 1.1 kV; external 5 kV -> ~1.25 kV balanced, <= 2.5 kV one-sided.
TVS D1501/D1502 Bourns CDSOD323-T03C (bidirectional, VWM 3.3 V, VBR >= 4.0 V, 350 W 8/20 us, 3 pF, 5 uA): takes the edge current (<= 5 kV / 12 k = 0.42 A, tau 28 us). It CANNOT clamp below the chip's 3.6 V abs max (no 3.3 V TVS has VBR < 4 V): the 2.0 k inner resistor limits the pin current to <= (6.5 - 3.6) / 2 k = 1.5 mA, inside the chip's +/-10 mA continuous rating.
"""

[[group]]
id = "sense"
title = "Sense taps, two per pad: impedance R1507/R1508 51 k DPCR + TVS + 10 k + 2.2 nF (IN1); ECG R1528/R1529 51 k DPCR + TVS + 10 k (IN2)"
note = """
External 5 kV pulse: <= 98 mA one-sided (49 mA balanced) through each 51 k; <= 0.74 J one-sided per pulse (V^2 tau / 2R with tau = 3.4 ms); DPCR rating = 100 pulses of 5 kV peak, single-pulse curve ~1.5 kW at 1 ms. Own shock 2,182 V for up to 20 ms (relay fault): 43 mA, 93 W, 1.9 J per resistor; curve ~250 W at 20 ms [CALC; curve values read from the graph].
TVS currents 43-98 mA for milliseconds: energy small (<= 5 mJ) but outside the 8/20 us rating basis [UNVERIFIED for ms pulses]. Chip pin current through 10 k <= 0.34 mA.
ECG (channel 2): IN2P/IN2N DC-coupled through 61 k per side; C1505 470 pF C0G differential: 2.8 kHz pole against the charger's 3-43 kHz band [CALC]. IN2 common mode set by the RLD amplifier (below).
Respiration (channel 1): R1507/R1508 -> clamp D1503/D1504 (PT_MSA_CL/PT_MSB_CL) -> 10 k + 2.2 nF C0G into IN1P/IN1N, biased at mid-supply by 10 M to AVDD and 10 M to GND each (datasheet Figure 68 arrangement).
Revision 0.3 (H-4): in issue 2 the ECG resistors R1509/R1510 hung on the same clamp nodes, so C1505 (5.3 k at 64 kHz) shunted ~85 % of the impedance signal (simulated 25-34 mohm RMS against < 10 mohm, LR §6). Now the ECG branch has its own R1528/R1529 51 k DPCR from PT_FE_A/PT_FE_B to new clamp nodes PT_ESA_CL/PT_ESB_CL with D1506/D1507 (same parts as R1507/D1503). Simulated (sim/rev3-wph/imp_ecg_noise_wph.cir): IN1 sees 0.97 of the pad voltage (was 0.17); impedance noise 4.6-6.3 mohm RMS (chip noise 0.13 uV/rtHz EST). ECG gain 0.99 and ECG resistor noise 0.28 uV RMS (0.5-40 Hz) unchanged.
Protection per tap unchanged (each new resistor/TVS sees what R1507/D1503 see: 5 kV external pulse one-sided 97 mA, 0.83 J; own shock bound 2,409 V for 19.9 ms 47 mA, 2.26 J) [SIM rev3-wph fe_protect_wph.cir]. Resistive sense taps per pad rise from 2 x 51 k (R1507 + the supervisor's R1605) to 3 x 51 k, so pad to pad 51 k -> 34 k: diverts ~0.3 % (was ~0.2 %) of an external defibrillator's energy into a 100 ohm patient [CALC].
No test points (R9).
"""

[[group]]
id = "rld"
title = "Bias with two electrodes: RLD amplifier as mid-supply driver into both ECG inputs through 10 M"
note = """
No third (right-leg) electrode exists. With RESP2.RLDREF_INT = 1 the RLD amplifier references (AVDD+AVSS)/2; RLDOUT drives each ECG input node through 10 M (R1513, R1514), which sets the patient's DC potential (the drive taps are DC-blocked, so this is the only DC path). Feedback R1527 1 M || C1507 1.5 nF (datasheet typical). RLDIN/RLDREF tied to AVDD (datasheet: 'connect to AVDD if not used'). Whether to also sense the IN2 common mode (RLD_SENS) is a firmware choice [the datasheet gives no explicit two-electrode guidance: UNVERIFIED].
DC patient current from this path: both pads at the same potential -> ~0; with a 300 mV electrode offset <= 15 nA [CALC].
"""

[[group]]
id = "afe"
title = "U1501 ADS1292R: channel 1 = impedance (respiration, internal clock, 64 kHz, RESP_CTRL = 0), channel 2 = ECG 250/s"
note = """
Clock: CLKSEL = 1 (internal 512 kHz, +/-1.5 % over -40..+85 C); CLK 3-stated (CLK_EN = 0), held by 100 k. 64 kHz respiration needs RESP_CTRL = 0 (internal clock mode) and RESP2.RESP_FREQ = 1. Recommended at 64 kHz: channel 1 gain 2 or 3, phase 135-157.5 deg (SBAS502C p.63).
Reference: internal 2.42 V (CONFIG2.PDB_REFBUF = 1 required: power-up default is external), VREFP 10 uF || 0.1 uF; VREFN = AVSS. VCAP1, VCAP2 1 uF (datasheet: C0G/tantalum if the board vibrates — belt-worn, CPR: X7R used here, flagged).
PGA filters: 47 nF across PGA1P/N (respiration; three datasheet places say 47 nF, one says 4.7 nF: flagged), 4.7 nF across PGA2P/N.
GPIO1/2 unused: to GND through 10 k (datasheet). Supplies: AVDD_AFE from 3V3_MAIN via ferrite, 10 u + 1 u + 0.1 u; DVDD 3V3_MAIN 1 u + 0.1 u. AVDD shunt clamp D1505 ESD5Z3.3 (VBR >= 5.0 V, below the 5.5 V abs max): backup only; the real limit on injected current is the inner resistors (<= ~4 mA total, absorbed by 3V3_MAIN's load) [notes].
Contract defaults: AFE_CS_N 100 k up, AFE_START 100 k down, AFE_RESET_N 100 k down (held in reset until the main controller releases it).
"""

