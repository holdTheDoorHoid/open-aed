# 08_sense_sup - supervisor's capacitor-voltage chain and the hardware over-voltage comparator.
# NOT FOR CONSTRUCTION — unreviewed design.
# Source: docs/HARDWARE_DESIGN.md §B9.1, §B4.4 (threshold stack-up), §B4.6, §B5.4 (OVP force); contract.md issue 2
# §5.4 (OVP_TRIP), §5.6, §8 (sheet 08). References 801-899. Work package WP-C. Arithmetic: capture-notes/WP-C.md.
# Revision 0.3 (contract issue 3, capture-notes/rev3-changes.md WP-C C-2..C-5): latching OVP comparator with an
# edge-only reset (OVP_RST) and a test input (OVP_TEST). Checks: sim/rev3-wpc (ovp_band.py, ovp_latch.cir).
# The supervisor string (12 x 3.32 MOhm thin film + 2 x 79.6 kOhm) and its tap clamp are on 11_hv_storage.

[sheet]
name = "08_sense_sup"
title = "Supervisor capacitor-voltage chain: AD7171 + ADR3425, latching hardware over-voltage comparator"
source = "docs/HARDWARE_DESIGN.md v0.3 §B9.1, §B4.4, §B4.6, §B14.5 (T-6); contract.md issue 3 §5.4, §5.6"
date = "2026-11-27"
comments = [
  "Shares nothing with 07_sense_main: own rail 3V3_SUP, ADI ADC and reference, a different op-amp and comparator family, internal ADC clock (D-28).",
  "OVP_TRIP trips at 2,107 V nominal (2,071-2,141 V worst case, -20..+70 C) and LATCHES: it stays high for any capacitor voltage until an OVP_RST rising edge or loss of 3V3_SUP (revision 0.3). OVP_TEST injects a trip at 0 V for the self-test T-6.",
]

[nets]
power = ["GND", "3V3_SUP", "VREF_S"]
global = [
  "VCAP_S_TAP",               # 11 -> 08, scaled capacitor voltage 1:1,002
  "HVS_SCLK", "HVS_PDRST_N",  # 05 -> 08
  "HVS_DOUT",                 # 08 -> 05
  "OVP_TRIP",                 # 08 -> 11 (Q1111 gate), 05 ; high = over-voltage, latched (issue 3)
  "OVP_RST",                  # 05 -> 08 ; rising edge clears the latch (issue 3)
  "OVP_TEST",                 # 05 -> 08 ; high = inject a trip (issue 3)
]

[[erc_accepted]]
type = "power_pin_not_driven"
match = "#PWR8001 "
until_sheet = "03_power_rails"
reason = "#PWR8001 = 3V3_SUP (KiCad reports the power symbol, not the net). 3V3_SUP is made by U302 on 03_power_rails (WP-A, placeholder in this worktree); contract §4."

[[erc_accepted]]
type = "power_pin_not_driven"
match = "GND"
until_sheet = "01_power_battery"
reason = "GND is made on 01_power_battery (WP-A, placeholder in this worktree); contract §4."

[[erc_accepted]]
type = "pin_not_driven"
match = "U801 Pin (1|9) "
until_sheet = "05_supervisor_mcu"
reason = "Driven by the supervisor U501 on 05_supervisor_mcu (WP-B, placeholder here). HVS_PDRST_N has its 100 kOhm pull-down R804 here (contract §5.6)."

[[erc_accepted]]
type = "isolated_pin_label"
match = "VCAP_S_TAP"
until_sheet = "11_hv_storage"
reason = "Driven from the supervisor string tap on 11_hv_storage (WP-F), placeholder in this worktree."

[[erc_accepted]]
type = "isolated_pin_label"
match = "HVS_|OVP_TRIP|OVP_RST|OVP_TEST"
until_sheet = "05_supervisor_mcu"
reason = "Partner is the supervisor on 05_supervisor_mcu (WP-B); OVP_TRIP also goes to Q1111 on 11_hv_storage. OVP_RST and OVP_TEST are new in contract issue 3 and sheet 05 may still be at issue 2 (single-ended until WP-B draws them)."

[[group]]
id = "tap"
title = "VCAP_S_TAP input: 100 kOhm + 10 nF, OPA388 zero-drift follower (feeds the ADC and the OVP comparator)"
note = """
VCAP_S_TAP = Vcap x 39.8 k / (39.84 M + 39.8 k) = Vcap / 1,002.0 (string on 11; contract says 1:1,000). 1,950 V -> 1.946 V; 2,160 V -> 2.156 V.
R801 100 kOhm meets R7: 3.6 V clamped tap into an unpowered OPA388 -> at most 33 uA (abs. max. +-10 mA, SBOS777D 6.1). R801 + C801: 1.6 ms.
U804 OPA388: Vos 5 uV max (7.5 uV over temperature), IB 350 pA max at 25 C / 400 pA 0-85 C (SBOS777D 6.7) -> 0.4 nA x 150 kOhm = 60 uV = 0.06 V of capacitor voltage. It is a different family (zero-crossover, not chopper) from the main chain's OPA333. An Analog Devices ADA4528-1 was preferred for maker diversity but its data sheet could not be retrieved (capture notes).
R802 1 MOhm to 3V3_SUP: a failed-open follower reads full scale -> OVP trips (a detected, no-shock failure, like §13 fault 16a) instead of hiding an over-voltage.
"""

[[group]]
id = "adc"
title = "AD7171 16-bit delta-sigma ADC, 125 Hz, ratiometric to VREF_S (ADR3425)"
note = """
AIN+ = buffered tap through R803 1 k / C803 10 nF C0G; AIN- = GND; REFIN = VREF_S 2.5 V -> full scale 2.5 V = 2,505 V; LSB (offset binary, +-VREF) 76.3 uV = 76 mV of capacitor voltage.
AD7171 average input current 400 nA/V (Rev. C Table 2) -> 0.78 uA x 1 k = 0.78 mV static at 1.95 V: proportional to the input, so it is a gain term removed by calibration; its drift (60 pA/V/K) is 5 uV over 45 K.
Two-wire read-only interface: SCLK in (Schmitt), DOUT/RDY out. PDRST low = power-down/reset; R804 100 kOhm pull-down = default off (contract §5.6). Exposed pad to GND (Table 6).
Decoupling 100 nF + 1 uF at VDD.
"""

[[group]]
id = "ref"
title = "VREF_S = 2.5 V, ADR3425 (Analog Devices), supervisor chain only"
note = """
ADR3425ARJZ: +-0.1 % initial, 8 ppm/K max, 30 ppm / 1000 h at 50 C, thermal hysteresis 70 ppm, VIN 2.7-5.5 V, dropout 200 mV (Rev. B Table 5). Load: AD7171 reference 1 uA, threshold divider 0.1 mA. ENABLE tied to VIN (>= 0.85 VIN). Input 100 nF + 1 uF, output 1 uF + 100 nF (Rev. B 'Input and Output Capacitors': 1-10 uF input, 0.1 uF ceramic).
VREF_S is drawn as a power symbol made here by the reference's power_out pin (contract §4); used on this sheet only.
"""

[[group]]
id = "ovp"
title = "LATCHING over-voltage comparator OVP_TRIP (2,107 V), TLV9031 push-pull on 3V3_SUP (revision 0.3)"
note = """
U803 IN- = OVP_REF = VREF_S x 15.6 k / (21.5 k + 15.6 k) = 1.0512 V (0.1 % parts, C810 100 nF). IN+ = OVP_SENSE: R805 100 k from the buffered tap, R806 100 k from the output (Rin = Rf).
Trip (output low before): VCAPS_BUF = 2 x 1.0512 = 2.1024 V -> x 1,002.0 = 2,107 V nominal. Once OVP_TRIP is high (>= 2.1 V is enough) OVP_SENSE >= OVP_TRIP / 2 > OVP_REF for any tap >= 0 V: LATCHED.
Band [CALC, sim/rev3-wpc/ovp_band.py, worst case of every term, -20..+70 C]: 2,071-2,141 V (2,071-2,152 V if 100 nA of Q801 off-state leakage is assumed on OVP_SENSE). Bottom 62 V above the top of a normal adult charge (2,008.6 V); top 59 V (48 V) below the 2,200 V rating. Largest term: the supervisor string ratio (+-14 V).
Release: ONLY by an OVP_RST rising edge (group ovp_rst) or loss of 3V3_SUP. The issue-2 text (2,160 V, release near 1,000 V) is obsolete (C-5).
Power-up: TLV9031 SNOSDA3H rev. H deleted the power-on-reset feature, so the output state while 3V3_SUP rises is not guaranteed; powering up tripped is the safe direction (both paths forced on, no charge) and firmware clears it with an OVP_RST edge at switch-on (simulated untripped with an ideal comparator).
Output: push-pull, high = over-voltage -> Q1111 gate on 11 (100 kOhm pull-down there) and the supervisor (R7 receiver on 05). Load <= 0.1 mA: VOH within 0.1 V of 3V3_SUP. TLV9031 inputs fault-tolerant to 6 V regardless of V+ (SNOSDA3H 5.1).
Unpowered (3V3_SUP off) -> OVP_TRIP low = no force: accepted latent fault 33; 3V3_SUP off also stops HOLD_S_CLK, so stack B conducts anyway.
"""

[[group]]
id = "ovp_rst"
title = "OVP_RST: edge-only reset of the latch (C812 100 nF / R809 100 k into Q801 BSS138, 1 k to OVP_SENSE)"
note = """
OVP_RST rising edge -> OVP_RG jumps to 3.3 V and decays with 100 k x 100 nF = 10 ms; Q801 (VGS(th) 0.8-1.5 V at 1 mA, onsemi BSS138/D Rev. 7) conducts for 10 ms x ln(3.3/VGS(th)) = 7.9-14 ms and pulls OVP_SENSE to 3.2 V x 1 k / 101 k = 32 mV < OVP_REF: output low. After the pulse the latch stays clear if the capacitor is below the trip, and re-trips at once if it is not.
A line stuck HIGH cannot hold the latch clear (the gate decays through R809): simulated, sim/rev3-wpc case 'test_with_RST_stuck_high'. A falling edge drives the gate to about -3.3 V (VGS rating +-20 V).
R811 100 kOhm = contract default resistor (OVP_RST low).
"""

[[group]]
id = "ovp_test"
title = "OVP_TEST: test injection into the follower INPUT VCAPS_IN (R812 4.7 k + D801 BAS116) - departs from C-4, see note"
note = """
OVP_TEST high: VCAPS_IN = (OVP_TEST - VF) x 149.8 k / (149.8 k + 4.7 k) = 2.42-2.86 V [CALC: 3V3_SUP 3.2-3.4 V assumed, BAS116 VF 0.45-0.70 V at 15-20 uA EST] -> the follower, R805 and the comparator all see a tap above the trip (top of band 2.133 V at VCAPS_BUF, sheet-08 parts only): trips within about 0.1 ms. 149.8 k = R801 100 k + the string's tap source on 11 (10 k + 39.8 k).
DEPARTURE from change order C-4 (which injects at OVP_SENSE through 22 k): injecting after R805 leaves a single-part fault hidden: R805 open (the real tap can no longer reach the comparator, but the injected test still trips and latches) - simulated, sim/rev3-wpc case arr2_R805_open. Injecting at VCAPS_IN makes the test pass only through U804, R805 and U803; R801 open or C801 short is seen by the main/supervisor reading comparison as before.
Side effects: during the test the supervisor's own ADC reads full scale (> 2,500 V) - firmware must expect that in T-6 and not log it as a disagreement; VCAP_S_TAP on 11 rises to about 0.8 V (well inside its 3.6 V clamp).
OVP_TEST low: D801 is reverse biased by VCAPS_IN (<= 2.2 V); leakage <= 5 nA (BAS116LT1/D Rev. 14, 75 V 25 C) x 150 k = 0.75 mV = 0.75 V of reading (80 nA absolute bound at 150 C -> 12 V; at 70 C and 2 V far less [EST]).
R813 100 kOhm = contract default resistor (OVP_TEST low).
"""

