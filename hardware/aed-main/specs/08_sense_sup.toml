# 08_sense_sup - supervisor's capacitor-voltage chain and the hardware over-voltage comparator.
# NOT FOR CONSTRUCTION — unreviewed design.
# Source: docs/HARDWARE_DESIGN.md §B9.1, §B4.4 (threshold stack-up), §B4.6, §B5.4 (OVP force); contract.md issue 2
# §5.4 (OVP_TRIP), §5.6, §8 (sheet 08). References 801-899. Work package WP-C. Arithmetic: capture-notes/WP-C.md.
# The supervisor string (12 x 3.32 MOhm thin film + 2 x 79.6 kOhm) and its tap clamp are on 11_hv_storage.

[sheet]
name = "08_sense_sup"
title = "Supervisor capacitor-voltage chain: AD7171 + ADR3425, hardware over-voltage comparator"
source = "docs/HARDWARE_DESIGN.md §B9.1, §B4.4, §B4.6; contract.md §5.4, §5.6"
date = "2026-11-27"
comments = [
  "Shares nothing with 07_sense_main: own rail 3V3_SUP, ADI ADC and reference, a different op-amp and comparator family, internal ADC clock (D-28).",
  "OVP_TRIP trips at 2,160 V nominal (band 2,132-2,189 V worst case) and releases near 1,000 V: the forced dump continues well below the operating range.",
]

[nets]
power = ["GND", "3V3_SUP", "VREF_S"]
global = [
  "VCAP_S_TAP",               # 11 -> 08, scaled capacitor voltage 1:1,002
  "HVS_SCLK", "HVS_PDRST_N",  # 05 -> 08
  "HVS_DOUT",                 # 08 -> 05
  "OVP_TRIP",                 # 08 -> 11 (opto LEDs), 05 ; high = over-voltage
]

[[erc_accepted]]
type = "power_pin_not_driven"
match = "#PWR8001 "
until_sheet = "03_power_rails"
reason = "#PWR8001 = 3V3_SUP (KiCad reports the power symbol, not the net). 3V3_SUP is made by U302 on 03_power_rails (WP-A, placeholder in this worktree); contract §4."

[[erc_accepted]]
type = "power_pin_not_driven"
match = "GND"
until_sheet = "01_power_battery"
reason = "GND is made on 01_power_battery (WP-A, placeholder in this worktree); contract §4."

[[erc_accepted]]
type = "pin_not_driven"
match = "U801 Pin (1|9) "
until_sheet = "05_supervisor_mcu"
reason = "Driven by the supervisor U501 on 05_supervisor_mcu (WP-B, placeholder here). HVS_PDRST_N has its 100 kOhm pull-down R804 here (contract §5.6)."

[[erc_accepted]]
type = "isolated_pin_label"
match = "VCAP_S_TAP"
until_sheet = "11_hv_storage"
reason = "Driven from the supervisor string tap on 11_hv_storage (WP-F), placeholder in this worktree."

[[erc_accepted]]
type = "isolated_pin_label"
match = "HVS_|OVP_TRIP"
until_sheet = "05_supervisor_mcu"
reason = "Partner is the supervisor on 05_supervisor_mcu (WP-B); OVP_TRIP also goes to the opto LEDs on 11_hv_storage. Placeholders in this worktree."

[[group]]
id = "tap"
title = "VCAP_S_TAP input: 100 kOhm + 10 nF, OPA388 zero-drift follower (feeds the ADC and the OVP comparator)"
note = """
VCAP_S_TAP = Vcap x 39.8 k / (39.84 M + 39.8 k) = Vcap / 1,002.0 (string on 11; contract says 1:1,000). 1,950 V -> 1.946 V; 2,160 V -> 2.156 V.
R801 100 kOhm meets R7: 3.6 V clamped tap into an unpowered OPA388 -> at most 33 uA (abs. max. +-10 mA, SBOS777D 6.1). R801 + C801: 1.6 ms.
U804 OPA388: Vos 5 uV max (7.5 uV over temperature), IB 350 pA max at 25 C / 400 pA 0-85 C (SBOS777D 6.7) -> 0.4 nA x 150 kOhm = 60 uV = 0.06 V of capacitor voltage. It is a different family (zero-crossover, not chopper) from the main chain's OPA333. An Analog Devices ADA4528-1 was preferred for maker diversity but its data sheet could not be retrieved (capture notes).
R802 1 MOhm to 3V3_SUP: a failed-open follower reads full scale -> OVP trips (a detected, no-shock failure, like §13 fault 16a) instead of hiding an over-voltage.
"""

[[group]]
id = "adc"
title = "AD7171 16-bit delta-sigma ADC, 125 Hz, ratiometric to VREF_S (ADR3425)"
note = """
AIN+ = buffered tap through R803 1 k / C803 10 nF C0G; AIN- = GND; REFIN = VREF_S 2.5 V -> full scale 2.5 V = 2,505 V; LSB (offset binary, +-VREF) 76.3 uV = 76 mV of capacitor voltage.
AD7171 average input current 400 nA/V (Rev. C Table 2) -> 0.78 uA x 1 k = 0.78 mV static at 1.95 V: proportional to the input, so it is a gain term removed by calibration; its drift (60 pA/V/K) is 5 uV over 45 K.
Two-wire read-only interface: SCLK in (Schmitt), DOUT/RDY out. PDRST low = power-down/reset; R804 100 kOhm pull-down = default off (contract §5.6). Exposed pad to GND (Table 6).
Decoupling 100 nF + 1 uF at VDD.
"""

[[group]]
id = "ref"
title = "VREF_S = 2.5 V, ADR3425 (Analog Devices), supervisor chain only"
note = """
ADR3425ARJZ: +-0.1 % initial, 8 ppm/K max, 30 ppm / 1000 h at 50 C, thermal hysteresis 70 ppm, VIN 2.7-5.5 V, dropout 200 mV (Rev. B Table 5). Load: AD7171 reference 1 uA, threshold divider 0.1 mA. ENABLE tied to VIN (>= 0.85 VIN). Input 100 nF + 1 uF, output 1 uF + 100 nF (Rev. B 'Input and Output Capacitors': 1-10 uF input, 0.1 uF ceramic).
VREF_S is drawn as a power symbol made here by the reference's power_out pin (contract §4); used on this sheet only.
"""

[[group]]
id = "ovp"
title = "Hardware over-voltage comparator OVP_TRIP (2,160 V), TLV9031 push-pull on 3V3_SUP"
note = """
U803 IN- = VREF_S x 15.6 k / (9.09 k + 15.6 k) = 1.5796 V (0.1 % parts, C810 100 nF). IN+ = buffered tap through R805 36.5 k, positive feedback R806 100 k from the output.
Trip (output low before): tap = 1.5796 x (1 + 36.5/100) = 2.1561 V = 2,160 V nominal. Release (output high, VOH about 3.15 V): tap = 2.1561 - 3.15 x 0.365 = 1.006 V = about 1,000 V.
Band [CALC, worst case]: TLV9031 Vos +-2 mV over temperature (SNOSDA3H 5.7), ADR3425 0.24 %, resistors 0.1 % + 25 ppm/K, follower 0.07 mV, supervisor string ratio +-0.2 % tolerance +-0.225 % temperature +-0.25 % life -> 2,132-2,189 V (design table §B4.4: 2,138-2,182 V). Top 11 V below the 2,200 V rating; bottom 123 V above the top of the firmware window (2,008.6 V). Release 919-1,098 V (depends on VOH, i.e. on 3V3_SUP and the opto LED load on 11).
Why a wide hysteresis: after a hardware over-voltage something has already failed; the forced dump runs to about 1,000 V instead of stopping 1-2 % below the trip point and re-arming the charger at the top of the range. The comparator does not latch (no latch net in the contract): see capture notes, contract issue C-5.
Output: push-pull high = over-voltage -> opto LEDs on 11 (series resistor and 100 kOhm pull-down on 11) and the supervisor (R7 receiver on 05). TLV9031 inputs are fault-tolerant to 6 V regardless of V+ (SNOSDA3H 5.1 note 2).
Unpowered (3V3_SUP off) -> OVP_TRIP low = no force: the accepted latent fault 33 (§13); 3V3_SUP off also stops the supervisor's hold clock, so stack B conducts anyway.
"""

