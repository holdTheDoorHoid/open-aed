[[group]]
id = "supply"
title = "BRIDGE_3V3: Schottky-isolated 220 uF hold-up, LDO, rail-collapse (4.5 V) detector"
note = """
BRIDGE_5V -> SS14 Schottky -> B5_HOLD (220 uF polymer tantalum + 1 uF) -> TLV75533P LDO -> BRIDGE_3V3. The diode keeps the reservoir from being drained by the sheet-13 loads when BRIDGE_5V collapses, so the sequencer, the UCC5350 input sides and the over-current latch keep running long enough to turn the low sides off first (§B13.5).
Hold-up [CALC, capture notes §3.4]: reservoir from >= 4.27 V down to 3.30 V at 60 mA (design estimate for sheets 12 + 13; WP-G to confirm its share) with C >= 158 uF effective: >= 2.5 ms (requirement >= 2 ms).
BR5_OK (TLV7031): BRIDGE_5V / 2 compared with 0.683 x BRIDGE_3V3; high while BRIDGE_5V > 4.51 V nominal (falling trip 4.39-4.60 V worst case). Active-high 'OK' with power-on-reset low: a dead detector blocks every start instead of hiding a collapse. 100 pF on the sense node: 5 us filter.
"""

[[group]]
id = "reset"
title = "Power-on reset RST_N (every latch) and RAIL_READY 20 ms (RDY)"
note = """
TPS3840PL30: push-pull active-low RESET, VIT- 3.0 V +-1.5 % (VIT+ 3.1 V), output driven low from VDD = 0.3 V (SNVSB03E 6.5), CT open (50 us + 100-350 us start-up). RST_N clears all five latches; nothing is remembered from one rail cycle to the next: one sequence per rail cycle.
RDY = RST_N delayed 20.2-24.1 ms [CALC] by 221 k / 100 nF C0G and a TLV7031 at 0.640 x BRIDGE_3V3 (MGJ2 and the sheet-13 oscillator settled, §B13.1 step 4). A separate RC is used because the TPS3840's own CT delay spreads 1.86:1 (RCT 350-650 k), which cannot meet both '>= 20 ms' and the firmware's relay timing.
"""

[[group]]
id = "inputs"
title = "Command and status inputs: 100 k pull-downs, Ioff Schmitt buffers on BRIDGE_3V3"
note = """
Contract §5.7: CMD_HA, CMD_LA, CMD_HB, CMD_LB, RELAY_CMD, BTEST_CMD, WIN_OPEN, TEST_MODE: 100 k to GND here and Ioff buffers on BRIDGE_3V3 (SN74LVC2G17, Ioff <= 10 uA: the main controller's 3.3 V commands cannot power BRIDGE_3V3 when the rail is off). OC_DET_N, IDLE_I_DET_N: 100 k to GND here, so an open or unpowered sheet-13 comparator reads FAULT; buffered by an inverting SN74LVC2G14 (OC_F, IDLE_RAW high = fault). K_REST_N: no pull here (pull-up on 04); SN74LVC2G14 gives K_AT_REST (= not K_REST_N) and K_LEFT (= K_REST_N).
Pairs share a package only where a double failure is harmless: (HA, HB) both stuck high cannot conduct without a low side; (LA, LB) are separated in time by the state machine; (WIN, TM) stuck high = test mode = patient relay blocked.
"""

[[group]]
id = "latches"
title = "Sequence state latches (SN74LVC2G74, cleared only by RST_N): ACT, P1D, DONE, FLT, KON"
note = """
ACT (SEQ_ACTIVE): clocked by the rising edge of CMD_LB with D = START_OK: the start is an EDGE, so a low-side command already high when the conditions become true never starts a sequence. Once set it holds itself (Q_N wired to its own PRE_N: a later CMD_LB edge sampling START_OK = 0, e.g. from a frozen timer, cannot clear it); only RST_N clears it: one sequence per rail cycle (§B13.3 rule 1). During reset PRE and CLR may both be low for nanoseconds (Q = Q_N = 1, SCES203Q function table); CLR wins as soon as Q_N rises, and nothing downstream can act in that time (RDY is low, so no high side and no lead).
P1D (phase 1 done): clocked by LB_OFF10 (G_LB has been low 9-20 us), D = ACT. DONE: clocked by LA_OFF10 (G_LA low 9-20 us), D = P1D: set only after a phase-2 pulse really passed; if none passes, the 25 ms cap ends the sequence as a fault.
FLT: set asynchronously (PRE) by any fault trigger once RDY is high; Q = fault. KON: clocked by the first K_EN rising edge, D = 1: starts the non-retriggerable coil timer.
Each latch output has a pull toward the blocking state (ACT, P1D, P1D_N, FLT_N down; ACT_N, DONE, FLT, KON up).
"""

[[group]]
id = "turnoff"
title = "End of sequence and fixed turn-off order: low sides at once, high sides +20 us, coil +1 ms, SEQ_HOLD +15 ms"
note = """
RUN_L = NOR(DONE, FLT): goes low at the end (planned or fault) and removes both low-side enables within two gate delays (< 15 ns) - step 1 of §B13.5.
RUN_D20 (10 k, 2.7 nF C0G, SN74LVC1G17): falls 20-36 us later [CALC] -> RUN_H low -> both high-side enables low (step 2). RUN_D1M (12 k, 100 nF C0G): 0.89-1.63 ms -> coil supply off (step 3). RUN_D15M (150 k, 100 nF C0G, TLV7031 at 0.372 x BRIDGE_3V3): 13.5-16.2 ms -> SEQ_HOLD low (step 4). Independent backstop: HOLDCAP_N (second threshold, 0.80, on the latched cap RC) ends SEQ_HOLD 38.4-41.7 ms after the start whatever RUN_D15M, DONE or FLT do, so a stuck end-of-sequence element cannot hold BRIDGE_5V up without consent (it would also block every later sequence: one per rail cycle). Order holds at every tolerance corner: 36 us < 0.89 ms < 13.6 ms.
Each RC charges fast through a BAS116 while RUN_L is high, so all three are ready within microseconds of power-up and never delay a start.
On a rail collapse the same order runs from the BRIDGE_3V3 hold-up (>= 2.5 ms): BR5_OK -> FLT -> RUN_L.
"""

[[group]]
id = "high_side"
title = "High-side enables G_HA, G_HB with the 10 us leg lockout (§B13.3 rule 2)"
note = """
G_HA = HA AND RUN_H AND LA_OFF10: G_HA is blocked while G_LA is on and for 9-20 us after it goes off [CALC] (LA_OFF10: 10 k / 1.5 nF C0G charged at once through a BAS116 when G_LA rises, SN74LVC1G14). Same for G_HB against G_LB. The lockouts watch the gated enables, not the raw commands (review R-23).
Outputs to sheet 13 through 1 k (pull-downs there). The high side may be enabled before a sequence (the 100 us lead): no current can flow without a low side.
"""

[[group]]
id = "low_side"
title = "Low-side enables G_LB (phase 1), G_LA (phase 2): order, 50 us lead, 150 us lockout (§B13.3 rules 1-3)"
note = """
G_LB = LB AND (ACT AND NOT P1D AND RUN_L) AND (HA_ON50 AND HB_OFF150 AND CAPC_N). G_LA = LA AND (ACT AND P1D AND RUN_L) AND (HB_ON50 AND HA_OFF150 AND CAPC_N). CAPC_N (cap not expired) reaches both low-side gates directly as well as through the fault latch and RUN_L, so no single stuck element on the ending path can let a low side run past the cap.
Order: G_LB only in phase 1 (ACT, not P1D); G_LA only after phase 1 (P1D). A CMD_LA before phase 1, a second CMD_LB, any command after DONE: ignored. A main controller frozen with its timer toggling gets at most one phase-1 and one phase-2 pulse per rail cycle, inside the 25 ms cap (R-4).
HA_ON50: G_HA on >= 41-77 us [CALC] (10 k / 6.8 nF, emptied at once through a BAS116 when G_HA falls). HA_OFF150: G_HA off >= 166-364 us [CALC] (10 k / 27 nF, SN74LVC1G14). Firmware leads are 100 us and 500 us (F-4), above both maxima.
"""

[[group]]
id = "start"
title = "Start conditions sampled at the CMD_LB rising edge (START_OK, §B13.1 step 8, §B13.3 rules 5, 9)"
note = """
START_OK = [NOT OC AND NOT idle current AND NOT FLT] AND [RDY AND WIN AND BR5_OK] AND [LB_LOCK AND MODE_OK].
MODE_OK = shock mode: XFER (relay left rest, with K_EN on, for >= 10.0 ms) AND KWIN_N (coil on for less than 45.7-51.8 ms)
          OR test mode: TM AND K_AT_REST (patient relay at rest) AND BTOK (test relay enabled >= 2.08 ms).
XFER: AND(K_LEFT, K_EN_I) -> 110 k / 100 nF -> TLV7031 at 0.640: 10.0-12.0 ms [CALC] (emptied at once through a BAS116 when either input drops). BTOK: BTEST_EN_I -> 36 k / 100 nF -> SN74LVC1G17: 2.08-4.35 ms [CALC].
Every intermediate node has a 100 k pull-down: a dead gate refuses the start.
"""

[[group]]
id = "faults"
title = "Fault latch FLT and the latched 25 ms cap (§B13.3 rules 4 and 6, R-4)"
note = """
FLT_PRE_N = NOT( RDY AND ( OC_F OR IDLE_F OR SEQ_UV OR CAP_F ) ):
  IDLE_F = IDLE_RAW AND LA_OFF10 AND LB_OFF10 (>= 5 A while neither low side has been enabled for 9 us; R-14).
  SEQ_UV = NOR(BR5_OK, ACT_N, DONE) = rail below 4.5 V during a running sequence.
  CAP_F = NOR(CAPC_N, DONE) = cap expired before the planned end.
Cap: ACT (a latch) charges 249 k / 100 nF C0G +-2 % (emptied only when ACT is cleared by RST_N, through a BAS116); TLV7031 against 0.6345 x BRIDGE_3V3 (57.6 k / 100 k). Expiry 23.7-26.5 ms after the start [CALC] (spec 25 ms +-15 % = 21.3-28.8 ms). Non-retriggerable and not extendable: the RC is driven by the ACT latch, which nothing but a power-on reset clears; nothing a controller does can restart or stretch it. CAPC_N is high while not expired; power-on reset holds it low = expired.
Fault-path nodes have pull-UPs (a dead gate reads 'fault'); FLT_PRE_N has a pull-DOWN (a dead NAND sets FLT).
"""

[[group]]
id = "relay"
title = "Patient-relay coil enable K_EN: 90 ms latched coil cap, start window, off 1 ms after the end (§B7.2, §B13.3 rule 7)"
note = """
K_EN = RELAY_CMD AND NOT TEST_MODE AND KCAP_N AND RUN_D1M AND RDY (KA_N = NAND3, then NOR with TM). RDY is added to rule 7 so that the coil timer's start latch KON can never miss the first K_EN edge while RST_N holds it cleared (a RELAY_CMD already high at rail-up would otherwise leave the coil uncapped). In test mode the coil can never be energised: the bridge cannot reach the pads (§B14.2).
Coil timer: KON (latched at the FIRST K_EN rise) charges 953 k / 100 nF C0G +-2 %; a three-resistor divider (115 k / 66.5 k / 121 k) gives 0.400 and 0.620 x BRIDGE_3V3. KWIN_N (start window) closes 45.7-51.8 ms after the coil was energised; KCAP_N (coil cap) cuts K_EN 87.1-97.6 ms after [CALC]. Latest possible coil-off = 51.8 (latest start) + 26.5 (cap) + 1.63 (coil delay) = 80.0 ms < 87.0 ms: a started sequence always ends before the coil cap; 97.6 ms < the G17's 100 ms rating (§B7.2). Same RC for both thresholds, so their ratio is set by 0.1 % resistors only.
Both comparators are held low by power-on reset = window closed / coil cut (fail to 'no coil').
Output to sheet 14 through 1 k (pull-down there).
"""

[[group]]
id = "test_relay"
title = "Bridge test relay enable BTEST_EN = BTEST_CMD AND TEST_MODE (§B13.3 rule 8)"
note = """
Only in test mode; output to sheet 13 through 1 k (pull-down there). BTEST_EN_I also starts the BTOK timer.
"""

[[group]]
id = "status"
title = "Open-drain status to both controllers (§B13.7): SEQ_ACT_*_N, SEQ_DONE_*_N, BR_FAULT_N"
note = """
One SN74LVC2G07 per controller, so each controller's view has its own part. SEQ_ACT = ACT, SEQ_DONE = NOT RUN_L (planned end or fault), BR_FAULT = FLT. Pull-ups on 04 (3V3_MAIN) and 05 (3V3_SUP); with BRIDGE_3V3 off the outputs are released (Ioff) = 'not active / not done / no fault' (contract §5.7).
"""

