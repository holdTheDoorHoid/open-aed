# 12_bridge_logic - hardware shock sequencer (WP-D shock logic, decision D-59). NOT FOR CONSTRUCTION — unreviewed design.
# BRIDGE_3V3 with hold-up, power-on reset and rail-ready, Ioff command buffers, sequence state latches, leg lockouts and
# lead, latched non-retriggerable 25 ms cap, fault latch, relay coil timing (latched coil cap, start window), the
# fixed turn-off order, and open-drain status to both controllers. Discrete logic only (contract §9), on BRIDGE_3V3.
# Sources: docs/HARDWARE_DESIGN.md §B13, §B14, §B7.2, §13, §F-4/F-8; hardware/aed-main/contract.md issue 2 §5.7.
# Arithmetic, truth tables, failure table and assumptions: hardware/aed-main/capture-notes/WP-D.md.
# Datasheets were fetched 2026-11-27 from the manufacturer's site (TI, onsemi, Vishay); URLs on each part.
# Generated once by a throwaway script; this file is the source of truth (edit it directly).

