# 02_power_dock — dock contacts (5 V, data, ground), 6.0 V TVS, TPS25947 eFuse (UVLO/OVLO, reverse blocking) -> VDOCK,
# BQ25887 2-cell boost charger with 0-45 C TS window, dock data transceiver (VDOCK-powered open-drain driver,
# 74LVC1G17 receiver on 3V3_MAIN), dock-detect MOSFET.
# NOT FOR CONSTRUCTION — unreviewed design (SAFETY.md §2a). Nothing here is an instruction to build or power anything.
# Source: docs/HARDWARE_DESIGN.md §B1.4-B1.5, §11; contract.md issue 2 §5.1, §5.2, §8 row 02, §9 WP-A;
# issue 3 §0 (VBAT_MID) and capture-notes/rev3-changes.md WP-A A-1.
# Capture notes: hardware/aed-main/capture-notes/WP-A.md. References 201-299.

[sheet]
name = "02_power_dock"
title = "Dock contacts, TPS25947 input protection, BQ25887 2S charger (TS window), dock data, dock detect"
source = "docs/HARDWARE_DESIGN.md v0.3 §B1.4-B1.5; contract.md issue 3 §0, §5.1, §5.2, §8, §9 (WP-A)"
date = "2026-11-27"
comments = [
  "Contacts are dead when undocked (D-46): the eFuse blocks reverse current, the data contact is only ever pulled low by Q201",
  "Issue 3 (rev 0.3, A-1): U201 MID and CBSET join the pack mid-point through the contract net VBAT_MID (from J101 pin 3 on 01)",
]

[nets]
power = ["GND", "VDOCK", "VBAT_PACK", "3V3_MAIN"]
# The dock contact node is supplied from outside the device (passive contact): permanent flag.
flag_nodes = ["VDOCK_IN"]
global = [
  "CHGR_INT_N",   # U201 INT (open drain) -> 04; pull-up 100k on 04
  "CHGR_CE_N",    # 04 -> U201 CD; 100k pull-down HERE (R211): low = charging allowed (D-48)
  "DOCK_TX",      # 04 -> 02; 100k pull-up on 04; enters the VDOCK-powered inverter through R212 100k (R7)
  "DOCK_RX",      # 02 (U204 on 3V3_MAIN, Ioff) -> 04
  "DOCK_DET_N",   # Q202 (open drain) -> 03, 04; pull-up 100k to 3V3_AON on 03
  "I2C_M_SCL",
  "I2C_M_SDA",
  "VBAT_MID",     # issue 3 (I-1): pack mid-point from 01 (J101 pin 3) -> U201 MID via R207 300 ohm, CBSET via R208 100 ohm
]

[[erc_accepted]]
type = "isolated_pin_label"
match = "CHGR_INT_N|DOCK_TX|DOCK_RX"
reason = "Other end on 04_main_mcu (WP-B, placeholder in this worktree); disappears when 04 is captured."

# ====================================================================== groups
[[group]]
id = "in"
title = "Dock contacts J201 (5 V, DATA, GND), SMAJ6.0A TVS, TPS259474A eFuse -> VDOCK (UVLO 4.26 V, OVLO 5.88 V, 2.7 A)"
note = """
D201 SMAJ6.0A (Bourns): VRWM 6.0 V, VBR 6.67-7.37 V, VC 10.3 V at 38.8 A (10/1000 us); IR <= 800 uA at 6.0 V (only while docked).
UVLO (EN/UVLO, 1.20 V rising / 1.09 V falling, SLVSFC9C EC): R201 255 k / R202 100 k: on at 1.20 x 3.55 = 4.26 V (4.20-4.34 V), off at 3.87 V.
OVLO (1.20 V rising / 1.09 V falling): R203 390 k / R204 100 k: off at 1.20 x 4.90 = 5.88 V (5.80-5.99 V), back on below 5.34 V (dock 5 V +5 % = 5.25 V stays on).
Current limit: RILM = 3334 / ILIM (Eq 7): R205 1.24 k -> 2.69 A (about +/-11 % from the EC table: 2.4-3.0 A), above the charger's 2.0 A input limit.
Slew: CdVdt = 2000 / SR (Eq 4): C201 1.5 nF -> 1.33 V/ms; into ~66 uF on VDOCK and PMID that is 88 mA inrush.
ITIMER open = fastest overcurrent response (pin table). PG unused (open drain, left open); PGTH tied to GND [design choice: PG not used].
True reverse-current blocking keeps VDOCK (and the battery behind the charger) off the 5 V contact when undocked (D-46).
"""

[[group]]
id = "chg"
title = "U201 BQ25887 2S boost charger: VDOCK -> VBAT_PACK, input limit 2.0 A (ILIM 562 ohm), TS window ~1-44 C, CE from main"
note = """
Typical application SLUSD89B §9.2: VBUS 1 uF, PMID 2 x 22 uF (44 uF 'optimal'), L 1 uH (XAL4020-102ME: Isat 8.7 A, 14.6 mOhm max), BTST 47 nF, REGN 4.7 uF, SNS 2 x 22 uF (44 uF minimum), BAT 10 uF.
ILIM: IINMAX = KILIM / RILIM, KILIM = 1110 A.ohm typ: R206 562 ohm -> 1.98 A. Charge current and per-cell voltage (4.2 V) are I2C registers (firmware); defaults per datasheet.
CD (active-high disable, 900 k internal pull-down) = CHGR_CE_N directly: low = charge (D-48 default: a docked, switched-off device still charges). R211 100 k is the contract's default resistor.
TS window (D-48 hard stop 0-45 C): the 0-45 C window cannot be made with the RT1/RT2 pair of Eq 1-2 (RT2 comes out negative: the BQ25887 T1-T5 span is 0-60 C). Chosen: RT1 only (R209 10.0 k REGN->TS), RT2 not fitted. With a 10 k B25/50 = 3380 NTC: T1 (73.25 % REGN, charge suspended below) at about +1 C, T5 (34.375 %) at about 44 C; with VT and 1 % NTC/resistor tolerance T5 = 43.5-44.8 C, T1 = 0.5-1.9 C [CALC from the B-equation, not from the maker's R-T table: VERIFY]. Between T3 (about 31 C) and T5 the JEITA defaults apply: 4.0 V/cell, 100 % current (REG08 reset values) - conservative.
NTC TH201 is a board-mounted 0402 NTC placed against the cells (the pack's two NTCs belong to U101 on sheet 01): DEPARTURE, see capture notes.
MID / CBSET: MID through 300 ohm (pin table: reverse-plug protection), CBSET through R208 100 ohm (balancing 4.2 / 100 = 42 mA, 0.18 W). Issue 3 (rev 0.3, A-1, I-1): their common node is the contract net VBAT_MID, the pack mid-point from J101 pin 3 on sheet 01, so the charger regulates each cell. VBAT_MID is referred to the pack negative (BAT_NEG, cell side of R101) while U201 GND is system GND; the difference is the R101 drop, <= 2 mOhm x 21 A = 42 mV peak, 18 mV at 9.2 A [CALC] and ~0 while only charging (charge current returns through R101 too: <= 2 A x 2 mOhm = 4 mV).
One balancer only (design §B1.1, rev 0.3 A-4): the BQ25887's balancing through CBSET is the one kept; the MAX17320's is disabled by configuration (nBalTh.BALCFG = 0, MAX17320 datasheet Rev 12 Table 21; record on sheet 01).
STAT and PG unused (open drain, left open). PSEL = GND (adapter, 3 A class; ILIM pin sets the real limit).
"""

[[group]]
id = "data"
title = "Dock data (Q-47 option a, one contact, half duplex): VDOCK-powered open-drain driver, 74LVC1G17 receiver on 3V3_MAIN"
note = """
Driver: DOCK_TX (3V3_MAIN UART, idle high) -> R212 100 k (R7: U203 is unpowered when undocked) -> U203 SN74LV1T04 on VDOCK (VIH 2.03 V at VCC 4.5-5 V, 5 V-tolerant input, SCLS738E) -> Q201 BSS138 gate -> drain pulls the DATA contact low. TX high = inverter low = Q201 off = line released (pull-up is in the dock, design §B1.4). Undocked: VDOCK = 0, U203 output low, R213 holds the gate low: the contact is never driven high by the device (D-46).
Receiver: contact -> R214 100 ohm -> node DOCK_DATA -> R216 1 k -> U204 SN74LVC1G17 (Ioff, 5.5 V-tolerant input) on 3V3_MAIN -> DOCK_RX. The receiver also hears the device's own transmission (half duplex). R215 100 k defines the line when undocked. D202 TPD1E10B06 ESD clamp at the contact.
"""

[[group]]
id = "det"
title = "Dock detect: Q202 pulls DOCK_DET_N low while VDOCK is present (wake on dock, 03 and 04)"
note = """
Gate from VDOCK through R217 10 k, R218 100 k gate pull-down: VGS = 4.55 V at VDOCK 5.0 V (BSS138 VGS(th) 0.8-1.5 V, onsemi BSS138/D). Pull-up 100 k to 3V3_AON is on 03 (contract §5.1). Undocked or unpowered: DOCK_DET_N reads high = 'not docked'.
"""

[[group]]
id = "tp"
title = "Test points (design §15)"

