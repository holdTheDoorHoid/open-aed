# 06_ui - user interface: memory LCD with always-on blanking inverter, I2S class-D amplifier and speaker,
# cancel button (two independent contacts), adult/child switch (two poles, D-60), power button.
# NOT FOR CONSTRUCTION — unreviewed design.
# Source: docs/HARDWARE_DESIGN.md §B10, §B8.4, §B4.4 (D-60), §B1.7-B1.8; contract.md issue 2 §5.1, §5.5, §5.8, §8.
# References 601-699. Work package WP-C. Arithmetic: hardware/aed-main/capture-notes/WP-C.md.
# Not on this sheet: the supervisor's own alarm (piezo + red light, D-26) is on 05; the ready LED/latch is on 03.

[sheet]
name = "06_ui"
title = "User interface: memory LCD, speaker and class-D amplifier, cancel button (two contacts), adult/child switch, power button"
source = "docs/HARDWARE_DESIGN.md §B10; contract.md §5.8"
date = "2026-11-27"
comments = [
  "Display, its blanking inverter and the power button live on 3V3_AON (always on); the amplifier on 5V0_SYS; nothing here is powered from 3V3_MAIN or 3V3_SUP.",
  "Cancel: two separate sealed switches under one cap; the only shared conductor is GND (§B8.4).",
]

[nets]
power = ["GND", "3V3_AON", "5V0_SYS"]
global = [
  "LCD_SCLK", "LCD_SI", "LCD_SCS", "LCD_BLANK",   # 04 -> 06
  "RTC_CLKOUT",                                    # 03 -> 06 (1 Hz)
  "I2S_BCLK", "I2S_LRCLK", "I2S_SD", "AMP_SD_N",   # 04 -> 06
  "CANCEL_M_N",                                    # 06 -> 04
  "CANCEL_S_N",                                    # 06 -> 05
  "MODE_ADULT_N", "MODE_CHILD_N",                  # 06 -> 04
  "MODE_CHILD_HW",                                 # 06 -> 10
  "PWR_BTN_N",                                     # 06 -> 03, 04
]

[[erc_accepted]]
type = "power_pin_not_driven"
match = "#PWR6000 |#PWR6020 "
until_sheet = "03_power_rails"
reason = "KiCad names the power symbol, not the net: #PWR6000 = 3V3_AON, #PWR6020 = 5V0_SYS (checked in the generated sheet). 3V3_AON (U304) and 5V0_SYS (U303) are made on 03_power_rails (WP-A, placeholder in this worktree); contract §4."

[[erc_accepted]]
type = "power_pin_not_driven"
match = "#PWR6003 "
until_sheet = "01_power_battery"
reason = "#PWR6003 = GND. GND is made on 01_power_battery (WP-A, placeholder in this worktree); contract §4."

[[erc_accepted]]
type = "pin_not_driven"
match = "LCD_|I2S_|AMP_SD|U601 Pin [1235]|U602 Pin (1|4|14|16)|U603 Pin 2"
until_sheet = "04_main_mcu"
reason = "LCD SPI, LCD_BLANK, I2S and AMP_SD_N are driven by the main controller U401 on 04_main_mcu (WP-B, placeholder here); their default resistors (1 MOhm / 100 kOhm to GND) are on this sheet."

[[erc_accepted]]
type = "pin_not_driven"
match = "RTC_CLKOUT|U601 Pin 4"
until_sheet = "03_power_rails"
reason = "EXTCOMIN is driven by the RV-3028-C7 CLKOUT on 03_power_rails (WP-A, placeholder here)."

[[erc_accepted]]
type = "isolated_pin_label"
match = "LCD_|I2S_|AMP_SD_N|CANCEL_M_N|MODE_ADULT_N|MODE_CHILD_N"
until_sheet = "04_main_mcu"
reason = "Partner is the main controller on 04_main_mcu (WP-B), placeholder in this worktree."

[[erc_accepted]]
type = "isolated_pin_label"
match = "RTC_CLKOUT|PWR_BTN_N"
until_sheet = "03_power_rails"
reason = "RTC CLKOUT source and the power-button pull-up / wake logic are on 03_power_rails (WP-A), placeholder in this worktree."

[[erc_accepted]]
type = "isolated_pin_label"
match = "CANCEL_S_N"
until_sheet = "05_supervisor_mcu"
reason = "Read by the supervisor on 05_supervisor_mcu (WP-B), placeholder in this worktree."

[[erc_accepted]]
type = "isolated_pin_label"
match = "MODE_CHILD_HW"
until_sheet = "10_hv_charger"
reason = "Read by the FB-switch gate drive on 10_hv_charger (WP-E), which fits its 100 kOhm pull-down; placeholder in this worktree."

# ------------------------------------------------------------------ groups
[[group]]
id = "lcd"
title = "Memory LCD LS013B7DH05 on 3V3_AON: last image (READY / NOT READY) stays while the device is off"
note = """
Sharp LD-26912A: VDD/VDDA 2.7-3.3 V (3V3_AON, TPS70933 3.3 V), input high 2.7 V to VDD, operating -20 to +70 C at the panel. EXTMODE = H (tied to VDD): COM inversion from EXTCOMIN = RTC_CLKOUT, 1 Hz from the always-on RTC on 03. Sharp's 57-66 Hz EXTCOMIN figure applies only while data are written continuously (Remark 6-3/6-4); 1 Hz holds a static image (Fig 6-4 shows 1 Hz LC inversion).
SPI from the main (LCD_SCLK, LCD_SI, LCD_SCS): 1 MOhm to GND on each (contract §5.8 default resistors: main off -> lines low -> SCS low, display holds its memory) and 1 kOhm series into the panel (limits current into the panel inputs if 3V3_MAIN is momentarily above 3V3_AON; input high must not exceed VDD, LD-26912A Table 5-1). 1 kOhm x about 10 pF = 10 ns against SCLK 1 MHz max (twSCLKH 405 ns).
External capacitors per LD-26912A §9: 1 uF on VDD, 1 uF on VDDA, 0.1 uF on DISP.
"""

[[group]]
id = "blank"
title = "Blanking: LCD_BLANK (high = blank) -> 74AUP1G04 on 3V3_AON -> DISP (R-21)"
note = """
Main off -> LCD_BLANK held low by R607 1 MOhm -> inverter output high -> DISP high = display ON showing memory. The AUP input has Ioff (0.6 uA max with VCC = 0, SCES571K), so a powered main never back-feeds 3V3_AON and an unpowered main is never fed.
R608 220 Ohm between the inverter and Sharp's recommended 0.1 uF on DISP: limits the charging current to (3.3 V / 220) = 15 mA, inside the AUP's +-20 mA output current rating [UNVERIFIED: abs. max. table not re-read]; DISP rise time becomes about 3 x 22 us instead of Sharp's 50 ns figure, which the recommended 0.1 uF already makes unattainable.
"""

[[group]]
id = "audio"
title = "Voice prompts and metronome: MAX98357A (I2S, mono mix) on 5V0_SYS, 28 mm 8 Ohm speaker"
note = """
I2S_BCLK / LRCLK / SD each through 4.7 kOhm (contract §5.8; R-21: with 5V0_SYS off and the main on, the amplifier's inputs cannot back-power 5V0_SYS; firmware also holds I2S low while EN_5V0 is low). 4.7 k x 3 pF = 14 ns against BCLK 3.072 MHz (325 ns period).
SD_MODE: AMP_SD_N (push-pull 3.3 V) through R612 634 kOhm (Table 6 'R_LARGE' for 3.3 V logic) into the internal 92-108 kOhm pull-down -> 0.38-0.50 V = between trip points B0 (0.355 max) and B1 (0.65 min) = (left + right)/2 mono mix; AMP_SD_N low = shutdown. 634 k also limits current into SD_MODE to 5 uA if 5V0_SYS is off. R613 100 kOhm to GND is the contract's default resistor (main off -> shutdown).
GAIN_SLOT tied to VDD = +6 dB (Table 8). 0 dBFS -> 2.1 + 6 = 8.1 dBV = 2.54 Vrms -> 0.81 W into 8 Ohm (0.95 W at 6.8 Ohm, -15 %) = within the speaker's 1.0 W rating. Sound [CALC from PUI data]: 80 +- 3 dB at 1 m / 1 W -> 79 +- 3 dB at 1 m at full scale. The parts-study target of 85 dB(A) at 1 m needs about 3.2 W into this speaker: NOT MET (capture notes, departure D-C1).
VDD: 10 uF + 0.1 uF (data sheet 'Power-Supply Input'). Filterless output: speaker leads short, inductance of the voice coil > 10 uH required (data sheet); EP to GND plane. Operating range of the MAX98357A is -40 to +85 C.
"""

[[group]]
id = "cancel"
title = "Cancel: two sealed tactile switches under one guarded cap, CANCEL_M_N -> main, CANCEL_S_N -> supervisor (§B8.4)"
note = """
Each contract: switch to GND, TVS at the switch (TPD1E10B06, 100 nA max leakage at 5 V), 1 kOhm series + 100 nF to GND. Pull-ups are on the readers' sheets (10 kOhm to 3V3_MAIN on 04, 10 kOhm to 3V3_SUP on 05; contract §5.8). Release time constant (10 k + 1 k) x 100 nF = 1.1 ms; press discharges through 1 k in 0.1 ms; contact bounce < 1 ms (C&K KSC data) is left to the controllers' debounce. 1 kOhm limits ESD current into the controller pin after the TVS.
Gold-contact KSC6 (contact material code 3) because the pull-up current is only 0.3 mA: the silver version's minimum current is 1 mA (C&K KSC sheet).
The two circuits share only GND; one cap presses both (mechanical, not drawn). D-31 stuck rule and M/S disagreement: §13 fault 37.
"""

[[group]]
id = "mode"
title = "Adult/child switch, two-pole changeover (D-60): pole A to the main, pole B to the charger ceiling"
note = """
Pole A (common to GND): CHILD throw -> MODE_CHILD_N, ADULT throw -> MODE_ADULT_N; pull-ups 10 kOhm on 04. Between positions or open: both high = fault (contract §5.8).
Pole B (common to 5V0_SYS): CHILD throw -> R622 1 kOhm -> MODE_CHILD_HW; ADULT throw unused. Closed only in CHILD: MODE_CHILD_HW = 5.0 V x 100 k / 101 k = 4.95 V (100 kOhm pull-down on 10). Open, broken or between positions -> MODE_CHILD_HW low -> ADULT ceiling (D-60). R622 limits a short of the board-to-board wire to GND to 5 mA so it cannot pull 5V0_SYS down. C619 10 nF filters the line (10 us).
The two poles are mechanically ganged; pins 1 and 4 (CHILD throws) sit on the same side of the switch so one slider position closes both (C&K JS DPDT circuit diagram: commons 2 and 5) [UNVERIFIED for the SMT JCQN variant, see capture notes].
ESD: TVS on each pole-A throw at the switch, 1 kOhm series + 10 nF to the controller (release 0.1 ms).
"""

[[group]]
id = "pwr"
title = "Power button PWR_BTN_N into the always-on wake logic (03) and the main (04)"
note = """
Sealed tactile switch to GND, TVS at the switch, 1 kOhm series, 10 nF to GND. Pull-up 100 kOhm to 3V3_AON is on 03 (contract §5.1); release time constant 101 k x 10 nF = 1 ms. The 1 k / 10 nF also slows ESD edges into the wake logic, which enables both controller regulators directly (§B1.7, D-26).
"""

