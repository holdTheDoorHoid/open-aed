# 05_supervisor_mcu — supervisor controller NXP MCXA153VLH (U501): own crystal, SWD pads, own alarm sounder and
# fault light (D-26), supervisor capacitor NTC bias, Ioff receivers, and the default resistors the contract gives to
# the supervisor's sheet. Everything here is powered from 3V3_SUP only; no part on this sheet touches 3V3_MAIN.
# NOT FOR CONSTRUCTION — unreviewed design (SAFETY.md §2a). Nothing here is an instruction to build or power anything.
# Sources: docs/HARDWARE_DESIGN.md v0.3 §B2, §B10, §F; hardware/aed-main/contract.md (issue 3) §0, §2, §5, §7, §8, §9;
# change order hardware/aed-main/capture-notes/rev3-changes.md (WP-B: B-3, B-4, B-6);
# NXP MCXAP064M096F30 Rev. 5.2 (26 May 2026) Table 41 (pin assignments), Tables 8/9 (ratings), Table 23/24
# (system oscillator), Table 42 (unused pins). Pin assignment, arithmetic and doubts:
# hardware/aed-main/capture-notes/WP-B.md.

[sheet]
name = "05_supervisor_mcu"
title = "Supervisor controller NXP MCXA153VLH: own crystal, SWD, own alarm sounder and fault light, capacitor NTC (supervisor)"
source = "docs/HARDWARE_DESIGN.md v0.3 §B2, §B10; contract.md issue 3 §5, §8"
comments = ["U501 GPIOs come out of reset with the input buffer disabled and no pull (Table 41 'Default - DIS'); every safe default comes from a resistor (contract §5)",
            "Pin assignment, alternate functions, reset states and arithmetic: hardware/aed-main/capture-notes/WP-B.md"]

[nets]
power = ["GND", "3V3_SUP"]
flag_nodes = ["VDDA_S", "VDDUSB_S"]
global = [
  "HOLD_S_CLK", "PERMIT_CLK", "TEST_PERMIT_CLK",
  "SEQ_ACT_S_N", "SEQ_DONE_S_N", "OVP_TRIP",
  "CANCEL_S_N", "LINK_M2S", "LINK_S2M",
  "SBZ_SCLK", "SBZ_MOSI", "SBZ_MISO", "SBZ_CS_N", "SBZ_INT_N",
  "HVS_SCLK", "HVS_DOUT", "HVS_PDRST_N", "OVP_RST", "OVP_TEST",
  "NTC_CAP_S", "SUP_KEEP",
]

