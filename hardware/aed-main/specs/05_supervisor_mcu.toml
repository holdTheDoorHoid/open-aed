# ====================================================================== groups
[[group]]
id = "mcu"
title = "U501 MCXA153VLH (LQFP64): every pin"
note = """
Pin numbers and names from NXP Table 41 (LQFP64 column). The three consent clocks (HOLD_S_CLK, PERMIT_CLK, TEST_PERMIT_CLK) are plain GPIOs toggled by the control loop (F-1); the same pins also carry CTIMER1 match outputs for a one-pulse variant, never a free-running timer. Ports are 3.3 V only: VDIO max = VDD + 0.3 V (Table 8); only P3_27/P3_28 are 5 V tolerant and they are unused.
Wake-capable inputs (WUU0) are used for SEQ_ACT_S_N, SEQ_DONE_S_N, OVP_TRIP, CANCEL_S_N, SBZ_INT_N and the link receiver. LPSPI0 = pad-impedance front end (16), LPSPI1 = voltage ADC (08), LPUART2 = link.
"""

[[group]]
id = "supply"
title = "U501 supply decoupling and analog supply"
note = """
VDD: 4 pins, 100 nF each + 10 uF. VDD_ANA through a ferrite bead with 100 nF + 1 uF (VDD and VDD_ANA within 0.1 V of each other, Table 9; the bead's DC drop at the ADC's current is negligible). The ADC reference VREFH is bonded to VDD_ANA in this package, so the NTC bias is taken from VDDA_S (ratiometric). VDD_USB unused: 10 kOhm to GND as Table 42 recommends; USB0_DP/DM float. The datasheet gives no decoupling figure: values are common practice [EST] (capture notes).
"""

[[group]]
id = "clock"
title = "Supervisor's own 16 MHz crystal (§B2.4)"
note = """
ECX-32 16 MHz, CL 10 pF, ESR <= 80 Ohm (inside Table 24's 16 MHz examples, Rm 80-200 Ohm). Load caps 12 pF C0G: CL = 12*12/(12+12) + Cstray (EXTAL/XTAL pin parasitics 2 pF typ each, about 1 pF in series, + ~2 pF board) = 9-10 pF. Different crystal maker from the main controller's (Abracon) so a batch defect cannot stop both clocks (D-39 spirit).
"""

[[group]]
id = "reset"
title = "Reset, ISP strap and SWD pads"
note = """
RESET_B (P1_29, reset function by default): 10 kOhm up + 10 nF; the pad's own pull is only the ~1 MOhm high-resistance option (Table 11). ISPMODE_N (P3_29) is sampled at reset: 10 kOhm up = normal boot from flash. J501: Tag-Connect TC2030-NL pads, separate from the main's J401 (no debug path joins the controllers, §B2.5).
"""

[[group]]
id = "rx"
title = "Ioff receivers on 3V3_SUP (rule R7)"
note = """
LINK_M2S: 100 kOhm to GND (an unpowered main reads as a continuous break) + 1 kOhm series + SN74LVC1G17 Schmitt (contract 5.3). OVP_TRIP: its default resistor (100 kOhm to GND) is on sheet 11; it enters U501 only through U503, no pull here. With 3V3_SUP off, both buffers' inputs and outputs are high-impedance (Ioff <= 10 uA), so the main domain cannot feed 3V3_SUP through U501's pin diodes.
"""

[[group]]
id = "pulls"
title = "Default resistors the contract assigns to sheet 05"
note = """
SEQ_ACT_S_N, SEQ_DONE_S_N (open-drain from 12): 100 kOhm to 3V3_SUP, open or unpowered reads "not active / not done" (R11). SBZ_INT_N (open drain from 16): 100 kOhm. CANCEL_S_N (contact to GND on 06): 10 kOhm.
"""

[[group]]
id = "analog"
title = "Supervisor capacitor NTC bias (contract 5.6)"
note = """
NTC_CAP_S (10 kOhm NTC on J1102, sheet 11, to GND): 10.0 kOhm 0.1 % bias to VDDA_S (= the ADC reference), then 1 kOhm + 100 nF at the ADC pin (P1_10, ADC0_A8). Half-scale at 25 C.
"""

[[group]]
id = "ovp"
title = "Over-voltage latch reset and self-test injection (issue 3: OVP_RST, OVP_TEST to sheet 08)"
note = """
OVP_RST (P3_12) and OVP_TEST (P3_13): push-pull GPIOs on 3V3_SUP, input buffer disabled and not driven from reset (Table 41 'Default - DIS'), so the 100 kOhm pull-downs on 08 hold both low = no reset edge, no injection. OVP_RST is AC-coupled on 08 into 100 nF (C812): driven straight from the pin, the first instant of each edge would be limited only by the pin's own output resistance (VOL <= 0.5 V at 4 mA, Table 11, i.e. up to ~125 Ohm; typical lower), above the 25 mA single-pin limit of Table 8. R518 220 Ohm limits it to <= 3.3 V / 220 Ohm = 15 mA [CALC]. It slows the edge into C812 to tau = 220 Ohm x 100 nF = 22 us, so a reset pulse must be >= 100 us (4.5 tau: the BSS138 gate on 08 reaches >= 3.2 V) instead of the contract's >= 10 us (capture notes, problem P-1). OVP_TEST drives 22 kOhm + a BAS116 on 08 (<= 0.12 mA): no series resistor needed. OVP_TEST left high latches OVP_TRIP, which forces both discharge paths on: a stuck pin fails towards "cannot charge", not towards a shock.
"""

[[group]]
id = "alarm"
title = "Supervisor's own alarm: piezo sounder driven as a bridge, and a red fault light (D-26)"
note = """
U504 dual Schmitt buffer on 3V3_SUP drives the sounder differentially from the complementary pair PWM0_A0/B0 (P3_6/P3_7): 6.6 V peak-to-peak across the element from a 3.3 V rail. 100 kOhm pull-downs hold both inputs low (silent) while U501 is in reset; 33 Ohm per side limits the charging current of the element's capacitance. Fault light: red LED from a high-drive pad (P3_0) through 220 Ohm. Both are off by default and switched on by firmware (set_fault_alarm). The sounder part and its loudness belong to WP-C (contract §9) and are provisional here.
"""

