# 10_hv_charger — HIGH VOLTAGE capacitor charger (work package WP-E).
# NOT FOR CONSTRUCTION — unreviewed design. Drawn with AI assistance; not reviewed by a qualified high-voltage or
# medical-device engineer (SAFETY.md §2a). Nothing here is an instruction to build, power or test anything.
#
# Source: docs/HARDWARE_DESIGN.md v0.3 §B4 (charger), §B8.2 (charger gates), §B12 (net classes), §13, §F-3;
# hardware/aed-main/contract.md issue 3 (amends issue 2: §2 refs, §4 rails, §5.5 nets, §8 parts, §9 WP-E decisions);
# change order capture-notes/rev3-changes.md WP-E (E-1..E-4); D-25, D-29, D-41, D-44, D-60, D-65.
# Arithmetic, part choices, datasheet versions, failure table and open problems:
# hardware/aed-main/capture-notes/WP-E.md (section "Revision 0.3" for this revision). References 1001-1099.

[sheet]
name = "10_hv_charger"
title = "HIGH VOLTAGE: LT3751 flyback charger, TPS25982 eFuse, 1:50 transformer, two series rectifiers + fusible resistor, child FB ceiling"
source = "docs/HARDWARE_DESIGN.md §B4; contract.md §5.5; capture notes WP-E.md"
date = "2026-11-27"
comments = [
  "HIGH VOLTAGE: HV_* nets reach about 2,000 V in normal use (top of the at-plan window 2,008.6 V) and up to 2,409 V if the last-resort primary-side trip is the only limit left (capacitor surge rating >= 2,420 V, D-65). Classes HV / HV_PULSE (hierarchy.toml). No test point on any HV_* net (contract R9).",
  "Charger runs only when VTRANS_EN (eFuse) and CHARGE_EN AND local VTRANS-good (CHARGE pin) are high; both come from sheet 09 = request AND both discharge paths proven held AND not test mode (D-25).",
  "Child ceiling: FB divider active only while MODE_CHILD_HW is high; open/absent contact = FB grounded = adult (D-60). MODE_HW_RB_N reads back the FB-switch gate drive.",
]

[nets]
power = ["GND", "5V0_SYS", "VBAT_SYS", "HV_RTN", "VTRANS"]
global = [
  "VTRANS_EN",      # 09 -> 10, eFuse enable (session)            default resistor here: R1005 100k to GND
  "CHARGE_EN",      # 09 -> 10, CHARGE request (regulation)        default resistor here: R1010 100k to GND
  "CHG_DONE_N",     # 10 (LT3751 DONE, open collector) -> 04       pulled up on 04
  "CHG_FAULT_N",    # 10 (LT3751 FAULT, open collector) -> 04      pulled up on 04
  "MODE_CHILD_HW",  # 06 (switch pole B to 5V0_SYS in CHILD) -> 10 default resistor here: R1042 100k to GND (= adult)
  "MODE_HW_RB_N",   # 10 (open drain, low = child ceiling active) -> 04, pulled up on 04
  "HV_CAP_P",       # 10 -> 11, 13: storage capacitor positive (class HV_PULSE)
]
flag_nodes = ["VTRANS_IN"]   # eFuse input: fed from VBAT_SYS through F1001 and L1001 (passive parts)

# ---------------------------------------------------------------------------------------------- ERC acceptances
# KiCad reports an undriven rail once, at the rail's power symbol, without the net name, so each acceptance below
# names the generated power symbol (#PWR number, stable for a given spec; if the spec changes and the number moves,
# the build fails loudly rather than accepting something new). The rail named in each reason was checked against
# 10_hv_charger.kicad_sch.
[[erc_accepted]]
type = "power_pin_not_driven"
match = "#PWR10000 Pin"
until_sheet = "01_power_battery"
reason = "VBAT_SYS is made on 01_power_battery (after F101), a placeholder in this worktree; contract §4: no package flags another package's rail."

[[erc_accepted]]
type = "power_pin_not_driven"
match = "#PWR10001 Pin"
until_sheet = "01_power_battery"
reason = "GND is made on 01_power_battery (pack negative), a placeholder in this worktree; contract §4."

[[erc_accepted]]
type = "power_pin_not_driven"
match = "#PWR10035 Pin"
until_sheet = "03_power_rails"
reason = "5V0_SYS is made on 03_power_rails (TPS62130), a placeholder in this worktree; contract §4."

[[erc_accepted]]
type = "power_pin_not_driven"
match = "#PWR10070 Pin"
until_sheet = "11_hv_storage"
reason = "HV_RTN is made on 11_hv_storage (NT1101 || NT1102 to GND), a placeholder in this worktree; contract §4."

[[erc_accepted]]
type = "isolated_pin_label"
match = "MODE_HW_RB_N"
until_sheet = "04_main_mcu"
reason = "The reader and its 100k pull-up to 3V3_MAIN are on 04_main_mcu (contract §5.5), a placeholder in this worktree. (The other inter-sheet nets also have a second pin on this sheet, so KiCad does not flag them.)"

# ---------------------------------------------------------------------------------------------- groups
[[group]]
id = "input"
title = "Transformer supply: F1001 backup fuse, L1001 filter, TPS25982 eFuse (VTRANS_EN, soft start, 13 A circuit breaker, 4 retries then latch-off)"
note = """
VBAT_SYS -> F1001 (backup if the eFuse fails short) -> L1001 1 uH -> eFuse IN -> eFuse OUT = VTRANS -> bulk. The inductor sits BEFORE the eFuse, so the eFuse carries only the filtered battery current (about 10 A maximum) and its output sees only capacitors (no negative inductive kick at turn-off). The 21-23 A primary peaks come from the bulk capacitors.
ILIM 113 Ohm: 1460/113 + 0.11 = 13.0 A nominal, about 11.4-14.5 A over temperature (datasheet rows scaled). Fast trip 2.1 x ILIM within 400 ns. Circuit-breaker variant: overload beyond ITIMER (470 pF: 0.11-0.48 ms) turns the FET off. RETRY_DLY 2.2 nF + NRETRY open: 4 automatic retries 92 ms apart, then latch-off (a nuisance trip heals itself; a real short ends latched after about 0.4 s). The latch resets only with VTRANS_EN low (< 0.8 V): firmware lowering CHG_SESSION, or HOLD_OK loss.
dVdt 2.2 nF: 4600/2200 = 2.1 V/ms (0.8-3.2 V/ms with the dVdt current tolerance) -> inrush 0.6-2.3 A into about 720 uF; VTRANS reaches 8.4 V in 2.6-10 ms.
OVLO 16.9 V variant: harmless extra cut-off far above the 8.4 V pack. EN abs max 7 V: VTRANS_EN is 5 V logic. D1005 limits the input spike when the eFuse opens against the inductor current (1 uH x 13 A^2 / 2 = 85 uJ into 20 uF: +4 V).
"""

[[group]]
id = "bulk"
title = "VTRANS bulk: 4 x 22 uF X7R + 2 x 330 uF polymer (carry the 7.2 A RMS ripple of the primary)"
note = """
Primary current at full charge: 21-23 A peaks, 9-10 A average, 11-12.4 A RMS -> 6.7-7.2 A RMS ripple, about 27-43 kHz (capture notes §4). The polymers carry most of the fundamental; the ceramics carry the edges. Place at the transformer primary and switch, smallest loop (LT3751 layout item 3).
"""

[[group]]
id = "vtgood"
title = "VTRANS_GOOD: TLV3012B (1.242 V reference) rises at 4.99-5.29 V, falls at 4.76-5.07 V; then >= 1 ms delay; AND CHARGE_EN -> CHARGE"
note = """
R-5: CHARGE must not rise before VTRANS is above the LT3751 UVLO1 band (4.58-4.85 V, see the controller box), or the part latches FAULT. Comparator: IN+ = VTRANS x 100k/(309k+100k) with 7.68M positive feedback from OUT; IN- = REF. Rising = 1.242 x 4.130 = 5.13 V nominal, falling 4.93 V nominal (hysteresis 0.20 V at a 5.0 V output swing).
Delay: 100k + 22 nF into a Schmitt input of U1004 (VT+ 2.39-3.04 V at 5 V) = 1.27-2.29 ms after VTRANS is good; D1006 empties the capacitor at once when VTRANS drops.
U1004 SN74LVC1G97 wired as a 2-input AND with Schmitt inputs: TI function Y = C'.B + C.A; B (pin 1) = GND gives Y = A.C = CHARGE_EN AND VTRANS-good-delayed. Push-pull everywhere: an open comparator, open delay node or open gate input is pulled low (R11). R1011 holds CHARGE low if U1004's output is open.
"""

[[group]]
id = "ctrl"
title = "LT3751IUFD controller: charge mode (adult), UVLO/OVLO, RVTRANS/RVOUT/RDCM/RBG, DONE and FAULT to the main controller"
note = """
VCC = 5V0_SYS; LVGATE tied to HVGATE (VCC <= 8 V, datasheet Note 8); CLAMP to VCC (5.6 V gate clamp; the gate swings to VCC with LVGATE active).
Lockouts (V = 1.225 V + 50 uA x R; pin threshold 1.195-1.255 V, pin current 48.5-51.5 uA): UVLO1 69.8k -> VTRANS 4.58/4.72/4.85 V; OVLO1 154k -> 8.66/8.93/9.19 V; UVLO2 71.5k -> VCC 4.66/4.80/4.94 V; OVLO2 87.6k -> 5.44/5.61/5.77 V. 470 pF on each pin (datasheet: 100 pF-1 nF against false trips).
Primary-side output trip (VOUT comparator), v0.3 LAST-RESORT layer L3 (rev3 E-1, D-65): Vout + drops = 0.98 x N x RVOUT/RBG = 0.98 x 50 x 40.2k/876 = 2,249 V sensed; true capacitor volts = sensed minus the rectifier, R1004 and winding drops (19-48 V). Band 2,116-2,316 V true, 2,409 V with the comparator's maximum overdrive (datasheet 40 mV at 2 us): never below the 2,008.6 V window top (107 V), always inside the capacitor's 2,420 V surge rating (11 V at the very top). Nominal ~2,215 V is ABOVE the 2,200 V continuous rating by design: the latching OVP comparator (sheet 08, 2,073-2,142 V) and the firmware limit act first; this trip only matters if both have failed. RVTRANS = RVOUT = 40.2k, RDCM = 18.2k (= 0.45 x RVTRANS; datasheet Table 2 row for VTRANS 5-80 V), all 0.1 %. Keep RVOUT/RDCM/RVTRANS nodes short with no plane underneath (datasheet layout items 4).
DONE and FAULT are latched open collectors; both pulse low for microseconds at every CHARGE rise. 10k + 1 nF (10 us) filters that pulse (datasheet: 5-20 us RC); the pull-ups (100k to 3V3_MAIN) are on 04.
"""

[[group]]
id = "power"
title = "Primary power stage: 2 x BSC070N10LS5 in parallel, 5 mOhm Kelvin sense (21.2 A peak), RC snubber, diode + 45 V TVS clamp"
note = """
Current limit 106 mV (100-112) / 5 mOhm = 21.2 A (19.8-22.9 A incl. 1 % resistor and 180 ns delay at 8.4 V). Switch drain: VTRANS (<= 8.4 V) + reflected (Vout + drops)/50 (<= 46.7 V at the v0.3 trip top, 48.5 V with maximum overdrive: above the SMCJ45A's 45 V standoff, below its 50 V minimum breakdown; simulated extra clamp loss <= 16 uJ/cycle, sim/rev3-wpe) + leakage spike clamped by D1003 + D1004 (SMCJ45A: VBR >= 50 V, about 75 V at 23 A) -> about 90 V peak against 100 V (and EAS 55 mJ avalanche rating as backup).
Two FETs share the 12.4 A RMS: about 0.5 W each in conduction at 4.5-5 V gate (8.5 mOhm max at 25 C, x1.55 hot). Individual 2.2 Ohm gate resistors; 10k gate-source resistors keep the FETs off if 5V0_SYS is absent while VTRANS is present.
Snubber across the primary 10 Ohm + 1 nF (tau 10 ns < 1 us, datasheet). The sense resistor is Kelvin-connected: CSP and CSN are dedicated traces to its sense pads (datasheet layout).
"""

[[group]]
id = "hv_out"
title = "HIGH VOLTAGE secondary: T1001 1:50 (made to order), D1001 + D1002 UX-F5B in series (each blocks the full voltage, R-15), R1004 fusible -> HV_CAP_P"
note = """
Each UX-F5B is rated 8 kV repetitive (Sanken rev 1.6); worst reverse voltage = capacitor 2,420 V (surge/test; the v0.3 trip top is 2,409 V) + 50 x 9.2 V = 2,880 V -> 2.8 x margin per diode; no voltage sharing is relied on (no grading resistors). Average current <= IPK/2N = 0.23 A vs 0.35 A rating; trr 0.15 us max is ABOVE the LT3751's < 100 ns recommendation (capture notes).
R1004 (about 10 Ohm, high-voltage fusible) limits and then breaks a capacitor discharge into the secondary if both diodes short (R-15). No catalogue part found that states >= 3 kV across the open element: qualification part (footprint and MPN to be decided).
HV_SEC, HV_D_MID, HV_RECT: class HV (12.5 mm placeholder). HV_CAP_P: class HV_PULSE. HV_RTN: class RTN_PULSE. No test points (R9).
"""

[[group]]
id = "fb"
title = "Child-mode voltage ceiling (D-60): FB divider 14 x 2.87 MOhm + 36.9 kOhm (0.1 %), grounded by Q1003 || Q1004 unless MODE_CHILD_HW is high; readback MODE_HW_RB_N"
note = """
Adult and default: Q1003 and Q1004 on, FB about 0 V -> charge mode (the LT3751 runs until CHARGE falls or the VOUT comparator trips). Child: MODE_CHILD_HW high -> U1005 drives FB_GATE low -> both FETs off -> FB = Vout/1,089.9 -> hand-over to regulation >= 1,206 V, regulation 1,282-1,365 V, no-load stop <= 1,507 V.
Fail direction: MODE_CHILD_HW open or unpowered -> R1042 pulls it low -> FB_GATE high -> adult; U1005 output open -> R1043 pulls FB_GATE high -> adult. One FET open -> the other still grounds FB (adult kept; this is why there are two). U1005 output stuck low -> child ceiling in the adult position, seen on MODE_HW_RB_N (U1006 open drain follows FB_GATE: low = child ceiling active). Either FET shorted = adult ceiling always (design fault 36, not read back).
Top string: 14 x TNPV1210 2.87 MOhm 0.1 % 25 ppm/K thin film (the contract's 4.02 MOhm 0.1 % thin film is not made: Vishay TNPV tops out at 3.01 MOhm) -> 40.18 MOhm, ratio 1,089.9 vs the design's 1,090.4. (Contract issue 3 §8 and design v0.3 §B4.3 still name 10 x 4.02 MOhm: WP-E C4 stays open as a documentation change.) 157 V and 8.6 mW per element at 2,200 V (part rated 1,000 V). Every node HV_FB_n is class HV. CHG_FB is low voltage but its creepage to HV_FB_13 must follow the in-string rule (0.6 mm + 0.005 mm/V).
C1024 2.2 nF on FB (datasheet: small capacitor FB to ground lowers injected ripple) gives tau 81 us with the 36.9k.
"""

[[group]]
id = "tp"
title = "Test points (design §15): VTRANS_EN, CHARGE_EN, VTRANS-good after the delay, CHG_DONE_N. None on HV nets."
note = "Bare copper pads. No procedure is attached to them (SAFETY.md §2a)."

