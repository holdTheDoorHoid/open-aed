# 03_power_rails — VBAT_SYS -> independent fused regulators: TPS629210 #1 (3V3_MAIN), TPS629210 #2 (3V3_SUP), TPS62130
# (5V0_SYS, EN_5V0), TPS70933 (3V3_AON, always on); power-on logic (button straight to both controller regulators
# through two P-MOSFETs, wake-OR), RV-3028-C7 wake timer, SN74AUP1G74 ready latch and LED flasher.
# NOT FOR CONSTRUCTION — unreviewed design (SAFETY.md §2a). Nothing here is an instruction to build or power anything.
# Source: docs/HARDWARE_DESIGN.md §B1.6-B1.8, §B10 (ready LED), §B11 (RV-3028-C7), §11, §12; contract.md issue 2
# §4, §5.1, §8 row 03, §9 WP-A; issue 3 §0, §4 (rev3-changes.md WP-A A-5: no circuit change). Capture notes: hardware/aed-main/capture-notes/WP-A.md. References 301-399.

[sheet]
name = "03_power_rails"
title = "Rails: fused 3V3_MAIN, 3V3_SUP (separate regulators), 5V0_SYS, 3V3_AON; power-on and wake logic, RTC, ready latch and LED"
source = "docs/HARDWARE_DESIGN.md v0.3 §B1.6-B1.8, §B10, §B11; contract.md issue 3 §4, §5.1, §8, §9 (WP-A)"
date = "2026-11-27"
comments = [
  "Main and supervisor regulators: separate parts, separate fuses, separate enable networks; the button enables both through separate P-MOSFETs, no logic IC between (D-26)",
  "VBAT_SYS: no steady resistive load below 1 MOhm (contract §4, D-66); lowest on this sheet R316 + R317 = 8.0 MOhm (MAX17320 short-removal test, sheet 01)",
  "3V3_MAIN made here (U301) is used on 01 (battery-load comparator) and 02 (DOCK_RX buffer) as well as 04, 07, 09, 15 (contract issue 3 §4)",
]

[nets]
power = ["GND", "VBAT_SYS", "3V3_MAIN", "3V3_SUP", "5V0_SYS", "3V3_AON"]
# Made here through an inductor (passive): permanent flags. 3V3_AON is driven by the LDO output pin (power output).
power_flags = ["3V3_MAIN", "3V3_SUP", "5V0_SYS"]
# Regulator inputs behind their own fuses, and the RTC backup pin tied to VSS through 10 k: permanent flags.
flag_nodes = ["VIN_M", "VIN_S", "VIN_5", "RTC_VBAK"]
global = [
  "PWR_BTN_N",    # 06 -> 03, 04; 100k pull-up to 3V3_AON HERE (R301)
  "MAIN_KEEP",    # 04 -> 03; 100k pull-down HERE (R302)
  "SUP_KEEP",     # 05 -> 03; 100k pull-down HERE (R303)
  "SUP_WAKE",     # 04 -> 03; 100k pull-down HERE (R304)
  "EN_5V0",       # 04 -> 03; 100k pull-down HERE (R305): 5V0_SYS off by default (F-2)
  "RTC_INT_N",    # U305 INT (open drain) -> 03, 04; 100k pull-up to 3V3_AON HERE (R306, R8 exception)
  "RTC_CLKOUT",   # U305 CLKOUT (push-pull, 3V3_AON) -> 06 and the LED pulse network here
  "READY_D",      # 04 -> U306 D; 1M pull-down HERE (R307)
  "READY_CLK",    # 04 -> U306 CLK; 1M pull-down HERE (R308)
  "DOCK_DET_N",   # 02 (open drain) -> 03, 04; 100k pull-up to 3V3_AON HERE (R309)
  "I2C_M_SCL",
  "I2C_M_SDA",
]

# No ERC acceptances needed on this sheet: every inter-sheet input here also has its default resistor on this sheet
# (a passive driver for KiCad), and the RTC I2C pins share I2C_M_SCL/SDA with sheet 01, whose acceptance covers the net.

# ====================================================================== groups
[[group]]
id = "main"
title = "3V3_MAIN: F301 1 A -> U301 TPS629210 (VSET open = 3.3 V, MODE 64.9 k = 1 MHz auto PFM/PWM, output discharge on)"
note = """
Smart-CONFIG (SLVSGE0B Table 8-1 #13): MODE/S-CONF 64.9 k -> VSET, 1 MHz, output discharge active, auto PFM/PWM. VSET pin open -> 3.3 V (Table 8-2 #18 '249 k or larger/open'). Accuracy -1.3/+1.1 % over TJ -40..125 C -> 3.26-3.34 V.
L 2.2 uH nominal (Table 7.3 1.0-4.7 uH): XAL4020-222ME (Isat 5.6 A, DCR 38.7 mOhm max); load 80 mA peak (design §B1.6). CIN 4.7 uF 25 V 1206 (TI list C3216X7R1E475K160AC); COUT 2 x 22 uF 10 V (>= 10 uF effective after DC bias; Table 9-3 allows 10-200 uF with 2.2 uH).
EN_MAIN (precise enable, 1.00 V rising / 0.90 V falling; internal pull-down): wired-OR of Q301 (power button), Q303 (RTC_INT_N, the wake timer holds INT low until cleared = latch), Q304 (DOCK_DET_N) and D301 (MAIN_KEEP). P-MOSFET drains drive 3V3_AON straight onto EN; the diode from MAIN_KEEP gives 3.3 - 0.85 = 2.45 V. R310 100 k defines EN low when all are off.
Fuse F301 SF-1206S100-2 (1 A slow blow, 50 A at 63 V DC interrupting, 0.132 ohm): input current about 45 mA average at 80 mA / 3.3 V / 6 V in.
"""

[[group]]
id = "sup"
title = "3V3_SUP: F302 1 A -> U302 TPS629210 (separate part, fuse and enable network from 3V3_MAIN)"
note = """
Same configuration as U301. EN_SUP: wired-OR of Q302 (power button, a second P-MOSFET so no single transistor serves both regulators), and D302 (SUP_WAKE from the main for scheduled self-tests, SUP_KEEP from the supervisor). The supervisor domain shares nothing with the main domain on this sheet except VBAT_SYS, GND and the button line (design §B1.6, D-26).
"""

[[group]]
id = "five"
title = "5V0_SYS: F303 3 A -> U303 TPS62130 (FB 107 k / 20.0 k = 5.08 V, 1.25 MHz, SS 4.7 nF), EN = EN_5V0 (default off)"
note = """
VOUT = 0.8 V x (1 + 107/20.0) = 5.08 V (Eq 6). Chosen 1.6 % above 5.00 V so that the worst case stays >= 4.9 V (design §B1.6, LT3751 VCC lock-out): VFB 785.6-814.4 mV in PWM (SLVSAG7F EC) and 1 % resistors -> 4.96-5.20 V; in power-save mode (781.6-822.4 mV) 4.93-5.25 V.
Dropout: at 5.2 V pack and 1.2 A: (170 mOhm high-side max + 38.7 mOhm L + 23 mOhm fuse) x 1.2 A = 0.28 V -> 4.92 V in 100 % mode [CALC, ignores pack-path drop of ~0.1 V at 9.2 A charger current: VERIFY with sheet 10's load timing].
FSW tied to VOUT -> 1.25 MHz (pin table note 2); DEF low -> nominal voltage. Soft start Css = tSS x 2.5 uA / 1.25 V (Eq 10): 4.7 nF -> 2.35 ms. L 2.2 uH XAL4020-222ME (Isat 5.6 A > 1.2 A + ripple); CIN 10 uF 25 V 1210 + 0.1 uF at AVIN (§9.2.2.2); COUT 2 x 22 uF 10 V.
EN = EN_5V0 with R305 100 k pull-down (contract): 5V0_SYS is off unless the main asks for it; loss of 5V0_SYS is a safe failure (design §B1.6).
"""

[[group]]
id = "aon"
title = "3V3_AON: U304 TPS70933 from VBAT_SYS, always on; EN from a 4.7 M / 3.3 M divider (EN max 6.5 V)"
note = """
EN abs max 7 V, recommended <= 6.5 V (SBVS186H 6.1, 6.3), VEN(HI) >= 0.9 V: EN = VBAT_SYS x 3.3/8.0 = 2.27 V at 5.5 V, 3.47 V at 8.4 V. Divider current 1.05 uA at 8.4 V (part of the standby budget; design §12 'disabled regulators, eFuse off ~4 uA' row).
CIN 1 uF (0.1-2.2 uF advised); COUT 2.2 uF (1.5-47 uF for stability). Load 5 mA peak / 10 uA standby (design §B1.6).
"""

[[group]]
id = "rtc"
title = "Wake timer U305 RV-3028-C7 on 3V3_AON (I2C on the main bus, INT open drain, CLKOUT 1 Hz to the display and LED)"
note = """
App Manual rev 1.4 §7.1 'no backup source / event input not used': VBACKUP to VSS through 10 k (do not float; switchover disabled, BSM = 00 default), EVI to VSS through a resistor (10 k), 100 nF at VDD.
CLKOUT is push-pull and runs at 32.768 kHz from delivery until the firmware writes FD = 1 Hz and stores it in EEPROM (App Manual §4.6.3): a firmware requirement (capture notes).
I2C pull-ups are on 04 to 3V3_MAIN (contract §5.1); with the main off the bus sits low, which the RV-3028 tolerates (it is the VDD-powered side).
"""

[[group]]
id = "ready"
title = "Ready latch U306 SN74AUP1G74 on 3V3_AON (cleared at power-up) + LED flash ~3 ms per second from RTC_CLKOUT"
note = """
D = READY_D, CLK = READY_CLK (1 M pull-downs: contract). ~PRE tied high. ~CLR held low for about 100 ms after 3V3_AON appears (R320 1 M x C316 100 nF, Schmitt inputs Vhys 250 mV typ, SCES644D): the indicator starts 'not ready' instead of a random state (R11: an unpowered or reset latch must not show READY).
LED: Q output -> R321 470 ohm -> D303 (Kingbright APT1608SGC green, VF 2.2 V typ at 20 mA) -> Q305 BSS138 -> GND. Q305 gate is RTC_CLKOUT differentiated by C317 33 nF / R322 100 k (tau 3.3 ms): on for about tau x ln(3.3/VGS) = 2-4 ms after each rising edge (VGS(th) 0.8-1.5 V). Current (3.0 - 1.9 V) / 470 = 2.3 mA; average 2.3 mA x 3 ms/s = 7 uA, 23 uW at 3.3 V (design §B10 '~20 uW').
"""

[[group]]
id = "tp"
title = "Test points (design §15: every rail with GND beside it)"

