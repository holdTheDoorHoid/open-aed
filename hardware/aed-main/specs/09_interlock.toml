[[group]]
id = "bridge_power"
title = "Bridge drive power BRIDGE_5V: SW1 request, SW2a permit / SW2b test permit, SW3 held, SW4 window; SW5 sequence hold in parallel"
note = """
Six TI TPS22918 load switches (contract §2: U901-U906). Chain: 5V0_SYS - SW1 (REQ_B) - SW_N1 - SW2a (PERMIT_OK) || SW2b (TEST_MODE_I) - SW_N2 - SW3 (HOLD_OK) - SW_N3 - SW4 (WIN_OPEN_I) - BRIDGE_5V. SW5 (SW5_ON = SEQ_HOLD AND NOT TEST_MODE) from 5V0_SYS straight to BRIDGE_5V (D-59: consent starts, hardware completes).
Every ON pin has a 100 k pull-down: an unpowered or open driver leaves its switch off. QOD is left open on all six: an enabled internal 25-ohm discharge on SW4 would load BRIDGE_5V while SW5 holds it, and on an inner node it would pull current backwards through the other switches. Instead each inner node and the rail have their own bleed resistor.
CT = 1 nF on every switch: whichever closes last sets a rise of about 2.5 ms (SLVSD76C Table 2), so the 220 uF hold-up on sheet 12 draws about 0.45 A, inside the 2 A rating.
TPS22918 VOUT may exceed VIN (SW4 while SW5 holds the rail): outside the recommended conditions (VOUT <= VIN), inside the 6 V absolute maximum; any reverse current only feeds back towards 5V0_SYS and cannot create a consent (capture notes, assumption A-3).
BRIDGE_ARMED_N: 2N7002 pulls low once BRIDGE_5V passes about 1-2.5 V (VGS(th) 1-2.5 V, onsemi NDS7002A/D); pull-up is on sheet 04.
"""

[[group]]
id = "request"
title = "Main controller's request: SHOCK_REQ buffered on 3V3_MAIN"
note = """
SHOCK_REQ: 100 k pull-down (contract §5.4). SN74LVC1G17 Schmitt buffer powered by 3V3_MAIN (consent buffer on its own rail, contract §8): with 3V3_MAIN off its output is high impedance (Ioff) and the SW1 ON pull-down holds REQ_B low.
REQ_B drives SW1, the window-start AND and the re-arm NOR.
"""

[[group]]
id = "hold_drive"
title = "Hold-drive buffers: HOLD_M_CLK -> HOLD_A_DRV on 3V3_MAIN, HOLD_S_CLK -> HOLD_B_DRV on 3V3_SUP"
note = """
Each clock: 100 k pull-down at the input (contract), then a two-pole RC low-pass (4.7 k / 3.9 nF, 47 k / 390 pF: each pole 8.7 kHz) and a 1 M pull-down at the Schmitt input, then an SN74LVC1G17 on the controller's own rail. The low-pass is placed BEFORE the Schmitt buffer, not between the buffer and the pump: a 100 kHz square wave reaches the Schmitt input as about 31-36 mV p-p (CALC, capture notes §3.1), far below its 0.51 V minimum hysteresis, so the buffer output stays static and the pump on sheet 11 gets no drive at all; 1-5 kHz squares (30-70 % duty) pass edge for edge. The buffer then drives the pump with its full 24 mA output, so the filter costs the pump nothing (WP-F's requirement: -7.0 V at 1.1 mA from a 2 kHz 3.3 V clock).
The 1 M pull-down makes an open filter resistor read low (static), never floating.
HOLD_A_DRV / HOLD_B_DRV pull-downs are on sheet 11 (contract §5.4).
"""

[[group]]
id = "det_pd"
title = "Dynamic consent detector PERMIT_CLK -> PERMIT_OK on 3V3_SUP"
note = """
Band-limited pump detector (§B8.1, R-11). PERMIT_CLK: 100 k pull-down, two-pole low-pass (as the hold drives), 1 M pull-down, SN74LVC2G14 on 3V3_SUP: gate 1 squares and inverts, gate 2 re-inverts, so every clock edge (rising or falling) is a rising edge on one of the two pump phases.
Each phase: 470 ohm, TWO 220 nF C0G in series (one shorted capacitor still blocks DC), BAV99 series pair (pin 1 anode to GND, pin 3 common = pump node, pin 2 cathode to the hold node). Hold node PD_H: 100 nF C0G with 2 x 64.9 k in parallel (32.45 k; one open resistor only doubles the time constant; rev 0.3 D-1, was 71.5 k). Comparator TLV7031 (push-pull; held LOW by its power-on reset below 1.6 V supply, SLVSE13J §6.3): IN+ = hold node, IN- = 0.30 x 3V3_SUP from 2 x 464 k in parallel over 100 k (one open top resistor lowers the threshold to 0.18 x 3V3_SUP, never to zero).
Behaviour [SIM, sim/logic-relay §1.2, with 64.9 k bleeds]: valid <= 0.1 ms after the first edges at 1 kHz; stays valid >= 4.07 ms after the last edge (firmware gap <= 1 ms); invalid <= 7.50 ms after the last edge from 5 kHz (need <= 8 ms); DC gives nothing; >= 100 kHz never reaches the pump (static Schmitt). Supply is the supervisor's rail: supervisor off = no output (pull-down on PERMIT_OK).
One single transition of PERMIT_CLK (one edge), a pulse > 50 us or the supervisor powering up DOES give a valid output for up to 7.5 ms [SIM LR §1.2]; documented in the capture notes (bounded by the 20 ms rail-ready delay on sheet 12 and the window).
"""

[[group]]
id = "det_td"
title = "Dynamic consent detector TEST_PERMIT_CLK -> TEST_OK on 3V3_SUP"
note = """
Band-limited pump detector (§B8.1, R-11). TEST_PERMIT_CLK: 100 k pull-down, two-pole low-pass (as the hold drives), 1 M pull-down, SN74LVC2G14 on 3V3_SUP: gate 1 squares and inverts, gate 2 re-inverts, so every clock edge (rising or falling) is a rising edge on one of the two pump phases.
Each phase: 470 ohm, TWO 220 nF C0G in series (one shorted capacitor still blocks DC), BAV99 series pair (pin 1 anode to GND, pin 3 common = pump node, pin 2 cathode to the hold node). Hold node TD_H: 100 nF C0G with 2 x 64.9 k in parallel (32.45 k; one open resistor only doubles the time constant; rev 0.3 D-1, was 71.5 k). Comparator TLV7031 (push-pull; held LOW by its power-on reset below 1.6 V supply, SLVSE13J §6.3): IN+ = hold node, IN- = 0.30 x 3V3_SUP from 2 x 464 k in parallel over 100 k (one open top resistor lowers the threshold to 0.18 x 3V3_SUP, never to zero).
Behaviour [SIM, sim/logic-relay §1.2, with 64.9 k bleeds]: valid <= 0.1 ms after the first edges at 1 kHz; stays valid >= 4.07 ms after the last edge (firmware gap <= 1 ms); invalid <= 7.50 ms after the last edge from 5 kHz (need <= 8 ms); DC gives nothing; >= 100 kHz never reaches the pump (static Schmitt). Supply is the supervisor's rail: supervisor off = no output (pull-down on TEST_OK).
One single transition of TEST_PERMIT_CLK (one edge), a pulse > 50 us or the supervisor powering up DOES give a valid output for up to 7.5 ms [SIM LR §1.2]; documented in the capture notes (bounded by the 20 ms rail-ready delay on sheet 12 and the window).
"""

[[group]]
id = "held"
title = "'Held' logic (rev 0.3): HOLD_OK = all FOUR opto sensors lit (two per discharge path, I-4); open-drain readback of each sensor"
note = """
Four sensor lines from sheet 11 (two independent optos per stack, contract issue 3 §5.4): HOLD_A_HELD_N, HOLD_A_HELD2_N (path A), HOLD_B_HELD_N, HOLD_B_HELD2_N (path B). Each has a 47 k pull-up to 5V0_SYS (rev 0.3 D-2/D-3, was 10 k: the aged Darlington then needs only 0.10 mA to pull it low) plus a 1 M backup, because 'dark' is a normal state and one open resistor must not float a CMOS input. Low only when that opto's LED is lit by the real negative hold bias; low level <= 1.0 V (contract) against LVC VIL 0.3 x VCC = 1.35 V at 4.5 V (SCES213Y). Not-held level with the worst dark current [CO: 20 uA at 85 C] plus two LVC inputs (2 x 5 uA, SCES213Y II) through 44.9 k: >= 4.90 - 1.35 = 3.55 V against VIH 0.7 x VCC = 3.43 V (thin; at the 70 C device limit about 0.5 V margin; capture notes Rev 0.3 §R3.4).
HOLDA_OK = NOR(HOLD_A_HELD_N, HOLD_A_HELD2_N) (U914), HOLDB_OK = NOR(HOLD_B_HELD_N, HOLD_B_HELD2_N) (U933), HOLD_OK = HOLDA_OK AND HOLDB_OK (U934), all SN74LVC1G on 5V0_SYS. A shorted zener or Darlington in ONE sensor makes that line read 'held' at about 1 V; the other sensor of the same path, on its own line and its own gate input, still requires the real bias (sim/rev3 §1). Unpowered or open gate outputs: 100 k pull-downs on HOLDA_OK, HOLDB_OK (R977, R978) and on HOLD_OK (R904, SW3 ON) read 'not held'.
One HOLD_OK feeds SW3, both charger chains and the window-start AND: a stuck-high gate is seen by the blocking tests (F-8 (c)/(d)) and by T-7 (each sensor's own readback).
HOLD_RB_A_N, HOLD_RB_B_N (U915, sensor 1) and HOLD_RB_A2_N, HOLD_RB_B2_N (U935, sensor 2): SN74LVC2G07 open-drain copies (low = held), pull-ups on sheet 04; 5V0_SYS off = released = 'not held'. Self-test T-7 releases each hold in turn and expects both lines of that path high within 25 ms while the other pair stays low.
"""

[[group]]
id = "test_mode"
title = "TEST_MODE = TEST_OK AND LOWV_OK AND NOT PERMIT_OK (D-61, §B14)"
note = """
LOWV_OK: 100 k pull-down (contract §5.4): comparator on sheet 07 unpowered = 'capacitor not known to be low' = no test mode.
SN74LV1T gates (TTL-level inputs at 5 V, 5.5 V tolerant, no clamp diode to VCC: SCLS739F §8.3.3) take the 3.3 V signals into the 5V0_SYS logic, so an unpowered 5V0_SYS cannot be back-fed from either controller's rail. Every internal 'allow' node has a 100 k pull-down: a dead gate reads 'not allowed'.
TEST_MODE_I drives SW2b, the window-start OR and, through 1 k, the global TEST_MODE to sheet 12 (100 k pull-down there). TM_N (= NOT TEST_MODE) enables the charger gates and SW5.
"""

[[group]]
id = "charger"
title = "Charger gates (D-25, R-5): VTRANS_EN = CHG_SESSION AND HOLD_OK AND NOT TEST_MODE; CHARGE_EN = CHG_RUN AND HOLD_OK AND NOT TEST_MODE"
note = """
Two independent two-gate chains, one per enable; the charger on sheet 10 needs BOTH (eFuse supply and CHARGE pin), so one stuck-high gate in either chain still leaves HOLD_OK gating the charger through the other. CHG_SESSION and CHG_RUN: 100 k pull-downs (contract §5.5); the SN74LV1T08 input is the Ioff-type buffer on the reader's rail (R7) instead of a separate buffer on 3V3_MAIN (capture notes: departure DEP-2).
Off-time after HOLD_OK or TEST_MODE changes: two gate delays (< 50 ns) plus the 1 k / 100 k output network: far inside the 1 ms the contract asks (§10 WP-D with WP-E). Pull-downs of VTRANS_EN and CHARGE_EN are on sheet 10.
"""

[[group]]
id = "seq_hold"
title = "SW5 enable = SEQ_HOLD AND NOT TEST_MODE (D-59 sequence hold; never in test mode)"
note = """
SEQ_HOLD from sheet 12 (BRIDGE_3V3 logic): 100 k pull-down here (contract §5.4). SW5_ON pull-down is with U906.
"""

[[group]]
id = "window"
title = "150 ms permit window (R-4, R-11): started by the consent chain, latched start, 50 ms absent-consent re-arm"
note = """
CHAIN = REQ_B AND HOLD_OK AND (PERMIT_OK OR TEST_MODE) - the logical 'SW1-SW3 all on' (capture notes DEP-3: logic, not the SW_N3 voltage, so a rail held by SW5 cannot fake or mask the start). Rev 0.3 (D-6, LR §1.4 race B): CHAIN reaches the WSTART clock through 10 k / 10 nF C0G and an SN74LVC1G17 (CHAIN_D, 60-104 us later [SIM rev3-wpd]), because REARM_N releases the WSTART clear only some microseconds after the first consent returns (15.7 us simulated, LR) and an edge inside that time was lost. The rising edge of CHAIN_D clocks WSTART (SN74LVC2G74, D = 1): the start is latched, so a toggling consent cannot restart the window. WSTART charges 1.47 M / 100 nF C0G; TLV7031 compares with 0.640 x 5V0_SYS (56.2 k / 100 k): WIN_OPEN_I high while below = 131.8-161.5 ms [SIM LR §1.3]. Ratiometric: supply variation cancels.
Re-arm: ANY_N = NOR(REQ_B, PERMIT_OK OR TEST_OK) high only with every consent absent. It charges 549 k / 100 nF; TLV7041 (open drain) pulls REARM_N low after 51-60 ms [CALC] and clears WSTART; any consent returning discharges the RC at once through the BAS116. Open-drain + 100 k pull-up: a dead re-arm comparator never re-arms (window stays closed after use).
BAS116 diodes empty each RC quickly when its driver goes low (low leakage, 5 nA at 75 V: negligible against 1.47 M).
Power-up: WSTART is undefined (SCES203Q states no power-up state); either state is safe: open until the first chain edge, or open 150 ms then closed until re-arm (capture notes §5).
WIN_OPEN_I drives SW4 and, through 1 k, the global WIN_OPEN to sheet 12 (100 k pull-down and Ioff buffer there).
"""

