# 09_interlock - hardware interlock (WP-D shock logic). NOT FOR CONSTRUCTION — unreviewed design.
# Consent detectors (permit, test permit), hold-drive buffers, 'held' logic, 150 ms window with latched start and
# 50 ms re-arm, test mode, charger gates, the series load switches SW1-SW4 and the sequence hold SW5 that make BRIDGE_5V.
# Revision 0.3 (contract issue 3, capture-notes/rev3-changes.md WP-D D-1...D-6): bleeds 64.9 k, four-line HOLD_OK,
# 47 k held pull-ups, second-sensor readbacks, 100 us window-start clock delay. See capture-notes/WP-D.md 'Revision 0.3'.
# Sources: docs/HARDWARE_DESIGN.md v0.3 §B8, §B14, §13, §F-1/F-8; hardware/aed-main/contract.md issue 3; decisions D-25,
# D-59, D-60, D-61; firmware/crates/aed-core/src/interlock.rs. Arithmetic, truth tables, failure table and every
# assumption: hardware/aed-main/capture-notes/WP-D.md.
# Datasheets were fetched 2026-11-27 from the manufacturer's site (TI, onsemi); URLs on each part.
# Generated once by a throwaway script; this file is the source of truth (edit it directly).

