# 13_hv_bridge — output bridge power stage (WP-G). HIGH VOLTAGE.
# NOT FOR CONSTRUCTION — unreviewed design. Drawn with AI assistance; not reviewed by a qualified high-voltage or
# medical-device engineer (SAFETY.md §2a). Nothing here is an instruction to build, power or test anything.
# Source: docs/HARDWARE_DESIGN.md §B6, §B13.5, §B14, §13, §14; contract.md issue 2 (§2, §4, §5.5, §5.7, §8, §9).
# Arithmetic, ratings against stresses, the per-part failure table and every unverified item:
#   hardware/aed-main/capture-notes/WP-G.md
# References 1301-1399 (contract §2). Contract-fixed: Q1301 QHA, Q1302 QLA, Q1303 QHB, Q1304 QLB, R1301 R_S,
# L1301 L_S, D1301 D_FW, R1302 shunt, T1301/T1302, U1301/U1302 UCC5350MC, U1303 MGJ2, K1301, R1303.

[sheet]
name = "13_hv_bridge"
title = "HIGH VOLTAGE: H-bridge (4 x 3.3 kV SiC), R_S + L_S with freewheel diodes, gated push-pull high-side drive, low-side drivers, current sense and comparators, bridge test load"
source = "docs/HARDWARE_DESIGN.md §B6, §B13.5, §B14; contract.md issue 2; capture notes WP-G.md"
date = "2026-11-27"
comments = [
  "Every turn-off is low side first (sheet 12 orders it); coil current freewheels through D1302+D1301; no switch is ever allowed to avalanche.",
  "Every switch is held OFF by a gate-source resistor with all supplies absent. HV_*, HSA_*, HSB_* nets carry up to 2.2 kV: no test points on them (R9).",
]

[nets]
power = ["GND", "HV_RTN", "BRIDGE_5V", "BRIDGE_3V3"]
global = [
  "HV_CAP_P",                         # capacitor + (driver 10, store 11)
  "HV_OUT_A", "HV_OUT_B",             # bridge outputs -> 14 (patient relay)
  "G_HA", "G_HB", "G_LA", "G_LB",     # gated enables from 12; 100k pull-downs here (contract §5.7)
  "BTEST_EN",                         # test relay enable from 12; 100k pull-down here
  "OC_DET_N", "IDLE_I_DET_N",         # push-pull comparator outputs -> 12 (pull-downs on 12)
  "I_SHOCK",                          # 26.7 mV/A -> 04
  "OUT_A_TAP", "OUT_B_TAP",           # 1:997 output taps, clamped to GND -> 07
]

# ---------------------------------------------------------------- ERC acceptances (other packages' rails / ends)
# KiCad reports an undriven rail once per sheet, naming only the power symbol's reference. The generator numbers
# power symbols in a fixed order (KiCad 10 ERC, build of 27 Nov 2026): #PWR13000 = HV_RTN, #PWR13001 = BRIDGE_3V3,
# #PWR13002 = GND, #PWR13013 = BRIDGE_5V (checked in the generated 13_hv_bridge.kicad_sch). If parts are re-ordered
# these numbers can move; the build then fails loudly and the numbers must be re-read.
[[erc_accepted]]
type = "power_pin_not_driven"
match = "^/13_hv_bridge/ .*Symbol #PWR13001 Pin 1"
until_sheet = "12_bridge_logic"
reason = "BRIDGE_3V3 is made on 12_bridge_logic (WP-D, placeholder on this branch). No package flags another package's rail (contract §4)."

[[erc_accepted]]
type = "power_pin_not_driven"
match = "^/13_hv_bridge/ .*Symbol #PWR13013 Pin 1"
until_sheet = "09_interlock"
reason = "BRIDGE_5V is made on 09_interlock (SW1-SW5, WP-D, placeholder on this branch)."

[[erc_accepted]]
type = "power_pin_not_driven"
match = "^/13_hv_bridge/ .*Symbol #PWR13002 Pin 1"
until_sheet = "01_power_battery"
reason = "GND is made on 01_power_battery (WP-A, placeholder on this branch)."

[[erc_accepted]]
type = "power_pin_not_driven"
match = "^/13_hv_bridge/ .*Symbol #PWR13000 Pin 1"
until_sheet = "11_hv_storage"
reason = "HV_RTN is made on 11_hv_storage (NT1101 || NT1102, WP-F, placeholder on this branch)."

# ================================================================= groups
[[group]]
id = "bridge"
title = "H-bridge: four 3.3 kV SiC MOSFETs (Microchip MSC080SMA330B4N, TO-247-4 with source sense)"
note = """
Phase 1: QHA on beforehand (carrier), QLB times the pulse. Phase 2: QHB on beforehand, QLA times it (§B6.1). High sides switch at zero current; low sides switch the current. VDSS 3300 V against <= 2.2 kV (1.5x). Gate drive returns to each device's SOURCE SENSE pin (terminal 3), never to the power source.
Thermal [CALC from DS00005914A Fig 1-5, 1-18; capture notes §4]: worst planned shock (65.7 A decaying, 25 Ohm, phase 1 = 3-12 ms) Tj 55 -> 102 C at VGS 20 V, -> 119 C if a high side only reaches VGS 17 V; fault 'low side frozen on to the 28.8 ms cap' 2,000 V, 25 Ohm: 124 C worst. Limit 150 C. Fault 18 (QLB shorted, QHA turning on slowly through its linear region) is NOT covered: 130-300 C estimated -> finding F-1.
No avalanche and no short-circuit rating exist for this part: the design never lets it avalanche (freewheel D1301/D1302) and the OC latch trips at 82-98 A, but the current at the instant of turn-off (115-126 A) is above IDM 107 A -> finding F-2.
"""

[[group]]
id = "series"
title = "Series element R_S + L_S, freewheel diodes D1302 + D1301 (two in series), snubber C1301 + C1302 + R1304"
note = """
R1301 R_S 3.9 Ohm ceramic composition (Ohmite OY39GKE, 80 J single impulse): 23.6 J per adult shock at 25 Ohm, 3.3 J at 175 Ohm [CALC]; 254 V peak across it (400 V working). L1301 30 uH made to order (§14).
Freewheel: anode at HV_BUS, cathode at HV_CAP_P (§B6.5). TWO 3.3 kV SiC Schottky diodes in series (departure: the contract lists one D1301): a single shorted freewheel diode would otherwise silently remove R_S and L_S from the circuit. Each GC05MPS33J: 3300 V, IF,MAX 250 A for 10 us; stress 24 A (phase end) to about 126 A (OC trip) decaying with tau = 7.6 us.
Snubber HV_BUS-HV_RTN: two 10 nF 3 kV X7R MLCC in series (5 nF nominal, about 2.5-3.5 nF at 2 kV bias [EST]) + 10 Ohm OY. Two in series so that one cracked/shorted MLCC does not short the capacitor through R_S. Values are placeholders for simulation [SIM] (§B6.5).
"""

[[group]]
id = "lsdrv_a"
title = "QLA low-side drive: UCC5350MC (Miller clamp), +20/-5 V, Rg_on 220 Ohm, Rg_off 33 Ohm + diode"
note = """
IN+ = G_LA with the contract's 100 k pull-down at the input; IN- tied to GND1. Output side from the MGJ2 rails (+20 V / -5 V around LSD_0V). UVLO, unpowered input side, unbiased output: OUT held low (SLLSER8J Tables 8-2, 8-3, §8.3.4.2).
Turn-on: (20-9 V)/(220+3.7 Ohm) = 49 mA through the 51 nC Miller charge -> 1.0 us, about 2 V/ns at the drain [CALC]. Turn-off: 33 Ohm via 1N4148W, about 0.36 A -> 0.14 us. CLAMP pin goes straight to the gate: below VEE2 + 2.1 V it ties the gate to -5 V with >= 5 A.
R1318 10 k gate-source holds QLA off with every supply absent. D1308 (22 V) + D1309 (6.8 V) anti-series clamp: +21.5..+24 V / -7.1..-7.9 V against the absolute VGS +23/-10 V (+25/-12 V transient).
"""

[[group]]
id = "lsdrv_b"
title = "QLB low-side drive: same as QLA"
note = "Identical to QLA's network. U1302 IN+ = G_LB (100 k pull-down here)."

[[group]]
id = "lssupply"
title = "Low-side +20/-5 V supply: Murata MGJ2D052005SC on BRIDGE_5V, preloads, per-driver star resistors"
note = """
MGJ2 output 0 V (LSD_0V) joins each low side's SOURCE SENSE through its own 2.2 Ohm (R1320, R1325) so the two Kelvin loops are not joined directly through LS_SRC. Each driver has its own 1 uF from +20 V and to -5 V at its Kelvin source.
PRELOADS (capture addition): the MGJ2 needs >= 10 % load or its output rises up to 1.25 x (20 V -> 25 V, above VGS max 23 V) (Murata KDC_MGJ2_F01 'Minimum load'). R1326 2.2 k on +20 V (9.1 mA >= 8 mA) and R1327 1.2 k on -5 V (4.2 mA >= 4 mA).
Hold-up: 10 uF + 2 x 1 uF on each rail, preload tau about 26 ms: the drivers stay above UVLO2 (11 V max falling) for about 20 ms after BRIDGE_5V is lost, far longer than the low-side-first turn-off (about 1 us) needs. Start-up 5.4 ms typ (inside RAIL_READY 20 ms on 12).
"""

[[group]]
id = "clock"
title = "High-side carrier clock: TLC555 at about 805 kHz (15 % low time = dead time), /2 two-phase divider, whole-cycle gating flip-flops"
note = """
U1304 astable: RA 12.4 k, RB 2.74 k, C 100 pF C0G -> high 1.05 us, low 0.19 us, 805 kHz nominal [CALC; 650-900 kHz with parts and 555 delay EST]. U1305 inverts; U1306 toggles on OSC falling edges -> PH1/PH2 at about 400 kHz, exactly 50 % (equal volt-seconds in the transformer).
U1307/U1308 (sync): G_HA/G_HB is sampled on the PH1 rising edge so the carrier always starts with a whole cycle (§B6.3 'gating on a clock edge'); /CLR = G_H* stops it at once (adds <= 2.5 us to turn-on, nothing to turn-off).
Drive = PHx AND OSC AND EN (U1309-U1312): each FET conducts about 1.05 us per 2.5 us period, with 0.19 us dead time at every phase change (no cross-conduction in the centre-tapped primary). Everything runs whenever BRIDGE_3V3 is up; the gate pull-downs and the 100 k on G_H* make every input low when 12 is unpowered.
"""

[[group]]
id = "hsprim_a"
title = "QHA carrier: DMN3042L push-pull into T1301 (centre tap on BRIDGE_5V)"
note = """
Each primary half sees 5 V; drains swing to 2 x 5 V. 30 V FETs, 22 V zener on each drain absorbs the leakage-inductance spike. Peak primary current about 0.8 A while the gate charges (190 mA secondary x turns ratio about 4) [EST]. 100 k gate pull-downs: FETs off with the logic unpowered.
"""

[[group]]
id = "hsprim_b"
title = "QHB carrier: same as QHA"
note = "Identical to QHA's primary stage, driven by U1311/U1312 and T1302."

[[group]]
id = "hssec_a"
title = "QHA floating gate circuit (HSA island, floats 0-2.2 kV with HV_OUT_A)"
note = """
T1301 secondary -> 1N4148W bridge -> HSA_RECT (1 nF, 2.2 k bleed, 20 V zener clamp) -> diode -> 100 Ohm -> gate. 2 x 47 nF C0G gate-source (one open still leaves 47 nF) + Cgs about 3.46 nF = 97.5 nF.
Turn-on [CALC]: tau = (100 + about 5) Ohm x about 103 nF effective (incl. the MOSFET's own charge to 15 V) = 10.8 us; 0 -> 15 V from an 18.3 V source in 18.5 us nominal; worst (17.3 V source, +20 Ohm source resistance, C +5 %): 26.4 us + 2.5 us sync + 1.3 us = <= 30 us (spec <= 40 us).
Turn-off [CALC]: carrier stops -> HSA_RECT collapses (tau 2.2 us; PNP starts after about 0.2 us) -> BC807-40 pulls the gate through 22 Ohm, base drive via 470 Ohm + 2.2 k: tau 2.8 us nominal, 4.0 us worst -> below 2 V in 7.1 us nominal / <= 10.3 us worst; below 1 V in <= 15.4 us worst (spec about 10 us, <= 20 us). PNP failed open: 10 k bleed, tau 0.98 ms.
Off state: the PNP also clamps any Miller-coupled rise to about 0.6-1.5 V. dv/dt coupling 51 nC / 97.5 nF = 0.52 V (one 47 nF open: 1.0 V, PNP clamp about 1.4 V) against VGS(th) minimum 1.9 V at 25 C, about 1.48 V at 150 C [EST from Fig 1-16 scaling] (capture notes §5).
D1319 22 V gate clamp (backup to the 20 V clamp on HSA_RECT). R1332 10 k holds the gate off with no carrier.
"""

[[group]]
id = "hssec_b"
title = "QHB floating gate circuit (HSB island, floats with HV_OUT_B): same as QHA"
note = "Identical to the HSA island."

[[group]]
id = "isense"
title = "Current sense: 2 mOhm 4-terminal shunt LS_SRC -> HV_RTN, bypass diode, 90 A fast comparator, INA240A1 -> I_SHOCK, 5 A idle comparator"
note = """
Over-current: shunt Kelvin -> 100 Ohm / 1 nF (tau 100 ns) -> TLV3501 (4.5 ns). Threshold 3.3 V x 10.0 k / 184 k = 179.3 mV, referred to the shunt's own HV_RTN Kelvin terminal -> 89.7 A nominal; band 82-98 A with reference +-2.9 %, offset +-6.5 mV, shunt +-1 % and TCR [CALC]. Response <= 0.2 us to the comparator output, plus 12's latch and the UCC5350 (<= 100 ns).
Waveform: INA240A1 (gain 20) on BRIDGE_5V, 10 Ohm input resistors, 2:3 divider -> I_SHOCK = 26.67 mV/A, 3.2 V at 120 A (output swing VS - 0.2 V max) (§B6.6).
Idle current: I_SHOCK -> 1 k / 100 pF -> TLV3501, threshold 3.3 V x 10.0 k / 247 k = 133.6 mV -> 5.0 A; band about 4.5-5.5 A. It depends on the INA240: a dead INA240 reads 0 A, which the self-test catches (no current in the test sequence) -> capture notes.
D1303 (capture addition): S3D across the shunt. If the 2 mOhm shunt ever opens, LS_SRC would otherwise rise to kilovolts and destroy both low-side drivers, the MGJ2 and the INA240; with D1303 it stays below about 1 V and the OC comparator trips at once (fail safe, detected).
BAT54S clamps the OC comparator input to GND/BRIDGE_3V3. Outputs are push-pull on BRIDGE_3V3; the 100 k pull-downs are on 12: unpowered or open = 'fault' (R11).
"""

[[group]]
id = "osense"
title = "Output dividers and rest pull-downs: 4 x 249 k (KOA HV73, 2512, 3 kV working) + 1.00 k -> OUT_x_TAP (1:997), 3.6 V clamp to GND"
note = """
Each divider (997 kOhm) is also the output's rest pull-down. Idle: off-state leakage of the high side (<= 35 uA at 3.3 kV, 25 C) x 997 k <= 35 V on the output, <= 35 mV on the tap; a shorted high side reads the capacitor voltage / 997 (<= 2.2 V).
Per resistor: 550 V at 2.2 kV (one shorted: 733 V) against 3000 V working; 1.2 W only while the output is at full voltage (ms in a shock; seconds in the 'high side shorted' fault) against 1 W rated and 2.5 x rated voltage for 5 s overload.
Taps clamped to GND at the tap (BZX84C3V6, R-21), not to a reader's rail.
"""

[[group]]
id = "btest"
title = "Bridge test load: reed relay K1301 (10 kV, 5 V coil) + 200 Ohm R1303 across the outputs; only in test mode (§B14)"
note = """
BTEST_EN (100 k pull-down here) -> DMN3042L -> coil from BRIDGE_5V (28 Ohm, 178 mA at 5 V), 1N4148W flyback. Cold switched: sheet 12 closes it >= 2 ms before any low side and only with TEST_MODE.
At <= 60 V: 0.29 A, 17.6 W peak, <= 0.18 J. A welded K1301 during a real shock would put about 190 J into R1303 (80 J rating): it would fail; the self-test finds a welded contact (§B14.3) and the firmware refuses to shock (fault 31, open item).
Relay operating range is -20..+70 C (narrower than the rest of the sheet) -> capture notes.
"""

[[group]]
id = "tp"
title = "Test points (§15): low-voltage nets only"
note = "OUT_A_TAP, OUT_B_TAP, I_SHOCK, OC_DET_N, IDLE_I_DET_N. None on HV_*, HSA_*, HSB_* (R9)."

