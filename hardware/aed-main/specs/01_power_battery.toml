# 01_power_battery — 2S Li-ion pack connector, ADI MAX17320 protector + fuel gauge with two high-side N-FETs and a
# 2 mOhm sense resistor, cell NTCs, main fuse F101 -> VBAT_SYS, battery-under-load test with a hardware time limit.
# NOT FOR CONSTRUCTION — unreviewed design (SAFETY.md §2a). Nothing here is an instruction to build or power anything.
# Source: docs/HARDWARE_DESIGN.md §B1.1-B1.3, §11, §13 (faults 13, 40), §16 rank 17; contract.md issue 2 §2, §4, §5.1,
# §5.2, §8 row 01, §9 WP-A; issue 3 §0, §4 (D-66) and capture-notes/rev3-changes.md WP-A A-1..A-4. Capture notes: hardware/aed-main/capture-notes/WP-A.md. References 101-199.

[sheet]
name = "01_power_battery"
title = "2S pack: connector, MAX17320 protector and gauge, cell NTCs, main fuse, battery load test"
source = "docs/HARDWARE_DESIGN.md v0.3 §B1.1-B1.3; contract.md issue 3 §0, §4, §5.2, §8, §9 (WP-A)"
date = "2026-11-27"
comments = [
  "Device ground of U101 (GND, CSP, cell filters, NTC return) is BAT_NEG, the cell side of R101; system GND is the load side (CSN)",
  "MAX17320 thresholds are non-volatile configuration, not parts: see the 'gauge' box and capture notes (COMMSH must be 0)",
  "VBAT_SYS: no steady resistive load below 1 MOhm from any sheet (contract §4, D-66). Lowest drawn load: R316 + R317 = 8.0 MOhm on 03 (complies)",
]

[nets]
power = ["GND", "VBAT_PACK", "VBAT_SYS", "3V3_MAIN"]
# Made here: GND is the load side of the sense resistor R101 (passive), VBAT_SYS is the load side of F101 (passive).
# VBAT_PACK is driven by the BQ25887 BAT pin (power output) on 02_power_dock, so it needs no flag.
power_flags = ["GND", "VBAT_SYS"]
# Local supply nodes: the cell stack (through the connector) and the 10-ohm IN filter.
flag_nodes = ["BAT_NEG", "U101_IN"]
global = [
  "GAUGE_ALRT_N",   # U101 ALRT (open drain) -> 04; pull-up 100k to 3V3_MAIN on 04 (contract §5.2)
  "BAT_LOAD_EN",    # 04 -> 01; 100k pull-down HERE (R110, contract §5.2)
  "I2C_M_SCL",      # 04 master; 4.7k pull-ups on 04 (contract §5.1)
  "I2C_M_SDA",
  "VBAT_MID",       # issue 3 (I-1): pack mid-point J101 pin 3 -> R106 (U101 cells) here, U201 MID/CBSET on 02
]

[[erc_accepted]]
type = "pin_not_driven"
match = "U101 Pin 8|U201 Pin 5|U305 Pin 3"
until_sheet = "04_main_mcu"
reason = "I2C_M_SCL (SCL inputs of U101, U201 on 02, U305 on 03; KiCad reports one of them) is driven by the main controller and pulled up on 04_main_mcu (WP-B), a placeholder in this worktree."

[[erc_accepted]]
type = "isolated_pin_label"
match = "GAUGE_ALRT_N"
reason = "Other end on 04_main_mcu (WP-B, placeholder in this worktree); disappears when 04 is captured."

# ====================================================================== groups
[[group]]
id = "pack"
title = "Pack connector J101 (keyed, Molex Mini-Fit Jr 2x4): two contacts each for + and -, mid-point, two cell NTCs"
note = """
Pack = 2 x Molicel INR-18650-P28A in series with an NTC on each cell, made by a pack assembler (design §B1.1). Keyed housing instead of a reverse-polarity MOSFET (design §B1.1: a series MOSFET would cost 0.2-0.4 W at 21 A peaks).
Current per contact: 9.2 A average / 21 A peak (design §B4.2) shared by two contacts = 4.6 A / 10.5 A each. Mini-Fit Jr terminals are rated 9 A (standard) to 13 A (HCS) per circuit [BK, Molex drawing not read: VERIFY terminal rating and wire gauge].
Pin 8 returns both NTCs to BAT_NEG (device ground of U101). The mid-point (pin 3) is the contract net VBAT_MID (issue 3, rev 0.3 A-1): the gauge's cell sense here and U201 MID (300 ohm) / CBSET (100 ohm) on 02_power_dock.
"""

[[group]]
id = "gauge"
title = "U101 MAX17320G20 protector + gauge: 2S wiring (CELL1 = CELL2 = CELL3 = mid-point), high-side CHG/DIS N-FETs, 2 mOhm sense"
note = """
2S wiring per datasheet Figure 23: BATTS = top of stack through RBAL; CELL1, CELL2 and CELL3 joined on the pin side of RBAL to the mid-point ('short for 2S', 'short for 2S or 3S') [read from the figure graphic: VERIFY]. RBAL = 100 ohm: balancing current CELL1 = 4.2/(100+9) = 39 mA, BATTS = 4.2/(2x100+9) = 20 mA (datasheet formulas, RSWITCH 9 ohm typ), < 100 mA pin limit; 0.15 W in R105/R106 -> 1206 0.25 W.
IN: 10 ohm from the top of stack + 0.1 uF/25 V; CP: 0.47 uF/25 V to IN; REG3, REG2: 0.47 uF/10 V; CHG FET gate-source 0.1 uF (all per the pin table). PCKP: 1 k to VBAT_PACK. PFAIL unused: 1 k to ground. AOLDO unused: 10 k to ground. ZVC open (zero-volt charging not used). TH3, TH4 unused: to ground.
Sense R101 = 2 mOhm (Bourns CSS2H-2512K-2L00F, 5 W): 9.2 A average -> 0.17 W; current register range +/-51.2 mV / 2 mOhm = +/-25.6 A covers the 21 A peak.
PROTECTION THRESHOLDS (non-volatile configuration, R-16 coordination, contract §9): fast over-discharge ODTH = -70 mV = 35 A, OCDLY = 5 -> 70 us + 5 x 977 us = 4.96 ms; short circuit SCTH = -130 mV = 65 A, SCDLY = 2 -> 70 + 2 x 61 = 192 us (>= 100 us). Both are above everything a limited branch can draw (eFuse 13 A, regulator fuses 1/1/3 A, load test 10.5 A, coil boost 2 A).
'Auto-retry': the MAX17320 releases an over-discharge / short-circuit fault when PCKP rises above 1 V while it sources 30 uA into PCKP, or when a charger is detected (datasheet 'Overcurrent Protection'). That works only if VBAT_SYS is nearly unloaded. Issue 3 rule (D-66, contract §4): no steady resistive load below 1 MOhm on VBAT_SYS from any sheet; the lowest drawn is 8.0 MOhm (R316 + R317 on 03). The datasheet (Rev 12, 7/25) gives the test current only as 30 uA with no minimum and the release threshold as 1 V in one place, 1.5 V (SCDet) in another; with the 1 MOhm rule release works down to about 10 uA [CALC: 8 uA leakage + 1.5 V / 0.89 MOhm = 9.7 uA]. ADI minimum still to be obtained (design O-5). It is NOT a timed retry.
CONFIGURATION RECORD (issue 3, rev 0.3 A-4; non-volatile, firmware FW-20; MAX17320 datasheet 19-100749 Rev 12 7/25): nConfig.COMMSH = 0; nODSCTh.ODTH = 3 (-77.5 + 3 x 2.5 = -70 mV = 35 A nominal; comparator offset +/-1.2 mV and gain +/-5 % give 32.6-37.4 A) with nODSCCfg.OCDLY = 5 (4.96 ms): the '>= 35 A OR >= 1 ms' rule is met by the delay (4.96 ms >> the charger eFuse's 30 A / 0.48 ms), not by the threshold alone; nODSCTh.SCTH = 5 (-155 + 25 = -130 mV = 65 A, 61.2-68.9 A with the same errors, >= 60 A) with nODSCCfg.SCDLY = 2 (192 us); nBalTh.BALCFG = 0 (Table 21: 'When set to 0, cell balancing is disabled') so only the BQ25887 balances, through CBSET on 02; nBalTh.Imbalance may stay as a charge-fault threshold (protection, not balancing).
nConfig.COMMSH MUST be 0: with COMMSH = 1 the part shuts down (FETs off) when SCL and SDA are both held low, which is exactly the state of I2C_M_* with the main controller off (design §B11, F-10). Answers design §16 rank 17.
"""

[[group]]
id = "fuse"
title = "F101 main fuse 25 A (Littelfuse 456 NANO2) VBAT_PACK -> VBAT_SYS"
note = """
0456025.ER: 25 A, very fast-acting, 1000 A interrupting at 32 V DC, cold resistance 1.92 mOhm, melting I2t 45 A2s (456 series datasheet rev. 04/27/16). Drop at 9.2 A: 18 mV, 0.16 W.
DEPARTURE: the design asks for 'time-lag'; no surface-mount 25 A time-lag fuse was found. 100 % rating carries 4 h minimum; 9.2 A average is 37 % of rating; the 21 A peaks are switching ripple drawn from the charger's bulk capacitors, not through this fuse at full height [VERIFY with the charger input filter on 10].
Coordination: a hard short on VBAT_SYS is ended by the MAX17320 short-circuit comparator (65 A, 192 us); the fuse is the backup for a failed protector (FET short).
"""

[[group]]
id = "load"
title = "Battery-under-load test: 2 x 0.40 ohm PWR263S in series, Q103, hardware on-time limit (TLV7031 + RC + BAS116, 131-224 ms), not re-armed by toggling"
note = """
Load: R102 + R103 = 0.80 ohm (DEPARTURE from 0.82 ohm: 0.82 is not a catalogue value of a part with a published pulse rating; two in series halve the energy per part). At 8.4 V: 8.4 / 0.809 ohm (incl. FET, fuse, sense, FETs) = 10.4 A, 86 W, 43 W per resistor; 100 ms test = 4.3 J per resistor.
Pulse rating: Bourns PWR263S-35 'Pulse Power Rating' graph reads about 8 J at 0.1 s (graph ends at 0.1 s) -> 4.3 J at 100 ms has 1.9x margin; the worst-case 224 ms hardware limit gives 9.6 J per resistor, beyond the graph [UNVERIFIED: VERIFY with Bourns; short-term overload 2 x Pr = 70 W per part is stated for R < 2 ohm, 43 W is below it]. Design target 25 J single pulse in total = 12.5 J per part: [UNVERIFIED].
Time limit (issue 3, rev 0.3 A-2, I-25): BAT_LOAD_EN (100k pull-down R110, contract) is AC-coupled by C108 2.2 uF into LT_NODE. While LT_NODE is positive it decays through D101 BAS116 and R111 78.7 k; when it is negative D101 blocks, so it can only creep back through R117 4.7 M and through R112 4.7 M into the comparator's input clamp: tau about 5 s. U102 turns Q103 on while LT_IN is above about half of 3V3_MAIN: on at a rising edge, off when the node decays below the threshold, off at once when BAT_LOAD_EN falls (node steps to about -3 V). R116 1 M adds hysteresis: threshold 1.73 V while on, 1.57 V while off (at 3.3 V). Ratiometric to 3V3_MAIN.
Why the diode: as issue 2 drew it (R111 straight to GND) a line toggled at 10-100 Hz re-armed the timer every cycle and kept 14.5-22.7 W in R102 + R103 [SIM logic-relay §4.3]. With D101 the node stays negative after each falling edge, so the next rising edge does not reach the threshold.
On-time: with the diode the decay ends near the diode drop instead of 0 V, so 118 k would give 255 ms [SIM logic-relay §4.3]; R111 lowered to 78.7 k: 255.5 x 78.7 / 118 = 170 ms [CALC]. WP-A check run (behavioural ngspice, logic-relay models plus a TLV7031 input clamp; capture notes WP-A rev 0.3): 133.6 / 174.7 / 220.9 ms with C108 at x0.765 / x1.000 / x1.265 [SIM, comparator offset not varied] -> band about 131-224 ms with the +/-8 mV offset and 1 % parts [CALC], inside the contract's <= 250 ms. Firmware uses <= 100 ms (FW-19), below the 131 ms minimum.
DEPARTURE from the change order (R112 = 100 k): R112 is 4.7 M. TLV7031 inputs are diode-clamped to V- (SLVSE13J §6.4.1), and that clamp puts charge back into C108 through R112 on every low half-cycle while D101 + R111 take it out on every high half-cycle. With R112 = 100 k (comparable to R111) the two balance and toggling works again: 10-14.5 W at 4-100 Hz, 25-50 % duty, 4-14 W at 0.5-2 Hz, i.e. as bad as issue 2 [SIM, WP-A check run with a clamp diode; logic-relay battery.cir has no input clamp, which is why it showed 1.8-2.2 W]. With R112 = 4.7 M (60 x R111): <= 0.77 W at 0.2-10 Hz, 10-50 % duty, 0 W from 0.5 Hz up [SIM]; 1 M was not enough (up to 5.8 W at 10 % duty) [SIM]. Clamp current at -3.3 V: 0.6 uA << 10 mA (SLVSE13J abs max). Input bias 2 pA typ, doubling per 10 C (about 0.13 nA at 85 C [CALC]) x 4.7 M = 0.6 mV: negligible against the 160 mV hysteresis step. No phase reversal for inputs beyond the rails (SLVSE13J §6.4.1): a negative input keeps the output low (load off).
Limitation still open: once the line has been low for several seconds the timer is fully re-armed, so a line toggled that slowly still gets one pulse per cycle (0.77 W average at 0.2 Hz, 10 % duty [SIM]); FW-19 (<= 100 ms, not repeated within 1 s) is the firmware rule on top.
Unpowered: 3V3_MAIN off -> U102 unpowered -> R115 holds the gate low (load off). R11: an open or unpowered BAT_LOAD_EN reads 'load off'.
Q103 CSD17573Q5B: 30 V, IDM 400 A, RDS(on) 1.45 mOhm max at VGS 4.5 V; at the comparator's ~3.2 V gate drive RDS(on) is only given by the curve [UNVERIFIED value, VGS(th) 1.1-1.8 V]; even 10 mOhm would dissipate 1 W for 0.2 s.
"""

