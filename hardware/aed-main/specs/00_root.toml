# Root page of aed-main: what this project is, how it is organised, and the warning that goes with it.
# NOT FOR CONSTRUCTION — unreviewed design.

[sheet]
name = "00_root"
title = "Open AED main electronics: block index"
source = "docs/HARDWARE_DESIGN.md; hardware/aed-main/contract.md"

[[group]]
id = "warning"
title = "NOT FOR CONSTRUCTION — unreviewed design"
note = """
These circuit diagrams were drawn with AI assistance and have NOT been reviewed by a qualified high-voltage or medical-device engineer. They may contain errors that would make a built circuit dangerous or useless. The storage capacitor holds about 190 J at about 2,000 V, far above the level that stops a heart, and keeps it after the power is off.
Nobody builds, powers or probes anything from these files until a qualified engineer has reviewed them, the project's lab safety policy exists, and a patent attorney has looked at freedom to operate (SAFETY.md section 2a, DECISIONS.md D-10, D-13, D-18). Nothing here is safe or ready for use on a person or animal.
"""

[[group]]
id = "about"
title = "How this project is organised"
note = """
One KiCad project, 16 block sheets (contract issue 2, after the independent review and decisions D-59 to D-61). Pages 2-10 (sheets 01-09) are the low-voltage group: power, the two controllers, user interface, the two capacitor-voltage chains and the hardware interlock. Pages 11-17 (sheets 10-16) are the high-voltage and patient group: charger, storage and discharge, the shock sequencer, the output bridge, the patient relay and pad connector, and the two front ends. If the layout uses two boards, the split runs between the groups (contract.md section 6).
Design: docs/HARDWARE_DESIGN.md. Net names, reference blocks and who captures what: hardware/aed-main/contract.md. Generated by tools/schgen from the pin tables in specs/; never edit a .kicad_sch by hand (docs/HARDWARE_WORKFLOW.md).
"""

[[group]]
id = "safety"
title = "The three independent checks before a shock, and what happens after it starts (D-59)"
note = """
1. Main controller (04): requests the shock (SHOCK_REQ) and holds discharge path A off (HOLD_M_CLK, a signal only running code can produce).
2. Supervisor (05): gives a short permit (PERMIT_CLK, same kind of signal) and holds discharge path B off (HOLD_S_CLK).
3. Hardware interlock (09, 11): the bridge supply BRIDGE_5V comes up only with request AND permit AND both paths proven held off AND inside a 150 ms window; the charger runs only while both paths are proven held off (D-25).
Consent is needed to START a shock. Once current has started, the sequencer (12) keeps the bridge powered to the end of the planned pulse, never longer than a latched 25 ms hardware cap, turns the switches off low side first, returns the pads, and locks out until consent is removed. A low-voltage test permit (D-61) exercises the interlock and the switches into an internal test load only; in test mode the patient relay cannot move.
"""
