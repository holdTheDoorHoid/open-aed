# Root page of aed-main: what this project is, how it is organised, and the warning that goes with it.
# NOT FOR CONSTRUCTION — unreviewed design.

[sheet]
name = "00_root"
title = "Open AED main electronics: block index"
source = "docs/HARDWARE_DESIGN.md; hardware/aed-main/contract.md"

[[group]]
id = "warning"
title = "NOT FOR CONSTRUCTION — unreviewed design"
note = """
These circuit diagrams were drawn with AI assistance and have NOT been reviewed by a qualified high-voltage or medical-device engineer. They may contain errors that would make a built circuit dangerous or useless. The storage capacitor holds about 190 J at about 2,000 V, far above the level that stops a heart, and keeps it after the power is off.
Nobody builds, powers or probes anything from these files until a qualified engineer has reviewed them, the project's lab safety policy exists, and a patent attorney has looked at freedom to operate (SAFETY.md section 2a, DECISIONS.md D-10, D-13, D-18). Nothing here is safe or ready for use on a person or animal.
"""

[[group]]
id = "about"
title = "How this project is organised"
note = """
One KiCad project. Pages 2-10 (sheets 01-09) are the low-voltage group: power, the two controllers, user interface, the two capacitor-voltage chains and the hardware interlock. Pages 11-16 (sheets 10-15) are the high-voltage and patient group: charger, storage and discharge, output bridge, patient relay and pad connector, and the two front ends. If the layout uses two boards, the split runs between the groups (contract.md section 6).
Design: docs/HARDWARE_DESIGN.md. Net names, reference blocks and who captures what: hardware/aed-main/contract.md. Generated by tools/schgen from the pin tables in specs/; never edit a .kicad_sch by hand (docs/HARDWARE_WORKFLOW.md).
"""

[[group]]
id = "safety"
title = "The three independent checks before a shock (docs/ARCHITECTURE.md)"
note = """
1. Main controller (04): requests the shock (SHOCK_REQ) and holds the discharge path (HOLD_M).
2. Supervisor (05): gives a short dynamic permit (PERMIT_CLK) and holds the discharge path (HOLD_S).
3. Hardware interlock (09, 11): the bridge drive rail BRIDGE_5V exists only with request AND permit AND the discharge path held; the discharge stacks conduct unless BOTH holds are present; the charger runs only while both stacks are held off (D-25).
"""
