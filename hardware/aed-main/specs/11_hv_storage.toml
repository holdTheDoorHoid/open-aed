# 11_hv_storage — storage capacitor terminals, permanent bleeder, both capacitor-voltage sense strings,
# discharge-by-default stacks A and B (4 depletion MOSFETs each) with dump resistors, hold pumps, release
# switches, optocoupler "held" sensing, over-voltage force optocouplers, HV_RTN-GND ties.
#
# NOT FOR CONSTRUCTION — unreviewed design. HIGH VOLTAGE (up to 2,200 V). This file is a circuit description
# for review (SAFETY.md §2a, CLAUDE.md rule 2); it is not an instruction to build, power or test anything.
#
# Work package WP-F (contract.md issue 3). Design source: docs/HARDWARE_DESIGN.md v0.3 §B5, §B9.1, §13, §15, §F-7.
# Revision 0.3 applied 2026-11-27 from capture-notes/rev3-changes.md section WP-F (F-1..F-12); simulation of the
# circuit as drawn: hardware/aed-main/sim/rev3-wpf/. New references 1127-1134, 1137-1144, 1194-1199, U1105-U1106,
# TP1107-TP1108 and overflow R6101-R6122 (contract §2: NN01 + 5000; R6115-R6122 are WP-F's own addition W-1).
# Capture notes, arithmetic, failure table and every departure: hardware/aed-main/capture-notes/WP-F.md.
# References 1101-1199 (contract §2). The test relay K1301 and the 200 ohm test load R1303 are on 13_hv_bridge
# (contract §2), not on this sheet.
#
# Net-name conventions on this sheet (contract R2/R3, net classes in hierarchy.toml):
#   HV_*      nets that can sit at hundreds of volts: stack nodes, string taps, upper gates (class HV)
#   HV_RTN    capacitor negative / stack sources (class RTN_PULSE), joined to GND only at NT1101 || NT1102
#   STKA_*, STKB_*, PMPA_*, PMPB_*, RLSA_*, RLSB_*, HLDA_*, HLDB_*, VCAPM_DIV, VCAPS_DIV, OVP_*:
#             low-voltage nodes referenced to HV_RTN (within about 20 V of it; bounded by the gate TVS) — Default
#             class. They are galvanically on the capacitor through the stacks, but are NOT high-voltage nodes.

[sheet]
name = "11_hv_storage"
title = "HIGH VOLTAGE: storage terminals, bleeder, sense strings, discharge stacks A/B, hold pumps, held sense, OVP force"
source = "docs/HARDWARE_DESIGN.md v0.3 §B5, §B9.1; contract.md issue 3 §5.4-5.6, §8 sheet 11; capture-notes/rev3-changes.md WP-F; capture notes WP-F.md"
date = "2026-11-27"
comments = ["HIGH VOLTAGE up to 2,200 V on HV_CAP_P and every HV_* net. A charged capacitor must always have a way to empty: two independent depletion stacks (A held off only by the main, B only by the supervisor) plus a permanent bleeder.", "Held = an optocoupler LED lit by the negative gate bias (R-6); TWO independent sensors per stack, each on its own line (rev 0.3, I-4). Open, unpowered or missing = not held. Over-voltage force = a further opto per stack shorting the bias (R-10).", "Rev 0.3: 1,700 V IXTT2N170D2 devices, steered upper gates (GP02-40 || 22 M, 100 M gate-source), 4 x (2 x 10 M) string (WP-F W-1), 10 M + 3.3 nF across every device, 470 ohm pump output, MMBFJ270 pilots, 4.3 V zeners. Capture WP-F 2026-11-27; departures and simulations in hardware/aed-main/capture-notes/WP-F.md."]

[nets]
power = ["GND", "HV_RTN", "3V3_SUP"]
power_flags = ["HV_RTN"]   # HV_RTN is made on this sheet (contract §4: NT1101 || NT1102)
global = [
  "HV_CAP_P",                               # capacitor +, from 10_hv_charger; loads 11, 13
  "HOLD_A_DRV", "HOLD_B_DRV",               # hold clocks from 09 (A: 3V3_MAIN buffer, B: 3V3_SUP buffer)
  "HOLD_A_HELD_N", "HOLD_B_HELD_N",         # sensor-1 opto transistor to GND -> 09 (47 k + 1 M pull-ups on 09, issue 3)
  "HOLD_A_HELD2_N", "HOLD_B_HELD2_N",       # sensor-2 opto transistor to GND -> 09 (issue 3, I-4)
  "OVP_TRIP",                               # from 08 (push-pull on 3V3_SUP); 100 k default here
  "VCAP_M_TAP", "VCAP_S_TAP",               # scaled taps to 07 / 08, clamped to GND here
  "NTC_CAP_M", "NTC_CAP_S",                 # capacitor-case NTCs via J1102 to 07 / 05
]

[[erc_accepted]]
type = "power_pin_not_driven"
match = "#PWR11001( |$)"
until_sheet = "01_power_battery"
reason = "#PWR11001 is this sheet's GND power symbol (KiCad names the symbol, not the net, in this violation; the number follows generation order and must be updated if parts are added before it). GND is made on 01_power_battery (contract §4), a placeholder in this worktree; no package flags another package's rail."

[[erc_accepted]]
type = "power_pin_not_driven"
match = "#PWR11062( |$)"
until_sheet = "03_power_rails"
reason = "#PWR11062 is this sheet's 3V3_SUP power symbol. 3V3_SUP is made on 03_power_rails (contract §4), a placeholder in this worktree; no package flags another package's rail."

[[erc_accepted]]
type = "isolated_pin_label"
match = "'NTC_CAP_M'"
until_sheet = "07_sense_main"
reason = "NTC_CAP_M has one pin on this sheet (J1102 pin 1); it is biased and read on 07_sense_main, a placeholder in this worktree. Accepted until the other end is captured."

[[erc_accepted]]
type = "isolated_pin_label"
match = "'NTC_CAP_S'"
until_sheet = "05_supervisor_mcu"
reason = "NTC_CAP_S has one pin on this sheet (J1102 pin 3); it is biased and read on 05_supervisor_mcu, a placeholder in this worktree. Accepted until the other end is captured."

[[group]]
id = "terminals"
title = "Capacitor terminals J1101, case-NTC connector J1102, HV_RTN-GND star ties NT1101 || NT1102"
note = "C1101 (the made-to-order 100 uF / >= 2,200 V film capacitor, PARTS_STUDY Appendix A) is OFF-BOARD on J1101 and is not drawn as a part. HV_RTN is the capacitor negative and the source of both stacks; it meets GND only at the two net ties, built as two separate wide bonds so one open bond does not separate them (R-9, fault 11). Every circuit on this sheet that must keep working if they did separate (hold pumps, held sensing, OVP force) is coupled to the GND side by capacitors or light only. J1102 carries the two independent case NTCs (one per controller, D-56); each NTC has its own GND return pin."

[[group]]
id = "bleeder"
title = "Permanent bleeder: 8 x 2.49 Mohm (19.9 Mohm), always connected, its own string"
note = "Last-resort discharge (§B5.6). 273 V and 30 mW per element at 2,182 V. With everything always connected (bleeder, both sense strings, both sharing strings) the capacitor falls from 2,008 V to 50 V in about 41 min; bleeder alone about 2.0 h (arithmetic in WP-F.md)."

[[group]]
id = "sense_main"
title = "Main capacitor-voltage string -> VCAP_M_TAP (1:998, Stackpole HVCR, to 07)"
note = "10 x 4.02 Mohm HVCR2512 + bottom leg 2 x 80.6 kohm in parallel (40.3 kohm) to HV_RTN: ratio (40.2 M + 40.3 k)/40.3 k = 998.5. Tap clamp per R-21: 10 kohm series + TPD1E01B04 (3.6 V stand-off, <= 10 nA at 2.5 V) to GND, not to a reader's rail. One bottom-leg resistor open doubles the reading (R-27). 4.02 Mohm is NOT in the HVCR standard value list (10 M-100 M, rev 9/22/2025): availability to confirm with Stackpole (WP-F.md, contract issue C-2)."

[[group]]
id = "sense_sup"
title = "Supervisor capacitor-voltage string -> VCAP_S_TAP (1:1,001, Vishay TNPV thin film, to 08)"
note = "20 x 1.99 Mohm TNPV1206 (0.1 %, 25 ppm/K, < 1 ppm/V) + bottom leg 2 x 79.6 kohm TNPW1206 in parallel: ratio (39.8 M + 39.8 k)/39.8 k = 1,001. DEPARTURE: the contract names 12 x 3.32 Mohm TNPV1206, but TNPV1206 stops at 2.0 Mohm (datasheet 28881, 29-Apr-2026); same total resistance, 109 V per element. Shares no part, maker or footprint row with the main string or the bleeder (D-28). Tap clamp as the main string."

[[group]]
id = "stackA"
title = "STACK A (held off only by the MAIN): dump resistors R1101-R1103 + Q1101 (bottom) ... Q1104 (top) IXTT2N170D2, steered gate feeds, sharing string, per-device RC, gate clamps"
note = "Normally ON: with no gate bias every IXTT2N170D2 (1,700 V) conducts (VGS = 0, RDS(on) <= 6.5 ohm) and the capacitor empties through 3 x 1.5 kohm. Rev 0.3 (cfg 5 of sim/charger-storage, I-3): sharing string of 4 elements, each 2 x 10 Mohm in parallel (5.0 Mohm; WP-F change W-1 replaces the change order's single 4.7 Mohm so that one open resistor cannot remove a tap reference), + 3.3 nF per element; each upper gate fed tap -> 100 k -> GP02-40 steering diode (anode at the tap side) bypassed by 22 Mohm -> gate, 100 Mohm gate-source, 15 V TVS gate-source; and 10 Mohm + 3.3 nF directly across EVERY device (essential: with a steered gate a leaky device's source can float). The diode stops a shorted device's clamp current from dragging the tap below, so one shorted device puts about V/2 on a neighbour instead of nearly all of it [SIM]. The v0.2 figure of 727 V with one device shorted was wrong (I-3). Results and margins: WP-F.md, Revision 0.3."

[[group]]
id = "holdA"
title = "Stack A hold: HOLD_A_DRV (1.5 kHz) -> 4-stage pump -> 470 ohm -> bottom gate STKA_G; release Q1109 with MMBFJ270 pilot; two held optos U1101/U1105 -> HOLD_A_HELD_N / HOLD_A_HELD2_N"
note = "Everything here is referenced to HV_RTN at the stack and coupled to the GND side only through the pump capacitors and the optocouplers (R-9). Pump: 4-stage single-clock, BAT54S pairs, 2.2 uF; last stage PMPA_H4 -> R1194 470 ohm -> STKA_G (rev 0.3, breaks the cold power-up lock-out); reservoir 3.3 uF; 1.01 Mohm gate-source with 1/3 test tap. Requirement (rev 0.3): BOTH sensors held, HELD_N <= 1.0 V, at -20 C, 3.1 V clock, 1.35-1.65 kHz, aged sensors (met [SIM]); release <= 25 ms with the clock stopped LOW (firmware rule). Release: MMBFJ270 P-JFET pilot (VGS(off) 0.5-2.0 V), normally on, pinched off only while the 3-stage BAV199 pump biases it; when the clock stops it turns on Q1109 (BSS138), which empties the gate. Held sense, two identical independent strings: HV_RTN - 3.9 k - MMSZ4687 4.3 V - TLP187 LED (22 k across) - STKA_G; each reads held only below about -4.95..-6.12 V [SIM]; each Darlington on its own line to 09, HOLD_OK = all four lines low. Open, unlit or unpowered = high = not held."

[[group]]
id = "stackB"
title = "STACK B (held off only by the SUPERVISOR): dump resistors R1104-R1106 + Q1105 (bottom) ... Q1108 (top) IXTT2N170D2, steered gate feeds, sharing string, per-device RC, gate clamps"
note = "Identical to stack A, own parts, own string, own nodes. No part or net is shared between the stacks except HV_CAP_P and HV_RTN."

[[group]]
id = "holdB"
title = "Stack B hold: HOLD_B_DRV (1.5 kHz) -> 4-stage pump -> 470 ohm -> STKB_G; release Q1110 with MMBFJ270 pilot; two held optos U1102/U1106 -> HOLD_B_HELD_N / HOLD_B_HELD2_N"
note = "Identical to stack A's hold circuit (R1195 470 ohm; second sensor R1198, D1134, R1199, U1106, TP1108). HOLD_B_DRV comes from the 3V3_SUP buffer on 09 (supervisor's clock HOLD_S_CLK)."

[[group]]
id = "ovp"
title = "Over-voltage force (R-10): OVP_TRIP -> Q1111 -> one TLP187 LED per stack; transistors short each bottom gate to HV_RTN"
note = "OVP_TRIP high (08 comparator, 2,107 V nominal, latched until OVP_RST, contract issue 3) turns Q1111 on; 3V3_SUP drives about 8 mA through each LED (separate 240 ohm resistors, so one open LED does not disable the other). Each Darlington (collector HV_RTN, emitter STKx_G, VCEO 300 V) sinks >= 35 mA, which overpowers its running pump (short-circuit current about 10-15 mA [SIM]) and pulls the gate to about -0.4..-1 V: both stacks conduct even while both controllers keep clocking. Default: OVP_TRIP pulled down 100 k here (contract §5.4) -> no LED current -> no force. 3V3_SUP is used on this sheet for these LEDs only (contract §4)."

