# ------------------------------------------------------------------ groups
[[group]]
id = "tap"
title = "VCAP_M_TAP input: 100 kOhm + 10 nF, OPA333 zero-drift follower"
note = """
VCAP_M_TAP = Vcap x 40.3 k / (40.2 M + 40.3 k) = Vcap / 998.5 (string on 11). 1,950 V -> 1.953 V; 2,200 V -> 2.203 V; 60 V -> 60.1 mV.
R701 100 kOhm meets R7 (reader may be unpowered while the capacitor is charged): tap clamp 3.6 V on 11 -> at most (3.6 - 0) / 110 k = 33 uA into U704's input clamp diodes (OPA333 abs. max. +-1 mA, SBOS351E 6.1). No extra clamp here: any diode added would leak into the 50 kOhm source.
R701 + C701 (10 nF C0G): 1.6 ms time constant, -3 dB 159 Hz. Lag during a charge: 205 V/s x 1.6 ms = 0.3 V (within the 1 ms loop's 0.2 V overshoot budget, §B4.4).
U704 OPA333: Vos 10 uV max, 0.05 uV/K; IB 200 pA max at 25 C, 150 pA typ over temperature (SBOS351E 6.6) -> 1 nA assumed worst case x 150 kOhm source = 0.15 mV = 0.15 V of capacitor voltage. Output swing to the negative rail is the limit near 0 V: readings below about 10 mV (10 V) are not linear [UNVERIFIED at this load].
R702 1 MOhm to 3V3_MAIN at the follower output: a failed-open follower output reads FULL SCALE (over-voltage, LOWV_OK low = not permitted) rather than 0 V. The follower sinks 3.3 uA at the LOWV threshold.
"""

[[group]]
id = "adc"
title = "ADS1220 24-bit ADC, PGA bypassed, ratiometric to VREF_M (REF3425)"
note = """
AIN0 = buffered VCAP (R703 1 k + C703 10 nF C0G), AIN1/AIN2 = OUT_A/OUT_B taps, AIN3 = capacitor NTC. Firmware: single-ended inputs referred to AVSS (MUX 1000b-1011b) need PGA_BYPASS = 1, gain 1 (SBAS501D 8.3.2.2); input range AVSS-0.1 to AVDD+0.1 V; full scale = VREF_M = 2.5 V = 2,496 V of capacitor voltage. Reference: REFP0/REFN0 (external, VREF = 2.5 V).
Gain error (PGA disabled) 0.015 % typ, gain drift 1 ppm/K typ (4 ppm/K max is the PGA-enabled figure, used in the budget), INL 15 ppmFSR max, offset drift 0.3 uV/K max (SBAS501D 6.5). Absolute input current with PGA bypassed is given only as typical curves (Fig 6-21..6-24): 20 nA assumed -> 20 uV across R703.
CLK tied to DGND (internal oscillator, Table 5-1). DRDY and DOUT/DRDY both go to the main controller. HVM_CS_N pulled up by R712 100 kOhm (contract §5.6).
Decoupling: AVDD 100 nF + 1 uF, DVDD 100 nF (Table 5-1: >= 100 nF).
"""

[[group]]
id = "ref"
title = "VREF_M = 2.5 V, REF3425 (TI), main chain only"
note = """
REF3425IDBVR: +-0.05 % initial, 6 ppm/K max, 25 ppm / 1000 h then 10 ppm, thermal hysteresis 30 ppm (SBAS804G 6.5). VIN 3V3_MAIN: dropout 100 mV max at 0 mA, load here about 0.5 mA (NTC bias 0.25 mA max, threshold divider 53 uA, ADC reference 10 nA). Output capacitor 4.7 uF (stable 0.1-10 uF), input 100 nF. EN tied to IN. Force and sense joined at the part; sense routed to REFP0 at layout.
VREF_M is drawn as a power symbol made here (contract §4) by the reference's power_out pin; it is used on this sheet only.
"""

[[group]]
id = "lowv"
title = "LOWV_OK: capacitor below about 55 V (D-61, §B14), LMV761 push-pull on 3V3_MAIN"
note = """
U703 -IN = buffered tap through R704 10 k / C704 100 nF (1 ms). +IN = threshold from VREF_M: R705 46.4 k / R706 1.00 k (0.1 %) = 52.74 mV, hysteresis R707 1.62 M from the output.
Output HIGH (LOWV_OK) while tap < threshold. Thresholds [CALC]: OK -> not OK at tap 54.70 mV = 54.6 V; not OK -> OK at 52.71 mV = 52.6 V (2 V hysteresis).
Band [CALC, worst case]: LMV761 Vos +-1 mV over temperature (SNOS998I 6.6), follower 0.16 mV, resistors 0.1 % + 25 ppm/K, VREF 0.1 %, divider ratio +-1.5 % uncalibrated -> 50.4 V to 57.0 V. Requirement: OK only below 60 V -> fits with 3 V margin; S refuses a test permit above 50 V on its own chain (§13 fault 32).
Default: unpowered or off -> output low via the 100 kOhm pull-down on 09 = NOT OK (R11). An open VCAP_M_TAP reads 0 V = "OK": see capture notes, contract issue C-3.
SDB (shutdown, active low) tied to V+ (always on).
"""

[[group]]
id = "outs"
title = "Bridge output taps OUT_A_TAP, OUT_B_TAP (shorted-switch and test-relay checks)"
note = """
1:1,000 dividers and clamps to GND are on 13. Here: 100 kOhm (R7) + 10 nF C0G each (1 ms) into AIN1/AIN2. Error from the ADC's typical 20 nA input current x 100 k = 2 mV = 2 V of output voltage: irrelevant for 'near 0' versus 'capacitor voltage' decisions (§B14.3, F-8).
"""

[[group]]
id = "ntc"
title = "Capacitor-case NTC NTC_CAP_M (D-56), ratiometric to VREF_M"
note = """
NTC (10 k, B tolerance <= 1 %, §B9.2) is on the capacitor, wired from J1102 on 11 between NTC_CAP_M and GND [assumption: sheet 11 returns the NTC to GND]. Bias R710 10.0 k 0.1 % from VREF_M; AIN3 = 2.5 V x Rntc / (Rntc + 10 k): -20 C (about 68 k) 2.18 V, 25 C 1.25 V, 70 C (about 2 k) 0.42 V. Ratiometric: the reference value cancels.
R711 1 k + C708 100 nF filter. With 3V3_MAIN off, VREF_M is 0 V and nothing drives the NTC line (R7 satisfied).
"""

