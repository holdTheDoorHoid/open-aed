# 07_sense_main - main controller's capacitor-voltage chain, output-node sense inputs, capacitor NTC, LOWV_OK.
# NOT FOR CONSTRUCTION — unreviewed design.
# Source: docs/HARDWARE_DESIGN.md §B9.1, §B9.2, §B14; contract.md issue 2 §5.4, §5.6, §5.7, §8 (sheet 07).
# References 701-799. Work package WP-C. Arithmetic: hardware/aed-main/capture-notes/WP-C.md.
# The high-voltage divider string itself (10 x 4.02 MOhm HVCR2512 + 2 x 80.6 kOhm) and its tap clamp
# (10 kOhm + 3.6 V to GND) are on 11_hv_storage; this sheet receives only VCAP_M_TAP (1:998.5).

[sheet]
name = "07_sense_main"
title = "Main capacitor-voltage chain: ADS1220 + REF3425, output-node sense inputs, capacitor NTC, LOWV_OK (60 V) comparator"
source = "docs/HARDWARE_DESIGN.md §B9, §B14; contract.md §5.6"
date = "2026-11-27"
comments = [
  "Every part here is TI and runs from 3V3_MAIN only; the supervisor chain (08) uses a different ADC, reference and op-amp family on 3V3_SUP (D-28).",
  "Each signal from another board (VCAP_M_TAP, OUT_A_TAP, OUT_B_TAP) enters through 100 kOhm (rule R7): an unpowered reader is fed at most 36 uA from a 3.6 V clamped tap.",
]

[nets]
power = ["GND", "3V3_MAIN", "VREF_M"]
global = [
  "VCAP_M_TAP",          # 11 -> 07, scaled capacitor voltage 1:998.5
  "OUT_A_TAP", "OUT_B_TAP",   # 13 -> 07, bridge output nodes 1:1,000
  "NTC_CAP_M",           # 11 (J1102) -> 07, capacitor-case NTC to GND
  "HVM_SCLK", "HVM_MOSI", "HVM_CS_N",   # 04 -> 07
  "HVM_MISO", "HVM_DRDY_N",             # 07 -> 04
  "LOWV_OK",             # 07 -> 09, high = capacitor below about 55 V
]

